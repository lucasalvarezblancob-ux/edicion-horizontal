sarela_02-lateral-silueta-con-el-sol_manga-larga-negra.MOV @ 0–2,5 → recursos/running/2025-10-20_correr-carril-dunas-atardecer_03-lateral-cerca-mar_camiseta-gris-pantalon-oliva.MOV @ 0–2", "nota": "Si lo que hiciste fue una sesión larga de bici (medio Ironman), di 'en la bici' y GRABA 3–4 planos tuyos pedaleando sin camiseta (de lado, piernas y de espaldas). Pon la cifra real."}, {"texto": "Y sorprendentemente, vi cosas que en [X] años corriendo por ahí no había visto, como [esta pintada], o esto.", "plano": "recursos/running/2026-10-18_correr-calle-ladrillo_espaldas-y-lado_manga-larga-negra.MOV @ 19–21 (se gira y sonríe) → GRABAR: 2 detalles absurdos de tu ruta de siempre, 1 s cada uno (una pintada, una señal torcida, un banco raro…)", "nota": "'O esto' con tono seco y cómico: es el chiste."}, {"texto": "Saludé a cada corredor que me crucé, hablé incluso solo, contando farolas.", "plano": "recursos/running/2026-06-23_correr-paseo-dunas_medio-plano-sonriendo_tirantes-negra-aire.MOV @ 4–6 (risa y pulgar arriba) → recursos/running/2025-06-04_selfie-correr-pasarela-dunas-atardecer-sudando_sin-camiseta.MOV @ 8–10 (hablando mientras corre)", "nota": "Con humor ('contando farolas' sustituye a 'contando ovejitas')."}, {"texto": "Y creo que eso era justo lo que necesitaba.", "plano": "recursos/running/2026-03-17_correr-amanecer-pasarela_02-lateral-silueta-con-el-sol_manga-larga-negra.MOV @ 8–12", "nota": "Más bajo y sincero."}, {"texto": "Porque cuando estás constantemente entretenido, no solo te pierdes lo que tienes delante,", "plano": "recursos/running/2026-03-17_correr-amanecer-pasarela_01-pov-y-grupo-a-contraluz.MOV @ 2–5 (lo que tienes delante: el grupo a contraluz)"}, {"texto": "también te pierdes lo que tienes dentro.", "plano": "recursos/running/2025-06-04_selfie-correr-pasarela-dunas-atardecer-sudando_sin-camiseta.MOV @ 5–7 (se pasa la mano por la cabeza, sudado y en paz; corte seco)", "nota": "Pausa de 0,4 s antes de 'también' y acaba bajito."}], "duracion_objetivo_s": 48, "viabilidad_recursos": "media", "que_grabar": ["Sofá: tirado sin camiseta, con los cascos, mirando al techo (3 s, plano fijo).", "Detalles en casa: mano cogiendo el móvil o el mando (1 s), scroll en la pantalla (1 s) y el móvil junto al rollo de papel del baño (1 s).", "2 detalles absurdos de tu ruta de correr habitual (1 s cada uno) para el chiste de 'como esta pintada, o esto'.", "(Opcional, si la historia es de bici) 3–4 planos tuyos pedaleando sin camiseta en la bici o el rodillo: de lado, piernas y de espaldas girándote a sonreír."], "stock": ["Niño pequeño mirando un móvil o una tablet (Pexels: 'child phone screen', 'kid tablet couch')."], "notas_edit": "Calca la estructura en dos capítulos: CASA (sofá, detalles y vida tranquila, etalonaje cálido y apagado) → al llegar a 'Así que estoy probando algo' cambias a EXTERIOR o ENTRENO (correr al amanecer o atardecer, más frío o más dorado). El cambio de color marca el giro, igual que el original pasa de la cocina al gym azul. Un plano cada ≈1,9 s (≈25 planos), corte seco sin transiciones y muchos detalles cerrados. Subtítulos palabra a palabra, pequeños, blancos, sans redonda en minúscula y sin puntuación, centrados sobre el cuerpo o una zona lisa; en la 1.ª frase acumula las palabras escalonadas arriba. Música de piano o ambiente con notas largas, emotiva, alta y constante bajo la voz (no phonk). Quita el audio de los clips. En 'o esto' deja 1 s del detalle en silencio de voz para que el chiste respire. Unifica outfits con el etalonaje: en la parte de correr hay sin camiseta, manga larga negra y tirantes; si puedes, agrupa los dos del 2026-03-17 (manga larga negra) y los dos del 2025-06-04 (sin camiseta) seguidos. Caption en la línea del original: 'abúrrete un poco más :)'.", "palabras_guion_lucas": 174}, {"id": "Ddo7IYUAbMi", "creador": "gerardfelipx", "seguidores": 179000, "visitas": 200000, "likes": 8324, "comentarios": 139, "duracion_s": 38.2, "url": "https://www.instagram.com/reel/Ddo7IYUAbMi/", "formato": "Confesión de decisión vital + día a día (b-roll de rutina)", "resumen": "Anuncia que deja su trabajo con 21 años aunque el contenido aún no le da para vivir, admite sus privilegios (vive con sus padres) y reencuadra el cliché: 'cuando no eliges, ya estás tomando una decisión'. Lo distinto es la honestidad sin épica sobre un b-roll cotidiano (cocina, sofá, moto, spinning) cortado a 1 plano por segundo.", "gancho_voz": "He dejado mi trabajo.", "gancho_texto_pantalla": null, "gancho_visual": "0–1,3 s: sin camiseta en un balcón de ladrillo con luz de tarde, palmera en primer plano, mirando a un lado (físico + escena doméstica real). 1,3–2,4 s: se gira y hace doble bíceps de espaldas. Los subtítulos 'he / dejado / mi / trabajo' van apareciendo y se acumulan sobre su pecho.", "guion_original": [{"t": "0.0–1.2", "texto": "He dejado mi trabajo.", "plano": "Balcón de ladrillo, sin camiseta y chándal negro Gymshark, de pie mirando a un lado; palmera delante."}, {"t": "1.3–4.0", "texto": "Tengo 21 años y llevo 3 cobrando una nómina cada mes.", "plano": "1,3–2,4 se gira y hace doble bíceps de espaldas · 2,4–4,2 frente a la pared de ladrillo con la barra de dominadas bajo el toldo, círculos de brazos (calienta)."}, {"t": "4.3–6.0", "texto": "Hace un año empecé con esto de subir contenido", "plano": "4,2–5,7 estira un brazo cruzado y se pone de espaldas · 5,7–6,9 contrapicado cerrado: agarra la barra."}, {"t": "6.4–9.6", "texto": "y aunque, sinceramente, aún no da para vivir, he decidido dar el paso.", "plano": "6,9–7,7 dominadas de espaldas · 7,7–8,7 abre la puerta corredera del balcón y entra · 8,7–10,0 cocina: casca un huevo en un bol (manos, shakers detrás)."}, {"t": "10.0–14.4", "texto": "Trabajar 40 horas, entrenar para un ultramaratón, estudiar una carrera y crear contenido no es sostenible.", "plano": "Un plano por elemento: 10,0–11,0 él con camisa estampada en su trabajo (mostrador de cristal) · 11,0–12,4 bici de spinning en gym azul oscuro · 12,4–13,4 en el sofá con el portátil (estudiar) · 13,4–14,2 manos con cámara y micro en un gimbal · 14,2–15,3 bate el huevo."}, {"t": "15.2–18.4", "texto": "Llevo meses durmiendo 6 horas con miedo a elegir para no cagarla,", "plano": "15,3–15,8 echa aceite a la sartén · 15,8–17,0 vierte el huevo · 17,0–18,6 cocinando sin camiseta, plano entero de la cocina."}, {"t": "18.5–22.3", "texto": "pero, joder, vivo con mis padres. Tengo pocos gastos y además buscaré algo de media jornada.", "plano": "18,6–19,2 la tortilla en el plato · 19,2–20,0 sentado con el portátil · 20,0–21,6 tumbado en el sofá con el portátil · 21,6–22,9 lo cierra y se levanta."}, {"t": "23.0–25.5", "texto": "Así que no, mi mensaje no es «deja tu trabajo y persigue tus sueños».", "plano": "22,9–24,5 pasillo: se pone la chaqueta de moto (Dainese) y el casco · 24,5–25,4 sale de plano (puerta vacía) · 25,4 calle: en la moto."}, {"t": "26.1–28.5", "texto": "Mi mensaje es que cuando no eliges, ya estás tomando una decisión.", "plano": "25,4–27,8 se sube a la moto y arranca · 27,8–29,3 gym: sin camiseta se gira y sonríe a cámara (la única sonrisa del vídeo)."}, {"t": "29.3–32.7", "texto": "Yo no sé si esto va a salir bien, pero sé que es momento de intentarlo y de equivocarme,", "plano": "Spinning en gym azul: 29,3–30,7 lateral · 30,7–31,7 más cerca · 31,7–32,5 de cerca · 32,5–33,4 primer plano de las piernas pedaleando."}, {"t": "33.5–37.5", "texto": "porque prefiero cagarla intentando construir la vida que quiero que quedarme en un sitio que no es el mío.", "plano": "33,4–34,3 perfil en la bici · 34,3–35,2 hombros de lado · 35,2–36,2 de espaldas en la bici · 36,2–37,3 espalda de cerca · 37,3–38,2 se inclina para bajarse. Termina sin mirar a cámara."}], "estructura": [{"bloque": "Gancho", "t": "0–1,2", "funcion": "Noticia de alto riesgo en 4 palabras: el cerebro predice drama/éxito y abre la pregunta '¿y de qué vas a vivir?'."}, {"bloque": "Contexto con cifras", "t": "1,3–9,6", "funcion": "21 años, 3 de nómina, 1 de contenido: datos concretos que lo hacen creíble y permiten compararse; admite que aún no da para vivir (baja la guardia del escéptico)."}, {"bloque": "Problema (sobrecarga)", "t": "10–18,4", "funcion": "Lista de 4 cargas + 6 horas de sueño + miedo a elegir: el espectador siente el agobio y se identifica."}, {"bloque": "Desactivar críticas", "t": "18,5–22,3", "funcion": "'Vivo con mis padres… buscaré media jornada': reconoce el privilegio antes de que lo digan en comentarios."}, {"bloque": "Giro / tesis", "t": "23–28,5", "funcion": "Niega el cliché ('no es deja tu trabajo y persigue tus sueños') y da la frase que se queda: 'cuando no eliges, ya estás tomando una decisión'."}, {"bloque": "Cierre abierto", "t": "29,3–37,5", "funcion": "No sabe si saldrá bien; prefiere equivocarse a quedarse donde no es el suyo. Final sin resolver → apoyo en comentarios y ganas de seguir la historia."}], "edicion": {"num_planos": 37, "s_por_plano": 1.03, "subtitulos": "Palabra a palabra, Montserrat SemiBold blanca pequeña (≈40 px sobre 1440 de ancho), sin caja ni color de acento, a media altura sobre el cuerpo. En frases cortas las palabras se acumulan en posiciones escalonadas ('he / dejado / mi / trabajo') y se borran al empezar la siguiente; en el resto sale una palabra cada vez.", "texto_pantalla": "Ninguno aparte de los subtítulos (ni título ni CTA en pantalla).", "musica": "Instrumental suave de fondo durante todo el vídeo, ≈9–10 dB por debajo de la voz (−24/−26 dB en las pausas), pulso ≈118 bpm con percusión ligera. No identificada.", "efectos": "Solo cortes secos, sin transiciones, zooms ni sonidos. Color natural: cálido de tarde en casa, frío y azul en el gym. Hilo visual recurrente (huevo → sartén → tortilla → plato) que cose el día a día.", "voz": "Confesional, tranquila y firme, sin dramatizar; 3,9 pal/s (145 palabras en 37,5 s), pausas cortas entre frases."}, "por_que_funciona": [{"momento": "0.0–1.2 · «He dejado mi trabajo.» sobre el físico en el balcón", "mecanismo": "Error de predicción + bucle abierto", "explicacion": "Una decisión irreversible dicha en seco, sin contexto, rompe el patrón de 'vídeo de fitness' y abre una pregunta que el cerebro necesita cerrar (¿de qué vive?, ¿le irá bien?). El físico en un escenario doméstico da el estatus suficiente para que el pulgar se pare."}, {"momento": "1.3–4.0 · «Tengo 21 años y llevo 3 cobrando una nómina»", "mecanismo": "Especificidad de cifras + autorreferencia", "explicacion": "Edad y años de nómina concretos: suena a verdad, no a frase de gurú, y cualquier veinteañero con curro se compara al instante ('yo también llevo X')."}, {"momento": "6.4–9.6 · «sinceramente, aún no da para vivir»", "mecanismo": "Vulnerabilidad auténtica", "explicacion": "Admitir que el contenido no da dinero rompe la expectativa de 'lo he petado' y genera confianza; los comentarios son de ánimo ('Arriesgarse es de valientes', 'Todo te va a salir bien'), que hacen subir la interacción."}, {"momento": "10.0–14.4 · lista «trabajar, ultramaratón, carrera, contenido» con un plano por elemento", "mecanismo": "Novedad visual / reflejo de orientación + carga compartida", "explicacion": "Un plano nuevo cada ~1 s en cada elemento de la lista renueva la atención; el ritmo atropellado hace sentir físicamente el 'no es sostenible'."}, {"momento": "18.5–22.3 · «pero, joder, vivo con mis padres»", "mecanismo": "Inoculación (desactivar la crítica)", "explicacion": "Reconoce su privilegio antes de que lo hagan los haters; el taco suena natural. Quita munición a los comentarios negativos y deja solo los de apoyo."}, {"momento": "23.0–28.5 · «mi mensaje no es 'deja tu trabajo y persigue tus sueños'… cuando no eliges, ya estás tomando una decisión» (sonrisa a cámara en 27,8)", "mecanismo": "Contradicción / reencuadre + moneda social", "explicacion": "Niega el cliché que el espectador esperaba y entrega una idea corta y reutilizable que da que pensar; es la frase que se guarda y se manda a un amigo atascado. La única sonrisa a cámara la marca como clímax."}, {"momento": "29.3–37.5 · «no sé si esto va a salir bien… prefiero cagarla…» sobre spinning, sin mirar a cámara", "mecanismo": "Efecto Zeigarnik (historia sin cerrar) + aversión al arrepentimiento", "explicacion": "El desenlace queda abierto: para saber cómo acaba hay que seguirle. 'Prefiero cagarla intentando' toca el miedo a arrepentirse de no haberlo intentado, que pesa más que el miedo a fallar."}], "caption": "supongo que me tenía que arriesgar…\n\n#mentalidad #inspiracion #deporte #superacion", "cta": "Ninguno hablado ni en pantalla; el final abierto empuja a seguirle para ver cómo acaba y la caption invita a dar ánimos en comentarios.", "titulo_lucas": "He dejado [mi trabajo]", "texto_pantalla_lucas": "Sin texto aparte, como el original: solo subtítulos palabra a palabra (las de la 1.ª frase se acumulan: «He / dejado / [mi trabajo]»). Si se quiere uno para una versión de prueba: «He dejado [mi trabajo] para preparar un medio Ironman».", "guion_lucas": [{"texto": "He dejado [mi trabajo].", "plano": "recursos/gym/fisico/2026-06-09_posado-luz-lateral-cuerpo-entero-a-primer-plano_conjunto-azul-gymshark.MOV @ 1–2,3 (cuerpo entero con luz lateral, miras a un lado: el mismo gancho visual)", "nota": "Seco, sin dramatizar. Pausa de 0,3 s. ⚠️ Confirmar qué has dejado de verdad; si no has dejado nada, cambia por una decisión real: «He pedido [reducción de jornada]», «He dicho que no a [un ascenso / un contrato]» o «He dejado [la carrera]», y ajusta las frases 5 y 8."}, {"texto": "Tengo [tu edad] años y llevo [X años] cobrando una nómina cada mes.", "plano": "recursos/gym/fisico/2026-01-22_posado-espalda-doble-biceps_espejo-led_chandal-gris.MOV @ 5–6,2 (doble bíceps de espaldas, el mismo gesto del original) → recursos/gym/hombro/2026-11-01_movilidad-hombro-banda_de-frente.MOV @ 1,4–3,3 (dislocaciones con la banda, calentando)", "nota": "Di las cifras claras: son las que dan credibilidad."}, {"texto": "Hace [X tiempo] empecé con esto de subir contenido", "plano": "recursos/gym/hombro/2026-11-01_movilidad-hombro-banda_de-espaldas.MOV @ 13,5–14,6 (diagonal de espaldas) → recursos/aire-libre/2026-04-20_pasamanos-barras-playa_sin-camiseta-licra-negra.MOV @ 11–12 (agarras las barras, de frente)", "nota": "Sigue sin pausa con la siguiente frase."}, {"texto": "y aunque, sinceramente, aún no da para vivir, he decidido dar el paso.", "plano": "recursos/gym/espalda/2026-11-01_dominadas-sin-camiseta.MOV @ 2–3 → recursos/running/2026-03-17_correr-amanecer-pasarela_01-pov-y-grupo-a-contraluz.MOV @ 0–1 (POV de tus piernas sobre la tarima, justo en «dar el paso») → GRABAR: cascas un huevo en un bol en la encimera, plano lateral a la altura del bol (5 s)", "nota": "«sinceramente» más bajito, como quien lo admite."}, {"texto": "Trabajar [40] horas, preparar un maratón y un medio Ironman, [estudiar] y crear contenido no es sostenible.", "plano": "Un plano por elemento: recursos/lifestyle/2026-09-24_andando-con-portatil-paseo-soleado_tirantes-negra.MOV @ 9–10 (trabajar) → recursos/running/2026-03-17_correr-amanecer-pasarela_02-lateral-silueta-con-el-sol_manga-larga-negra.MOV @ 3–4 (maratón) → GRABAR: pedaleando en la bici (rodillo o carretera), plano lateral, 10 s (medio Ironman) → GRABAR: 1 s de [lo que hagas además] (si no hay nada, quita el elemento) → recursos/running/2026-10-30_selfie-contrapicado-trail-buenos-dias_gafas-rojas-chaleco.MOV @ 1–2 (selfie «¡Buenos días!» = crear contenido) → GRABAR: bates el huevo (1 s)", "nota": "Ritmo de lista, un poco más rápido; cae en «no es sostenible». ⚠️ [estudiar] = lo que hagas además de trabajar (otro curro, estudios…); si no hay nada, quítalo."}, {"texto": "Llevo meses durmiendo [6] horas con miedo a elegir para no cagarla, y para un Ironman eso es entrenar con freno de mano.", "plano": "GRABAR (misma toma de cocina): echas aceite a la sartén (0,6 s) y viertes el huevo (1,2 s) → recursos/running/2025-06-04_selfie-correr-pasarela-dunas-atardecer-sudando_sin-camiseta.MOV @ 5–7 (sudado y reventado te pasas la mano por la cabeza, en «freno de mano»)", "nota": "El «freno de mano» con media sonrisa: es tu toque de humor."}, {"texto": "Pero, joder, [vivo con mis padres]. Tengo pocos gastos y además [buscaré algo de media jornada].", "plano": "GRABAR: la tortilla en el plato (0,6 s) → recursos/lifestyle/2026-09-24_andando-con-portatil-paseo-soleado_tirantes-negra.MOV @ 1–2,5 (con el portátil) → GRABAR: tumbado en el sofá con el portátil, lo cierras y te levantas (2,5 s)", "nota": "⚠️ Confirmar: con qué cuentas de verdad (padres, ahorros, otro ingreso) y qué plan B tienes. El «joder» natural, como quien se lo reconoce a un amigo."}, {"texto": "Así que no, mi mensaje no es «deja tu trabajo y persigue tus sueños».", "plano": "recursos/running/2026-10-24_outfit-trail-se-prepara-en-parking_gafas-rojas-chaleco.MOV @ 1–2,5 (te pones las gafas, como él la chaqueta de moto) → mismo clip @ 64,5–65,5 (te ajustas el chaleco) → recursos/running/2026-10-18_correr-calle-ladrillo_espaldas-y-lado_manga-larga-negra.MOV @ 0–1 (sales corriendo de espaldas)", "nota": "Lo de las comillas con tono de cliché, casi burlón."}, {"texto": "Mi mensaje es que cuando no eliges, ya estás tomando una decisión.", "plano": "recursos/running/2026-10-18_correr-calle-ladrillo_espaldas-y-lado_manga-larga-negra.MOV @ 2–3,5 → recursos/running/2026-06-23_correr-paseo-dunas_medio-plano-sonriendo_tirantes-negra-aire.MOV @ 4–5,5 (te ríes a cámara: la única sonrisa del vídeo, en «decisión», como en el original)", "nota": "La frase importante: más lenta, pausa de 0,4 s antes de «ya estás tomando una decisión»."}, {"texto": "Yo no sé si esto va a salir bien, pero sé que es momento de intentarlo y de equivocarme,", "plano": "Bloque de esfuerzo (en el original es spinning): recursos/gym/cardio/2026-08-11_cinta-contrapicado-desde-consola_tirantes-celeste-sudada.MOV @ 2–3,4 → recursos/gym/cardio/2026-11-01_hibrido_skierg-lateral.MOV @ 4,6–5,6 → GRABAR: la bici del punto 5, otro ángulo (0,8 s) → recursos/competicion/2025-11-09_carrera-dorsal-29233_pov-pies-y-dorsal_ropa-blanca.MOV @ 0–0,9 (POV de los pies = el primer plano de las piernas del original)", "nota": "Honesto, sin épica."}, {"texto": "porque prefiero cagarla intentando construir la vida que quiero que quedarme en un sitio que no es el mío.", "plano": "recursos/running/2026-03-17_correr-amanecer-pasarela_02-lateral-silueta-con-el-sol_manga-larga-negra.MOV @ 8–9 → recursos/gym/cardio/2026-11-01_hibrido_cinta-de-frente.mov @ 20–21 → recursos/running/2025-10-20_correr-carril-dunas-atardecer_02-espaldas-y-lateral_camiseta-gris-pantalon-oliva.MOV @ 3–5,5 (de espaldas alejándote al atardecer; cierre abierto, sin celebración)", "nota": "Baja el volumen al final; corta la música justo después de «mío»."}], "viabilidad_recursos": "media", "que_grabar": ["Una sola toma de cocina (≈1 min): cascar un huevo en un bol, batirlo, aceite y huevo a la sartén, tortilla en el plato (planos cerrados de manos, a la altura de la encimera).", "Bici del medio Ironman (≈30 s): pedaleando en rodillo o en carretera, plano lateral + otro más cerrado (piernas).", "Sofá (10 s): tumbado con el portátil, lo cierras y te levantas.", "1 s de [lo que hagas además de trabajar] si existe (estudiar, otro curro…).", "Confirmar los datos entre corchetes: qué dejas, edad, años de nómina, desde cuándo subes contenido, horas de trabajo y de sueño, con qué cuentas y plan B."], "stock": [], "notas_edit": "Calcar el ritmo: ≈1 plano por segundo (32–37 planos en ~39 s), siempre corte seco en el cambio de idea, sin transiciones ni efectos. En las listas, un plano por elemento justo en la palabra. Hilo de la cocina (huevo → bol → sartén → plato) repartido en 4 momentos, como en el original, para que haya una mini historia de fondo. Subtítulos palabra a palabra blancos pequeños (Montserrat SemiBold) a la altura del pecho; en la 1.ª frase y en «Mi mensaje es que…» se acumulan escalonados. Música instrumental suave desde el s 0, ≈9–10 dB bajo la voz, sin subidas. Color: cálido en casa/exterior y frío en gym (no unificar). La única sonrisa a cámara en «decisión». Cierre sin resolver: de espaldas alejándote, sin CTA. Caption tipo «supongo que me tenía que arriesgar…» + 3–4 hashtags (#mentalidad #superacion #ironman #running).", "palabras_guion_lucas": 159, "duracion_objetivo_s": 42}, {"id": "DcyhspLNIbr", "creador": "diegosicrex", "seguidores": 262000, "visitas": 164000, "likes": 5962, "comentarios": 34, "duracion_s": 26.5, "url": "https://www.instagram.com/reel/DcyhspLNIbr/", "formato": "Reflexión sobre relaciones con b-roll cinematográfico (gym oscuro + moto)", "resumen": "Opinión corta y tajante sobre las rupturas: quien te habla mal de su ex hablará mal de ti, déjalo ir, tu valor no depende de eso y mejor soltero que con alguien por miedo a estar solo. Lo distinto es el contraste 'tío de gym serio hablando de sentimientos' con una imagen muy cinematográfica.", "gancho_voz": "¿Os habéis dado cuenta de que todo el mundo está traumatizado con su ex?", "gancho_texto_pantalla": "Todo el mundo está traumatizado con su ex", "gancho_visual": "0–2,4 s: contrapicado en un gym oscuro verdoso, con cascos y camiseta negra ajustada, sujetando una botella y mirando al frente, serio; el texto del gancho fijo en 2 líneas en el centro.", "guion_original": [{"t": "0.0–2.4", "texto": "¿Os habéis dado cuenta de que todo el mundo está traumatizado con su ex?", "plano": "Gym oscuro, contrapicado, cascos y camiseta negra Under Armour, sujeta una botella; serio."}, {"t": "2.5–7.2", "texto": "Si tú conoces a alguien y te empieza a tirar mierda del ex, en cuanto lo dejéis, hablará con otra persona de lo malo que eras tú.", "plano": "2,4–4,6 curl en banco predicador (máquina verde), plano bajo con foco detrás · 4,6–7,4 primer plano del brazo haciendo curl con mancuerna, la cámara sube hasta su cara."}, {"t": "7.4–13.1", "texto": "Si has decidido o han decidido que ya no formas parte de su vida, déjalo ir, no lo fuerces, no define tu valor.", "plano": "7,4–10,8 exterior: sentado en la moto en la montaña, sudadera azul marino y vaqueros, mira a los lados; cielo con nubes · 10,8–13,3 gym oscuro, de pie junto a la polea; se gira y mira a cámara en «no define tu valor»."}, {"t": "13.5–19.3", "texto": "También es cierto que estamos en una sociedad en la que todos tenemos la cabeza reventada, así que lo que te queda es limpiarte y elegir mejor a tu siguiente pareja.", "plano": "13,3–16,3 POV desde un coche siguiendo su moto por una carretera de curvas · 16,3–19,7 de espaldas con camiseta roja ante un rack con discos; se inclina a coger la barra."}, {"t": "19.7–25.9", "texto": "Y mientras tanto, si me permites un consejo, estate soltero, no fuerces estar con alguien porque te da miedo estar solo, es una receta increíble para el fracaso.", "plano": "19,7–21,4 detrás de las barras de un rack, tirantes blanca, cara en penumbra · 21,4–26,5 plano continuo al atardecer con montañas: camina de espaldas hacia la moto con el casco en la mano, se sube y se coloca."}], "estructura": [{"bloque": "Gancho pregunta", "t": "0–2,4", "funcion": "Pregunta + generalización ('todo el mundo'): el espectador responde por dentro y piensa en su ex."}, {"bloque": "Giro", "t": "2,5–7,2", "funcion": "Señal de alarma práctica: el que critica a su ex te criticará a ti. Te pone en el lugar del siguiente."}, {"bloque": "Consuelo", "t": "7,4–13,1", "funcion": "Permiso para soltar ('déjalo ir, no lo fuerces') y validación ('no define tu valor')."}, {"bloque": "Normalizar + solución", "t": "13,5–19,3", "funcion": "'Todos tenemos la cabeza reventada': no eres tú. Qué hacer: limpiarte y elegir mejor."}, {"bloque": "Consejo-remate", "t": "19,7–25,9", "funcion": "Consejo que va contra la presión social ('estate soltero') y frase de cierre que se queda ('receta increíble para el fracaso')."}], "edicion": {"num_planos": 9, "s_por_plano": 2.9, "subtitulos": "Bloques de 1–4 palabras ('a tirar mierda', 'en cuanto lo dejéis', 'no define tu valor'), sans fina blanca pequeña (tipo SF Pro / Inter Regular, ≈40 px sobre 1080), centrados a media pantalla, sin animación ni color de acento.", "texto_pantalla": "El gancho 'Todo el mundo está traumatizado con su ex' fijo en 2 líneas en el centro durante todo el 1.er plano (0–2,4 s); hace de subtítulo de esa frase. Nada más.", "musica": "Instrumental de fondo poco percusiva, ambiente emocional/cinemático, ≈7 dB por debajo de la voz (−22 dB en las pausas). No identificada (comparada por croma con 'Restless' de UntitledRockBand, que Diego usa en otra ref: resultado no concluyente).", "efectos": "Solo cortes secos. Etalonaje de cine: sombras verdosas en el gym, tonos cálidos y cielos lavados fuera; 24 fps. Planos a pulso con movimiento suave.", "voz": "Reflexiva pero firme, como un consejo de colega mayor; rápida, 4,75 pal/s (123 palabras en 25,9 s), casi sin pausas."}, "por_que_funciona": [{"momento": "0.0–2.4 · «¿Os habéis dado cuenta de que todo el mundo está traumatizado con su ex?»", "mecanismo": "Pregunta directa + autorreferencia (tema universal)", "explicacion": "Una pregunta obliga al cerebro a contestar ('sí, mi ex…'); y casi todo el mundo tiene un ex, así que el vídeo sale del nicho fitness y le llega a cualquiera."}, {"momento": "0.0–2.4 · plano del tío de gym serio con cascos", "mecanismo": "Contraste / error de predicción", "explicacion": "La imagen promete 'vídeo de gym' y la voz habla de sentimientos: ese desajuste sorprende y retiene los primeros segundos."}, {"momento": "2.5–7.2 · «en cuanto lo dejéis, hablará con otra persona de lo malo que eras tú»", "mecanismo": "Giro de perspectiva / disonancia", "explicacion": "La crítica al ex del otro se vuelve contra ti: es una alarma práctica que se reenvía por DM a la amiga que está conociendo a alguien."}, {"momento": "10.8–13.1 · «no define tu valor» justo cuando se gira y mira a cámara", "mecanismo": "Validación directa (vínculo, oxitocina)", "explicacion": "La primera mirada a cámara cae en la frase que consuela: el que ha sido dejado siente que se lo dicen a él. Aquí se gana el like."}, {"momento": "13.5–16.3 · «todos tenemos la cabeza reventada»", "mecanismo": "Normalización / identidad de grupo", "explicacion": "Incluye al espectador en un 'todos' y le quita la culpa; baja la defensa y el consejo siguiente entra mejor."}, {"momento": "19.7–25.9 · «estate soltero… es una receta increíble para el fracaso»", "mecanismo": "Consejo contraintuitivo + polarización suave", "explicacion": "Va contra la presión de emparejarse: unos aplauden ('mejor sola que mal acompañada' es el comentario con más likes) y otros matizan (rupturas maduras), y eso son comentarios. La frase final es corta y redonda, de las que se guardan."}, {"momento": "21.4–26.5 · plano continuo: se aleja solo hacia la moto y se sube", "mecanismo": "Encarnación visual del mensaje + duración corta", "explicacion": "La imagen hace lo que dice la voz (irse solo y estar bien); 26 s de vídeo con cierre visual tranquilo hacen que se vea entero y se repita."}], "caption": "Todo el mundo está traumatizado con su ex.\n\nEste fue el primer vídeo que subí hablando y que llego a muchas personas.\nRecuerdo llorar de la alegría cuando vi que a la gente le estaba gustando,  con una especie de vértigo al sentir que se estaba gestando algo.\n\nHoy, más de 10 meses después puedo decir que me ha cambiado la vida.\nPero el mensaje sigue aplicando: estate soltero, no fuerces estar con alguien simplemente porque te da miedo estar solo, es una receta increíble para el fracaso.\n#relaciones #sentimientos #jovenes #ruptura", "cta": "Ninguno hablado ni en pantalla; la caption (repost con historia personal) hace de cierre emocional.", "titulo_lucas": "Todo el mundo está traumatizado con su ex", "texto_pantalla_lucas": "Todo el mundo está traumatizado con su ex", "guion_lucas": [{"texto": "¿Os habéis dado cuenta de que todo el mundo está traumatizado con su ex?", "plano": "recursos/gym/fisico/2026-07-25_aesthetic-devant_bebe-de-la-garrafa_manga-larga-gris.MP4 @ 0,2–2,6 (primeros planos en el gym oscuro, mirando abajo, serio; como Diego con la botella) + texto del gancho fijo encima", "nota": "Pregunta de verdad, con media sonrisa incrédula al final («…con su ex?»)."}, {"texto": "Si conoces a alguien y te empieza a poner a parir a su ex, tranquilo, que en cuanto lo dejéis hablará con otra persona de lo malo que eras tú.", "plano": "recursos/gym/biceps/2026-11-01_curl-predicador-maquina.MOV @ 3–5,2 (el mismo ejercicio que en el original) → recursos/gym/biceps/2026-07-25_aesthetic-devant_04-curl-alterno-mancuernas-contrapicado_camiseta-gris.MP4 @ 2–4,8 (contrapicado cerrado: brazo, mancuerna y cara)", "nota": "El «tranquilo, que…» con ironía: es el chiste de la frase."}, {"texto": "Si has decidido o han decidido que ya no formas parte de su vida, déjalo ir. No lo fuerces. No define tu valor.", "plano": "recursos/running/2025-10-20_correr-carril-dunas-atardecer_03-lateral-cerca-mar_camiseta-gris-pantalon-oliva.MOV @ 0–3,4 (exterior, perfil con el mar: el respiro luminoso del original) → recursos/gym/fisico/2026-06-09_posado-luz-lateral-primer-plano-brazos-cruzados_conjunto-azul-gymshark.MOV @ 2–4,5 (primer plano, brazos cruzados, miras a cámara justo en «No define tu valor»)", "nota": "Tres golpes cortos con micro-pausa: «Déjalo ir. No lo fuerces. No define tu valor.»"}, {"texto": "También es verdad que vivimos en una sociedad en la que todos tenemos la cabeza reventada, así que te toca entrenar la cabeza igual que entrenas el cuerpo y elegir mejor a tu siguiente pareja.", "plano": "recursos/running/2025-10-20_correr-carril-dunas-atardecer_01-espaldas_camiseta-gris-pantalon-oliva.MOV @ 2–5 (te graban siguiéndote por el carril = el POV desde el coche siguiendo la moto) → recursos/gym/espalda/2026-07-23_aesthetic-devant_dominadas-de-espaldas-rack-eleiko_tirantes-gris.MP4 @ 0–3,4 (de espaldas en el rack, en «entrenar la cabeza…»)", "nota": "«entrenar la cabeza igual que entrenas el cuerpo» es tu frase (el límite está en la cabeza): dila un pelín más lenta."}, {"texto": "Y mientras tanto, si me permites un consejo, estate soltero y aprende a estar contigo. No fuerces estar con alguien porque te da miedo estar solo: es una receta increíble para el fracaso.", "plano": "recursos/gym/biceps/2026-07-25_aesthetic-devant_06-curl-polea-barra-neon-zigzag_camiseta-gris.MP4 @ 7–8,7 (contrapicado con el neón, cara en penumbra, como el plano tras las barras) → recursos/running/2026-03-17_correr-amanecer-pasarela_02-lateral-silueta-con-el-sol_manga-larga-negra.MOV @ 2–7 (plano largo de cierre: corres solo con el sol detrás, el «me voy solo y estoy bien» de la moto)", "nota": "Remate seco en «fracaso», sin bajar el tono; corte a negro o fin justo después."}], "viabilidad_recursos": "alta", "que_grabar": [], "stock": [], "notas_edit": "9 planos de ≈2,9 s, cortes secos y nada de efectos; alternar gym oscuro (Devant / Gold's) con exterior luminoso (dunas, amanecer) igual que Diego alterna gym y carretera. Gancho: texto 'Todo el mundo está traumatizado con su ex' fijo en 2 líneas en el centro durante el 1.er plano y sin subtítulos encima; después subtítulos pequeños blancos en el centro (palabra a palabra, como prefiere Lucas). Etalonaje común: bajar saturación, sombras frías/verdosas y medios cálidos para que los clips de distintas sesiones casen (todo con look de cine, 24 fps si se puede). Música instrumental emocional, poco percusiva, desde el s 0 y ≈7 dB bajo la voz (vale 'Restless' instrumental de recursos/sonidos/). La mirada a cámara solo en «No define tu valor». Cierre con el plano largo de 5 s alejándote solo. Caption con un toque personal tuyo + #relaciones #saludmental #ruptura.", "palabras_guion_lucas": 135, "duracion_objetivo_s": 29}, {"id": "DeSLJp5AIa_", "creador": "gerardfelipx", "seguidores": 179000, "visitas": 153000, "likes": 6729, "comentarios": 84, "duracion_s": 49.3, "url": "https://www.instagram.com/reel/DeSLJp5AIa_/", "formato": "Confesión de autoaceptación: yo de niño vs. yo con máscara (fotos de infancia + metáforas con objetos + gym)", "resumen": "Cuenta que ha tardado 21 años en aceptarse: de niño era libre y al crecer se puso una máscara de 'tío serio y duro' para que no le juzgaran. Lo distinto es la mezcla de fotos y vídeos reales de su infancia con metáforas literales (peluche → máscara de payaso, casco) y un cierre en forma de frase redonda.", "gancho_voz": "He tardado 21 años en aceptarme.", "gancho_texto_pantalla": "Subtítulos palabra a palabra con «ACEPTARME» resaltada en otra tipografía (mayúsculas manuscritas); en 2,0–2,8 s rótulo manuscrito «mini Gerard» con flecha sobre su foto de niño.", "gancho_visual": "0–1,9 s: en la puerta de casa bajo una parra con guirnalda de bombillas, camiseta sin mangas gris Gymshark; mira a un lado y se gira de espaldas. 2,0 s: corte a una foto suya de niño con corona de cartón y cara de enfado, bordes de papel rasgado y rótulo «mini Gerard».", "guion_original": [{"t": "0.0–1.9", "texto": "He tardado 21 años en aceptarme.", "plano": "Puerta de casa bajo una parra con bombillas; camiseta sin mangas gris Gymshark; mira a un lado y se gira de espaldas."}, {"t": "2.0–2.8", "texto": "Este era yo.", "plano": "Foto de niño con corona dorada de cartón y chándal rojo, bordes de papel rasgado, rótulo manuscrito «mini Gerard» + flecha."}, {"t": "2.8–6.4", "texto": "Vivía con una pelota en mis manos y no sabía estar una tarde sin hacer el tonto.", "plano": "2,9–4,5 vídeo casero: de niño hace malabares con pelotas en el pasillo · 4,5–6,7 vídeo de webcam (horizontal, con bandas negras): de niño con camiseta roja sonriendo a cámara."}, {"t": "6.7–9.1", "texto": "Vivía tranquilo, sin vergüenza, sin compararme.", "plano": "6,7–7,6 estantería con tazas navideñas, coge una · 7,6–9,2 la pone en la cafetera y se la lleva."}, {"t": "9.2–13.7", "texto": "Era yo mismo, pero de un día para otro creces y pasas de jugar con peluches a jugar con máscaras.", "plano": "9,2–10,3 en la cocina bebiendo café de pie, de perfil · 10,3–12,4 en el sofá le quita la sudadera a un mono de peluche · 12,4–13,0 aparta el peluche de un manotazo · 13,0–14,2 deja una máscara de payaso terrorífica en su sitio."}, {"t": "14.2–17.5", "texto": "Ya no vale con cantar en voz alta porque estás feliz o llorar aunque haya gente delante.", "plano": "14,2–16,4 perro blanco tumbado en el sofá · 16,4–18,2 él se sienta y le acaricia."}, {"t": "18.1–22.6", "texto": "Porque puedes parecer demasiado intenso, te pueden juzgar, herir o rechazar y nadie quiere eso.", "plano": "18,2–20,1 se levanta del sofá · 20,1–23,8 en la calle, junto a un muro de piedra: se pone el casco (la máscara) y se sube a la moto."}, {"t": "23.0–28.0", "texto": "Le llamamos madurar a dejar de hacer las cosas que nos hacen ser nosotros, pero eso no es madurar, es dejar de aceptarte.", "plano": "23,8–25,9 gym: de espaldas ante el espejo, estira los brazos · 25,9–27,4 primer plano: coge una mancuerna del mancuernero · 27,4–28,6 press de hombro con mancuernas, de espaldas."}, {"t": "28.6–32.6", "texto": "Yo durante mucho tiempo escondí la sonrisa a ese niño para parecer un tío serio y duro.", "plano": "28,6–29,8 primer plano del agarre de la máquina de remo en T · 29,8–33,1 remo en T, cara de esfuerzo, serio."}, {"t": "33.0–36.7", "texto": "Y funcionaba de locos: nadie juzga a quien no enseña nada, pero tampoco lo conoce.", "plano": "33,1–34,8 carga un disco de 10 kg en la máquina · 34,8–37,3 remo en máquina, de espaldas."}, {"t": "37.3–39.0", "texto": "No soy un libro abierto, no te voy a engañar.", "plano": "37,3–38,7 primer plano del agarre de remo en el suelo · 38,7 sentado en el remo en polea, un chico de azul detrás."}, {"t": "39.6–43.9", "texto": "Pero me he cansado de intentar gustar siendo alguien que simplemente no soy.", "plano": "38,7–42,6 remo sentado en polea, concentrado · 42,6–44,2 primer plano del agarre."}, {"t": "44.2–48.0", "texto": "Porque al final aceptarte no es conseguir que todo el mundo te acepte, es dejar de necesitarlo.", "plano": "44,2–44,9 de espaldas en el banco inclinado · 44,9–49,3 curl inclinado con mancuernas, plano fijo con el espejo detrás; fin."}], "estructura": [{"bloque": "Gancho confesión", "t": "0–1,9", "funcion": "Confesión inesperada de un tío con buen físico: '¿qué no aceptaba?' abre la curiosidad."}, {"bloque": "El niño", "t": "2–9,1", "funcion": "Pruebas reales de su infancia: ternura, nostalgia y comparación con la propia infancia del espectador."}, {"bloque": "La máscara", "t": "9,2–22,6", "funcion": "Metáfora literal (peluche → máscara, casco) y lista de miedos sociales (juzgar, herir, rechazar) con la que todos se identifican."}, {"bloque": "Reencuadre", "t": "23–28", "funcion": "'Eso no es madurar, es dejar de aceptarte': cambia una creencia común."}, {"bloque": "Confesión personal", "t": "28,6–43,9", "funcion": "Su máscara concreta (tío serio y duro) sobre planos de gym serio; admite que no es un libro abierto y que se ha cansado."}, {"bloque": "Frase final", "t": "44,2–48", "funcion": "Frase redonda para guardar: aceptarte = dejar de necesitar que te acepten."}], "edicion": {"num_planos": 33, "s_por_plano": 1.5, "subtitulos": "Palabra a palabra, Montserrat SemiBold blanca pequeña, a media altura; dentro de cada frase las palabras se acumulan en posiciones escalonadas y se borran al cambiar de frase (mismo estilo que Ddo7IYUAbMi). La palabra clave del gancho, «ACEPTARME», en otra tipografía: mayúsculas manuscritas/cursivas.", "texto_pantalla": "Rótulo manuscrito «mini Gerard» + flecha dibujada señalando su cara en la foto de niño (2,0–2,8 s). La foto lleva un marco de papel rasgado.", "musica": "Instrumental suave de fondo, ≈10 dB bajo la voz (−24/−27 dB en las pausas), pulso ≈123 bpm con percusión ligera. No identificada.", "efectos": "Cortes secos; foto de infancia con borde de papel rasgado y rótulo dibujado; vídeo casero horizontal con bandas negras (sin recortar, para que se note que es de archivo). Metáforas con objetos (peluche apartado de un manotazo → máscara de payaso; casco). Color natural cálido en casa y neutro-oscuro en el gym.", "voz": "Íntima y pausada, de confesión; 3,7 pal/s (179 palabras en 48 s), pausas breves entre frases."}, "por_que_funciona": [{"momento": "0.0–1.9 · «He tardado 21 años en aceptarme.» con «ACEPTARME» en otra letra", "mecanismo": "Contraste / error de predicción + curiosidad", "explicacion": "Un chaval con buen físico confesando inseguridad no encaja con lo esperado; el cerebro quiere saber qué no aceptaba. La palabra resaltada fija el tema en un segundo."}, {"momento": "2.0–6.4 · foto «mini Gerard» y vídeos caseros de niño", "mecanismo": "Ternura (rasgos infantiles) + nostalgia autorreferente", "explicacion": "Las caras de niño despiertan instinto de protección y cariño; además el espectador piensa en su propia infancia. Por eso los comentarios hablan de su niñez ('Qué felicidad haber sido un niño feliz')."}, {"momento": "10.3–14.2 · peluche apartado de un manotazo → máscara de payaso", "mecanismo": "Metáfora visual literal + sorpresa", "explicacion": "Una imagen inesperada e inquietante convierte una idea abstracta (ponerse una máscara social) en algo concreto y recordable; el cambio brusco reactiva la atención en el s 13."}, {"momento": "14.2–22.6 · «te pueden juzgar, herir o rechazar y nadie quiere eso» + se pone el casco", "mecanismo": "Miedo al rechazo social (identificación universal)", "explicacion": "El rechazo social duele de verdad, como un dolor físico; nombrarlo con 3 verbos hace que cada espectador ponga su propio ejemplo. El casco repite la metáfora de la máscara sin decirlo."}, {"momento": "23.0–28.0 · «Le llamamos madurar a… pero eso no es madurar, es dejar de aceptarte»", "mecanismo": "Reencuadre / disonancia cognitiva", "explicacion": "Choca con una creencia que casi todos tienen ('madurar = cortarse') y la da la vuelta; esa pequeña incomodidad se resuelve guardando o compartiendo el vídeo."}, {"momento": "28.6–32.6 · «escondí la sonrisa a ese niño para parecer un tío serio y duro» sobre remo con cara de esfuerzo", "mecanismo": "Identidad de grupo masculina + coherencia imagen-voz", "explicacion": "El gym aparece como la máscara de 'tío duro': los chicos que entrenan se reconocen. La imagen confirma lo que dice la voz y lo hace creíble."}, {"momento": "44.2–48.0 · «aceptarte no es conseguir que todo el mundo te acepte, es dejar de necesitarlo»", "mecanismo": "Frase final redonda (repetición invertida) → guardar y compartir", "explicacion": "Repite 'aceptar' con el sentido cambiado: fácil de recordar y de citar. La caption 'que felices son los niños.' vuelve a la nostalgia y provoca comentarios."}], "caption": "que felices son los niños.\n\n#deporte #mentalidad #autenticidad #inspiracion #", "cta": "Ninguno hablado ni en pantalla; la caption nostálgica invita a comentar sobre la propia infancia.", "titulo_lucas": "He tardado [X] años en aceptarme", "texto_pantalla_lucas": "Subtítulos palabra a palabra con «ACEPTARME» resaltada en otra tipografía + rótulo manuscrito «mini Lucas» con flecha sobre tu foto de niño.", "guion_lucas": [{"texto": "He tardado [tu edad] años en aceptarme.", "plano": "recursos/gym/fisico/2026-06-09_posado-luz-lateral-cuerpo-entero-a-primer-plano_conjunto-azul-gymshark.MOV @ 0–2 (cuerpo entero con luz natural lateral, miras a un lado; como él en la puerta de casa)", "nota": "Lento y bajo. «ACEPTARME» resaltada en pantalla."}, {"texto": "Este era yo.", "plano": "GRABAR: hazle una foto a una foto tuya de pequeño (en papel o del móvil de tus padres) → con borde de papel rasgado + rótulo manuscrito «mini Lucas» y flecha", "nota": "Con cariño, casi riéndote."}, {"texto": "Vivía con [una pelota en los pies] y no sabía estar una tarde sin hacer el tonto.", "plano": "GRABAR (pedir a tu familia): vídeo casero tuyo de niño jugando (1,6 s) → vídeo o foto de niño sonriendo a cámara (2 s; si es horizontal, déjalo con bandas negras como el original). Si no hay vídeos, 2 fotos con zoom lento.", "nota": "⚠️ Cambi aldas.MOV @ 24–26 (aperturas de espaldas, como él estirando ante el espejo) → recursos/gym/biceps/2026-07-25_aesthetic-devant_01-coge-mancuerna-mancuernero_camiseta-gris.MP4 @ 0–1,5 (coges una mancuerna: el mismo plano del original) → recursos/gym/hombro/2026-05-01_elevaciones-laterales-sentado-mancuernas_de-espaldas_conjunto-blanco.MOV @ 2–3,5 (de espaldas con mancuernas, en «es dejar de aceptarte»)", "nota": "Pausa de 0,4 s antes de «Pero eso no es madurar»."}, {"texto": "Yo durante mucho tiempo escondí la sonrisa de ese niño para parecer el típico tío serio del gym, que no se ríe ni en las fotos.", "plano": "recursos/gym/espalda/2026-11-01_remo-polea-baja-agarre-cerrado-sudadera_lateral-golds.MOV @ 1–2 (el agarre; el original abre con el agarre de la máquina) → recursos/gym/biceps/2026-06-09_curl-mancuerna-banco-inclinado_serie-larga-al-fallo_conjunto-azul.MOV @ 30–33 (cara de fallo, serio) → recursos/gym/fisico/2026-06-09_posado-espejo-led-se-quita-camiseta-espalda_conjunto-azul.MOV @ 10–11 (posado serio ante el espejo, en «ni en las fotos»)", "nota": "«que no se ríe ni en las fotos» con retintín: es tu toque de humor."}, {"texto": "Y funcionaba de lujo: nadie juzga a quien no enseña nada, pero tampoco nadie lo conoce.", "plano": "recursos/gym/espalda/2026-11-01_remo-polea-baja-agarre-abierto_sudadera-y-sin-camiseta.MOV @ 2–4 (remo con la sudadera puesta: «no enseña nada») → recursos/gym/espalda/2026-11-01_jalon-barra-ancha-sudadera_espalda.MOV @ 3–5 (de espaldas, tapado)", "nota": ""}, {"texto": "No soy un libro abierto, no te voy a engañar,", "plano": "recursos/gym/espalda/2026-10-26_jalon-al-pecho-toma-corta_espalda-y-3-4_sudadera-gymshark.MOV @ 0–1 (primer plano del estampado de la sudadera) → mismo clip @ 5–6", "nota": "Sonrisa ligera en «no te voy a engañar»."}, {"texto": "pero me he cansado de intentar gustar siendo alguien que simplemente no soy.", "plano": "recursos/gym/espalda/2026-10-26_jalon-al-pecho-toma-corta_espalda-y-3-4_sudadera-gymshark.MOV @ 1  + #mentalidad #autenticidad #saludmental.", "palabras_guion_lucas": 189, "duracion_objetivo_s": 51}, {"id": "DdrZgIkNXKp", "creador": "diegosicrex", "seguidores": 262000, "visitas": 108000, "likes": 5222, "comentarios": 20, "duracion_s": 22.45, "url": "https://www.instagram.com/reel/DdrZgIkNXKp/", "formato": "Reflexión épica con voz en off + b-roll propio intercalado con clips de series/películas", "resumen": "Monólogo de 22 s que defiende que el desamor es requisito del éxito: plantea el dolor, lo convierte en encrucijada ('saltas o te das la vuelta') y cierra con una promesa. Lo distinto es mezclar planos cinematográficos suyos con escenas icónicas de series/películas que el espectador reconoce (HIMYM, Peaky Blinders, Blade Runner 2049) sobre 'Sailor Song'.", "gancho_voz": "Creo que es imposible ser realmente exitoso si no te han roto el corazón,", "gancho_texto_pantalla": "Es imposible ser realmente exitoso si no te han roto el corazón.", "gancho_visual": "Diego en camiseta compresiva blanca en un gym oscuro, plano medio fijo; empieza mirando a un lado y a ~1,2 s gira la cabeza y clava la mirada en cámara. El gancho escrito ya está en pantalla desde el frame 0 (2 líneas, centro).", "guion_original": [{"t": "0.0–3.1", "texto": "Creo que es imposible ser realmente exitoso si no te han roto el corazón,", "plano": "Diego (camiseta compresiva blanca Under Armour, pantalón negro) de pie en un gym oscuro, plano medio fijo; mira a un lado y gira la cabeza hasta mirar a cámara a los ~1,2 s. Texto del gancho en 2 líneas en el centro."}, {"t": "3.1–5.0", "texto": "sin haber visto una parte de ti desgarrarse,", "plano": "CLIP DE SERIE: Lily (Alyson Hannigan) llorando de noche con abrigo de borrego — Cómo conocí a vuestra madre (HIMYM)."}, {"t": "5.0–6.9", "texto": "sin sentir que todo en lo que confiabas", "plano": "Plano propio: de espaldas con sudadera negra (estampado de calavera con alas/plumas) caminando por un túnel abovedado con luces cálidas hacia la salida iluminad "Afirmación absoluta y contraintuitiva (éxito ↔ corazón roto) que obliga a posicionarse: '¿a mí me lo han roto?'. Abre bucle: ¿por qué sería imposible?"}, {"bloque": "Herida (escalada de dolor)", "t": "3,1–8,7", "funcion": "Tres imágenes de dolor cada vez más graves (desgarrarse → todo se vuelve en tu contra → abismo) con clips reconocibles: el espectador revive su propia ruptura."}, {"bloque": "Giro / encrucijada", "t": "8,7–16,6", "funcion": "'Porque es justo ahí…' resignifica el dolor como el momento que decide quién eres. Dicotomía binaria: hundirte o darte la vuelta (identidad heroica)."}, {"bloque": "Promesa y cierre", "t": "16,8–22,4", "funcion": "Consuelo directo en segunda persona ('te prometo') y gratitud al dolor; cierre emocional que invita a guardar/enviar a alguien que lo está pasando mal. Termina justo en 'eres' → loop limpio al gancho."}], "edicion": {"num_planos": 12, "s_por_plano": 1.9, "subtitulos": "Gancho: frase completa en 2 líneas fija 0–3,1 s. Luego subtítulos de 1–3 palabras al ritmo de la voz, sans-serif (tipo SF/Inter) blanca, pequeña (~4 % del alto), minúsculas, sin caja, sombra suave, centrados en el medio de la pantalla. Corrigen a Whisper: 'al abismo' (no 'al aviso'), 'mirarás atrás'.", "texto_pantalla": "Solo el gancho escrito (= frase de voz sin el 'Creo que'). Nada más de texto aparte de los subtítulos.", "musica": "'Sailor Song' — Gigi Perez (identificada con Shazam en 3 tramos; parece versión instrumental/ralentizada), con un colchón grave continuo desde el s 0 y unos 6 dB por debajo de la voz.", "efectos": "Ninguno visible: cortes secos al ritmo de la frase, sin zooms ni transiciones. Etalonaje cinematográfico (contraste, tonos fríos en gym/túnel, cálidos en exteriores). Los clips de series/películas van recortados a 9:16 y con la misma gradación para que no desentonen.", "voz": "Voz masculina grave, tono íntimo y solemne, sin gritar; sube un poco en 'demuestras de lo que estás hecho' y baja en la promesa final. 103 palabras en 22,4 s ≈ 4.6 pal/s (ritmo medio-rápido pero sin pausas)."}, "por_que_funciona": [{"momento": "0.0–3.1 · 'Creo que es imposible ser realmente exitoso si no te han roto el corazón'", "mecanismo": "Disonancia cognitiva + polarización suave", "explicacion": "Une dos cosas que el cerebro no asocia (éxito profesional ↔ desamor) en una afirmación absoluta ('imposible'). Genera un pequeño error de predicción y obliga a tomar postura: el que ha sufrido una ruptura se siente validado, el que no, quiere discutirlo. Ambos se quedan y los segundos comentan."}, {"momento": "0.0–1.2 · Diego gira la cabeza y mira a cámara mientras el texto ya está escrito", "mecanismo": "Contacto visual + doble canal (leer y oír)", "explicacion": "La mirada que llega a cámara activa el reflejo de atención social (alguien me está hablando a mí) y el texto fijo permite captar la tesis entera aunque el vídeo empiece sin sonido: se entiende en <2 s."}, {"momento": "3.1–8.7 · clips de Lily llorando (HIMYM) y Tommy Shelby con la pistola (Peaky Blinders)", "mecanismo": "Reconocimiento + memoria emocional prestada", "explicacion": "Escenas que el público ya vivió con carga emocional: al reconocerlas, el cerebro trae de golpe la emoción asociada (y un pico de recompensa por 'la conozco'). Además rompen el patrón visual de 'planos del creador' → reflejo de orientación cada ~1,9 s."}, {"momento": "3.1–8.7 · 'sin haber visto… sin sentir… y te empuja al abismo'", "mecanismo": "Autorreferencia + escalada", "explicacion": "Segunda persona y descripciones abiertas (sin detalles de una ruptura concreta) para que cada espectador proyecte la suya: el efecto Barnum hace que 'esto va de mí'. La escalada de gravedad mantiene la tensión subiendo."}, {"momento": "8.7–16.6 · 'Porque es justo ahí donde se decide el destino de un hombre… o si te das la vuelta y demuestras de lo que estás hecho'", "mecanismo": "Reencuadre + identidad heroica", "explicacion": "Convierte el dolor en una prueba con dos salidas y deja claro cuál e de quién eres de verdad:", "plano": "recursos/running/2025-10-20_correr-carril-dunas-atardecer_02-espaldas-y-lateral_camiseta-gris-pantalon-oliva.MOV @ 3–5 (de espaldas con el atardecer; como Diego de espaldas en las ruinas)", "nota": "'De verdad' firme, pequeña pausa."}, {"texto": "en el instante en el que eliges", "plano": "recursos/gym/cardio/2026-08-11_cinta-contrapicado-desde-consola_tirantes-celeste-sudada.MOV @ 2–4 (sudor, cara de esfuerzo; equivale al step-up del original)", "nota": "Más rápido, en tensión."}, {"texto": "si paras para dejar de sufrir", "plano": "recursos/gym/funcional/2025-07-02_tumbado-agotado-tras-wod_sin-camiseta.MOV @ 4–6,9 (se deja caer y queda tumbado en cenital = el plano cenital tumbado de Blade Runner; cortar ANTES de que se ría, ~7 s)", "nota": "Más lento y bajo en 'dejar de sufrir'."}, {"texto": "o si te levantas y demuestras de lo que estás hecho.", "plano": "recursos/competicion/2025-11-09_carrera-dorsal-29233_corriendo-lateral-y-frente_ropa-blanca.MOV @ 9–11,5 (de frente hacia cámara en carrera, dorsal)", "nota": "Sube: es el clímax. Golpe en 'hecho'."}, {"texto": "Y aunque ahora mismo te duela,", "plano": "recursos/competicion/2025-07-05_deka-zaragoza_tank-pull-cuerda_pantalon-oliva.MOV @ 1–2,5 (esfuerzo puro tirando de la cuerda)", "nota": "Vuelves a bajar, cercano, como hablándole a uno solo."}, {"texto": "te prometo que un día mirarás atrás", "plano": "GRABAR: tú andando de espaldas por una calle o paseo y, en 'mirarás atrás', giras la cabeza hacia cámara por encima del hombro con media sonrisa (camiseta lisa oscura, luz de tarde; 3–4 tomas, <1 min) | alternativa: recursos/running/2026-10-18_correr-calle-ladrillo_espaldas-y-lado_manga-larga-negra.MOV @ 2–4", "nota": "'Te prometo' despacio y sincero."}, {"texto": "y le darás las gracias al dolor que te hizo ser quien eres.", "plano": "recursos/competicion/2025-11-09_carrera-dorsal-29233_mordiendo-medalla_ropa-blanca.MOV @ 0–3,4 (mordiendo la medalla = la recompensa del dolor   const r=$('#bRec'); if(r) r.onclick=()=>{document.body.classList.toggle('rec');r.setAttribute('aria-pressed',document.body.classList.contains('rec'));try{localStorage.setItem('rec',document.body.classList.contains('rec')?'1':'0')}catch(e){}};
  const c=$('#bCopy'); if(c) c.onclick=()=>{const t=V[i].guion_lucas.map(l=>l.texto).join('\n');
    const ok=()=>{c.textContent='Copiado';setTimeout(()=>c.textContent='Copiar guion',1500)};
    try{navigator.clipboard.writeText(t).then(ok,()=>sel())}catch(e){sel()}
    function sel(){const r=document.createRange();r.selectNodeContents($('ol.script'));const s=getSelection();s.removeAllRanges();s.addRange(r);c.textContent='Seleccionado: copia con ⌘C'}};
}
function render(){
  const h=location.hash.slice(1); const m=/^v(\d+)$/.exec(h); const i=m?Math.min(V.length,Math.max(1,+m[1]))-1:-1;
  nav(i<0?'inicio':'v'+(i+1));
  $('#main').innerHTML=i<0?home():ficha(i);
  if(i>=0) wire(i);
}
$('#sub').textContent=D.sub;
try{if(localStorage.getItem('rec')==='1')document.body.classList.add('rec')}catch(e){}
let last=location.hash;
window.addEventListener('hashchange',()=>{if(location.hash!==last){last=location.hash;render();window.scrollTo(0,0)}});
render();
</script>
