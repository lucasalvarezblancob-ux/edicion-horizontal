to": "Y no lo digo porque esté de moda el rollo fit. En serio, no conecto.", "plano": "Cocina, de espaldas: abre la nevera y saca un tupper."}, {"t": "14.2–18.3", "texto": "No me gusta estar hasta las 6 de la mañana, beber y fingir que soy alguien que en realidad no soy.", "plano": "Primer plano: saca un cazo de un cajón (14,2–15,7) y lo llena de agua en el fregadero; la mano tapa la cámara (15,7–18,3)."}, {"t": "18.3–21.8", "texto": "He pasado mucho tiempo intentando encajar porque no quería perder mi juventud.", "plano": "Cocina, de espaldas sin camiseta, cocinando en la vitro y cogiendo algo del estante."}, {"t": "21.8–25.1", "texto": "Cuando en realidad perderla es vivir una vida que otros quieren que vivas.", "plano": "Primer plano escurriendo arroz en un colador (21,8–23,1); sale a la terraza con el bol, de espaldas hacia el jardín (23,1–25,1)."}, {"t": "25.1–29.5", "texto": "Al final, también creo que es una cuestión de etapas. Yo tengo mis cenas, mi gente y mis objetivos,", "plano": "Come el arroz sentado en una mesa de terraza junto a una manguera enrollada (25,1–28,1); en el baño se lava los dientes frente al espejo (28,1–)."}, {"t": "29.5–31.7", "texto": "que pesan mucho más que una noche de diversión.", "plano": "Baño: se gira del espejo a cámara, de frente, serio."}, {"t": "31.7–36.7", "texto": "Supongo que hay gente que prefiere darlo todo en la pista, y yo simplemente prefiero darlo todo en la estática.", "plano": "Primeros planos del armario: coge unas gafas de ciclismo rojas y la ropa/reloj de una balda (31,8–35,2); sin camiseta con culotte Trek pedaleando en una bici estática con fondo azul de piscina (35,2–36,9) justo en 'estática'."}, {"t": "36.7–41.6", "texto": "Llámalo aburrido si quieres, pero prefiero eso a perderme en una vida que no sea la mía.", "plano": "Con camiseta de tirantes negra y las gafas rojas abre una puerta de cristal del patio, se gira y sale de plano."}], "estructura": [{"bloque": "Gancho identitario", "t": "0–2,1", "funcion": "Etiqueta contradictoria ('21 años' + 'viejoven') que el cerebro tiene que resolver; el que no sale de fiesta piensa 'como yo'."}, {"bloque": "Prueba con humor", "t": "2,1–8,3", "funcion": "Capturas reales de comentarios '35 años' + 'no me jodas': autoironía, prueba social y guiño a la comunidad."}, {"bloque": "Confesión a contracorriente", "t": "8,3–18,3", "funcion": "'No me gusta salir de fiesta' + desactiva la objeción ('no es por el rollo fit') + concreta lo que no le gusta (las 6, beber, fingir)."}, {"bloque": "Giro / reencuadre", "t": "18,3–25,1", "funcion": "Pasa de excusa a tesis: perder la juventud no es no salir, es vivir la vida que otros quieren. Frase para guardar."}, {"bloque": "Valores", "t": "25,1–31,7", "funcion": "Lo que gana a cambio (cenas, gente, objetivos): de renuncia a elección."}, {"bloque": "Remate cómico", "t": "31,7–36,7", "funcion": "Juego de palabras pista/estática sincronizado con el plano de la bici: recompensa y alivio tras el tono serio."}, {"bloque": "Cierre desafiante", "t": "36,7–41,6", "funcion": "'Llámalo aburrido si quieres' anticipa la crítica y deja al espectador posicionándose; sale de plano (final abierto, invita a reverlo)."}], "edicion": {"num_planos": 15, "s_por_plano": 2.8, "subtitulos": "Palabra a palabra, blanco, sans serif en negrita pequeña (tipo Montserrat), sin caja ni sombra fuerte, en minúsculas. Posición variable sobre zonas limpias del plano; en el gancho y en frases clave las palabras se quedan acumuladas y dispersas formando la frase ('tengo 21 años', 'soy un viejoven', 'es vivir una vida que otros quieren que vivas'), con la palabra clave en cursiva serif ('viejoven').", "texto_pantalla": "Sin título aparte: el gancho es el propio subtítulo acumulado. Capturas de comentarios reales de Instagram (nombres tapados) superpuestas una a una en 5,0–7,3 s.", "musica": "Instrumental de fondo constante y bastante presente bajo la voz (no identificada); ambiente tranquilo/emotivo, sin drops sincronizados.", "efectos": "Cortes secos sin transiciones, cámara fija o a pulso muy estable, look iPhone natural cálido. Única 'animación': aparición de las capturas de comentarios. La mano que tapa la cámara (15,7) hace de transición natural.", "voz": "Tranquila, cercana, medio irónica, sin dramatizar; ~4 palabras/s (≈164 palabras en 41 s) con micro-pausas antes de los remates ('35, no me jodas')."}, "por_que_funciona": [{"momento": "0.0–2.1 · 'Tengo 21 años y soy un viejoven'", "mecanismo": "Contradicción + autorreferencia", "explicacion": "Juntar una edad joven con 'viejo' crea disonancia que el cerebro quiere resolver (¿por qué?), y a cualquier chaval que prefiere quedarse en casa le salta el 'esto va de mí'. El neologismo en cursiva se recuerda y se repite en comentarios."}, {"momento": "5.0–8.3 · capturas 'Se ve de 35' + '35, no me jodas'", "mecanismo": "Prueba social + guiño de comunidad", "explicacion": "Enseña comentarios reales: el espectador ve que miles ya opinan de él (estatus) y entiende un chiste interno que le hace sentirse parte del grupo. Además invita a seguir el juego en comentarios ('pues yo te echo 40'), alimentando el algoritmo (521 comentarios)."}, {"momento": "8.3–14.2 · 'No me gusta salir de fiesta… no lo digo porque esté de moda el rollo fit'", "mecanismo": "Identificación de grupo + polarización suave", "explicacion": "Va contra la norma social de su edad; los que no salen se sienten validados (guardan/comparten 'esto soy yo') y los que salen comentan para defenderse. Desactivar la objeción antes de que aparezca (inoculación) le hace parecer sincero, no postureo fit."}, {"momento": "21.8–25.1 · 'perderla es vivir una vida que otros quieren que vivas'", "mecanismo": "Reencuadre / insight", "explicacion": "Da la vuelta al miedo (FOMO: 'me pierdo la juventud') y lo convierte en lo contrario. Ese 'clic' cognitivo da una pequeña recompensa y es la frase que la gente manda a un amigo o guarda."}, {"momento": "31.7–36.9 · 'darlo todo en la pista… darlo todo en la estática' + plano de la bici", "mecanismo": "Error de predicción (humor)", "explicacion": "El cerebro completa 'darlo todo en la pista' con discoteca y recibe 'bici estática' justo cuando aparece el plano: sorpresa + risa = dopamina, y alivio tras el tramo serio. La sincronía palabra-plano hace el chiste visual y compartible."}, {"momento": "Todo el vídeo · un plano nuevo cada ~2,8 s de rutina doméstica (dominadas, nevera, arroz, cenar, baño)", "mecanismo": "Reflejo de orientación + aspiracional", "explicacion": "Cada corte renueva la atención; ver la vida 'normal' de alguien en forma (sin camiseta, casa con luz bonita) engancha por curiosidad de mirón y aspiración, y hace creíble el mensaje: así es su noche de sábado."}, {"momento": "36.7–41.6 · 'Llámalo aburrido si quieres' + sale de plano", "mecanismo": "Desafío + final abierto", "explicacion": "Pone en boca del espectador la crítica y le obliga a posicionarse (¿aburrido o admirable?) → comentarios. Salir de plano sin CTA corta en seco y empuja al bucle; el caption 'no soy un hater de la fiesta, lo prometo' remata la polémica suave."}], "caption": "no soy un hater de la fiesta, lo prometo.\n\n#deporte #mentalidad #fiesta #correr #fitness", "cta": "Sin CTA explícito. El engagement lo provocan el chiste de la edad ('me echa 35 palos') y el desafío final 'llámalo aburrido si quieres'; el caption añade polémica suave.", "titulo_lucas": "Soy un viejoven (no salgo de fiesta)", "texto_pantalla_lucas": "tengo [tu edad] años / soy un viejoven (sin título aparte: subtítulo acumulado, 'viejoven' en cursiva serif)", "guion_lucas": [{"texto": "Tengo [tu edad] años y soy un viejoven.", "plano": "recursos/gym/fisico/2026-11-01_hibrido_intro-sentado-cajon-nike-strength.mov @ 3,8–5,6 (se sienta en el cajón como un abuelo y mira a cámara)", "nota": "Pausa mínima antes de 'viejoven' y dilo con media sonrisa."}, {"texto": "Ya no solo porque [algo de abuelo que hagas de verdad, p. ej. 'a las diez ya estoy en la cama'] y porque [p. ej. 'mi plan de sábado es correr a las 7'].", "plano": "GRABAR: en la cama con la luz apagada mirando el móvil a las 22:30 (que se vea la hora), plano fijo desde la puerta (3 s) → recursos/running/2026-03-17_correr-amanecer-pasarela_02-lateral-silueta-con-el-sol_manga-larga-negra.MOV @ 2–5", "nota": "Si tienes comentarios de gente echándote años o metiéndose con tu vida 'de abuelo', ponlos como capturas una a una como en el original."}, {"texto": "[Remate corto de 3–4 palabras, p. ej. 'Un sábado. A las 7.']", "plano": "recursos/running/2026-10-30_selfie-contrapicado-trail-buenos-dias_gafas-rojas-chaleco.MOV @ 0–2,5 (dice '¡Buenos días!')", "nota": "Seco, como el '35, no me jodas'."}, {"texto": "Bueno, aparte de esto, no me gusta salir de fiesta.", "plano": "recursos/gym/fisico/2026-11-05_posado-estudio-posing_de-frente-habla-y-se-acerca_camiseta-azul-petroleo-gymshark.MOV @ 0–2,5 (de frente, pulgares en los bolsillos)", "nota": "Confesión, tono bajo y natural."}, {"texto": "Y no lo digo porque esté de moda el rollo fit. En serio, no conecto.", "plano": "recursos/lifestyle/2026-07-02_festival-hamburguesas_03-mordisco-a-doble-mano_camiseta-gris.mov @ 8–11 (mordiendo la hamburguesa)", "nota": "El contraste hamburguesa / 'rollo fit' hace el chiste solo."}, {"texto": "No me gusta estar hasta las 6 de la mañana bebiendo y fingir que soy alguien que en realidad no soy.", "plano": "recursos/running/2026-03-17_selfie-correr-amanecer-paseo-maritimo_manga-larga-negra.MOV @ 2–4 → recursos/running/2026-03-17_correr-amanecer-pasarela_01-pov-y-grupo-a-contraluz.MOV @ 2–5", "nota": "Contraste visual: a las 6 él también está despierto, pero corriendo."}, {"texto": "He pasado mucho tiempo intentando encajar porque no quería perder mi juventud.", "plano": "recursos/lifestyle/2025-05-10_coche-amigos-selfie-risas_manga-larga-negra.MOV @ 10–13", "nota": "Más lento, aquí cambia el tono."}, {"texto": "Cuando en realidad perderla es vivir una vida que otros quieren que vivas.", "plano": "recursos/running/2026-03-14_run-club-lluvia_04-correr-charcos-palmeras-espaldas_chubasquero-negro.MOV @ 0,2–2 → recursos/running/2025-10-20_correr-carril-dunas-atardecer_02-espaldas-y-lateral_camiseta-gris-pantalon-oliva.MOV @ 3–5", "nota": "Subtítulo acumulado en pantalla como en el original (frase para guardar)."}, {"texto": "Al final, creo que es una cuestión de etapas. Yo tengo mis rodajes, mi gente y mis objetivos:", "plano": "recursos/lifestyle/2025-06-27_cafe-chiringuito-playa_sin-camiseta.MOV @ 0–3 → recursos/competicion/2025-11-09_carrera-dorsal-29233_pov-pies-y-dorsal_ropa-blanca.MOV @ 2–5 (se ve el dorsal)", "nota": "Enumera con calma, una palabra por golpe."}, {"texto": "un maratón y un medio Ironman, que pesan mucho más que una noche de fiesta.", "plano": "recursos/competicion/2025-11-09_carrera-dorsal-29233_mordiendo-medalla_ropa-blanca.MOV @ 0–3,4", "nota": "Énfasis en 'maratón' y 'medio Ironman'."}, {"texto": "Supongo que hay gente que prefiere darlo todo en la pista, y yo prefiero darlo todo en la pista… de atletismo.", "plano": "recursos/running/2026-10-24_outfit-trail-se-prepara-en-parking_gafas-rojas-chaleco.MOV @ 0–4 (se pone las gafas rojas, igual que el original) → GRABAR: series en una pista de atletismo, plano lateral fijo, entra y sale de cuadro (3 s); si no, recursos/running/2026-07-05_correr-paseo-rio-barandilla_lateral_camiseta-blanca-oversize.MOV @ 2–5", "nota": "Pausa de medio segundo antes de 'de atletismo'; el plano de la pista entra justo en esa palabra."}, {"texto": "Llámalo aburrido si quieres, pero prefiero eso a perderme en una vida que no sea la mía.", "plano": "recursos/gym/fisico/2026-11-01_hibrido_intro-sentado-cajon-nike-strength.mov @ 17–20,5 (se levanta y viene hacia cámara hasta pasarla)", "nota": "Cierre tranquilo, sin CTA; sale de plano igual que el original y cierra el círculo con el plano del gancho."}], "duracion_objetivo_s": 43, "viabilidad_recursos": "alta", "que_grabar": ["En la cama a las 22:30 con la luz apagada mirando el móvil, plano fijo desde la puerta, que se vea la hora (3 s).", "Series en una pista de atletismo, plano lateral fijo (3 s) — opcional, hay alternativa en recursos.", "Rellenar los huecos: tu edad y 1–2 costumbres 'de abuelo' reales; si tienes capturas de comentarios echándote años, guárdalas."], "stock": [], "notas_edit": "Ritmo: 14–15 planos en ~43 s (≈2,8 s/plano), cortes secos sin transiciones, look natural cálido. Subtítulos palabra a palabra en blanco, sans bold pequeña sin caja y en minúsculas, colocados sobre zonas limpias; en el gancho y en 'perderla es vivir una vida que otros quieren que vivas' deja que las palabras se acumulen dispersas formando la frase, con 'viejoven' en cursiva serif. Si hay capturas de comentarios, que entren una a una con un pop.mp3 suave. Música instrumental tranquila/emotiva constante bajo la voz (p. ej. sonidos/musica-restless-untitledrockband_instrumental.mp3 o una lo-fi suave), sin drops. El chiste 'de atletismo' tiene que caer exactamente en el corte. Final sin CTA, sale de plano y corta en seco. Caption con polémica suave tipo 'no soy un hater de la fiesta, lo prometo'.", "palabras_guion_lucas": 179}, {"id": "DfQw0fKBCFF", "creador": "danielgmzs", "seguidores": 121000, "visitas": 760000, "likes": 100777, "comentarios": 478, "duracion_s": 28.4, "url": "https://www.instagram.com/reel/DfQw0fKBCFF/", "formato": "Test '¿Qué es más…? A/B/C' → giro emocional en plano nocturno → chiste de la letra D", "resumen": "Parece un test de chiste ('¿qué es más peligroso: resbalarte en el hielo o caerte de la bici?'), pero la C es 'despertar y no saber quién eres' por haberte adaptado a todos; 21 s de un único plano nocturno de él solo y remate cómico 'O letra D: quemarte' con la Antorcha Humana. El cambio de registro de broma a herida y otra vez a broma es lo que lo hace distinto.", "gancho_voz": "¿Qué crees que sea más peligroso?", "gancho_texto_pantalla": "¿QUE ES MÁS PELIGROSO?", "gancho_visual": "Primer plano selfie dentro de un coche de noche (luz tenue, asientos negros), camiseta roja y gorra beige al revés, micro de solapa; sonríe, gesticula con la mano hacia cámara. Rótulo blanco en condensada gruesa arriba y la palabra subtitulada sobre el pecho.", "guion_original": [{"t": "0.0–1.4", "texto": "¿Qué crees que sea más peligroso?", "plano": "A cámara en el coche, sonriente. Rótulo arriba '¿QUE ES MÁS PELIGROSO?'."}, {"t": "1.4–3.1", "texto": "A, resbalarte en el hielo.", "plano": "Mismo plano. Rótulo cambia a 'LETRA A:' + foto de stock de una persona resbalando en la nieve encima de la cabeza."}, {"t": "3.1–4.8", "texto": "B, caerte de una bicicleta.", "plano": "Mismo plano. 'LETRA B:' + foto de una chica tirada en el suelo con la bici encima."}, {"t": "4.8–5.3", "texto": "C…", "plano": "Mismo plano, 'LETRA C:' SIN foto; sonríe. Corte seco a 5,27."}, {"t": "5.4–7.8", "texto": "Despertar un día y darte cuenta de que ya no sabes quién eres.", "plano": "Plano nocturno fijo muy abierto: plaza adoquinada vacía, palmeras y una farola alta; él diminuto, apoyado en la farola mirando el móvil. Sin rótulo; solo subtítulo."}, {"t": "7.8–9.8", "texto": "No porque hayas cambiado de la noche a la mañana,", "plano": "Mismo plano nocturno."}, {"t": "9.8–12.8", "texto": "sino porque pasaste años adaptándote a cada lugar al que llegabas.", "plano": "Mismo plano nocturno."}, {"t": "12.8–14.2", "texto": "En un lugar eras más callado,", "plano": "Mismo plano nocturno."}, {"t": "14.2–15.6", "texto": "en otro eras más divertido,", "plano": "Mismo plano nocturno."}, {"t": "15.6–18.6", "texto": "y en otro te hacías pequeño para que las personas no se fueran de tu vida.", "plano": "Mismo plano nocturno."}, {"t": "18.6–20.6", "texto": "Poco a poco aprendiste a encajar,", "plano": "Mismo plano nocturno."}, {"t": "20.6–22.5", "texto": "hasta que un día despiertas y te preguntas:", "plano": "Mismo plano nocturno."}, {"t": "22.5–26.9", "texto": "«Después de tanto adaptarme a los demás, ¿cuál de todas esas versiones de mí fue realmente auténtica?»", "plano": "Mismo plano nocturno; 'AUTÉNTICA' se queda en pantalla ~0,7 s de silencio. Corte seco a 27,03."}, {"t": "26.9–28.4", "texto": "O letra D: quemarte.", "plano": "Vuelta al coche a cámara, pícaro. 'LETRA D:' + imagen de la Antorcha Humana (4 Fantásticos) en llamas encima de la cabeza. Fin."}], "estructura": [{"bloque": "Pregunta-test", "t": "0–1.4", "funcion": "Invita a jugar: el espectador empieza a contestar mentalmente; 'peligroso' activa alerta."}, {"bloque": "Opciones trampa A/B", "t": "1.4–4.8", "funcion": "Respuestas obvias y fotos ridículas: el cerebro clasifica el vídeo como 'humor ligero' y baja la guardia."}, {"bloque": "Giro C + corte", "t": "4.8–5.4", "funcion": "Rompe la predicción: cambia luz, voz y tono de golpe; la C no tiene foto → bucle abierto."}, {"bloque": "Diagnóstico", "t": "5.4–12.8", "funcion": "Nombra un miedo íntimo (no saber quién eres) y lo explica sin culpa ('no porque hayas cambiado')."}, {"bloque": "Espejo enumerativo", "t": "12.8–18.6", "funcion": "Tres escenas reconocibles en escalada → el espectador se ve a sí mismo (callado → divertido → hacerse pequeño)."}, {"bloque": "Pregunta final", "t": "18.6–26.9", "funcion": "Pregunta en 1.ª persona sin respuesta: se queda resonando y empuja a comentar/guardar."}, {"bloque": "Remate cómico D", "t": "26.9–28.4", "funcion": "Descarga la tensión con un chiste literal y devuelve al plano inicial → bucle y rewatch."}], "edicion": {"num_planos": 3, "s_por_plano": 9.5, "subtitulos": "Palabra a palabra (1 palabra), MAYÚSCULAS, sans muy gruesa tipo Montserrat ExtraBold/Black, blanca sin caja ni borde (sombra mínima), centrada a ~78 % de alto (sobre el pecho / el suelo de la plaza). Iguales en la intro y en la noche. Fallo de autosubtítulo visible: tildes en minúscula ('QUIéN', 'AñOS', 'AUTéNTICA').", "texto_pantalla": "Rótulo arriba (y≈8–10 %) en condensada gruesa blanca tipo Anton/Bebas: '¿QUE ES MÁS PELIGROSO?' (0–1,4) → 'LETRA A:' (1,4–3,1) → 'LETRA B:' (3,1–4,9) → 'LETRA C:' sin foto (4,9–5,27) → nada en la noche → 'LETRA D:' (27–28,4). Bajo el rótulo, foto de stock rectangular (~60 % del ancho, ~20 % de alto) justo encima de la cabeza, sin animación aparente (aparece en seco con el rótulo).", "musica": "Cama musical continua y muy baja durante todo el vídeo: en ningún momento baja de −45 dB, y en las pausas de la voz queda a ≈ −28/−38 dB con contenido tonal (nota sostenida en torno a 262 Hz, Do4, con armónicos y un bajo de 75–95 Hz) → pad/piano emotivo y lento. La misma huella espectral sale en los tres vídeos de la serie (parece la misma cama). No se ha podido identificar el tema. Debajo de la intro jocosa no sube: el cambio de ambiente lo hacen la imagen y la voz, no la música.", "efectos": "Ninguno: 3 planos con cortes secos (5,27 y 27,03), sin zooms, transiciones ni SFX. El 'efecto' es el contraste coche/sonrisa ↔ plaza nocturna vacía. Plano nocturno fijo (trípode), sin movimiento.", "voz": "Intro con micro de solapa a cámara: tono jocoso, sonriente, con pausas tras cada letra (~3,2 pal/s). Voz en off (otra toma, mismo micro): baja, íntima, sin sonrisa, fluida y sin pausas largas (~4,3 pal/s). D: vuelve el tono pícaro, más lento (~2,7 pal/s)."}, "por_que_funciona": [{"momento": "0.0–1.4 · '¿Qué crees que sea más peligroso?' + rótulo", "mecanismo": "Participación / juego", "explicacion": "Una pregunta directa en 2.ª persona con formato de test hace que el espectador genere su propia respuesta antes de que lleguen las opciones: generar una respuesta compromete más que escuchar. 'Peligroso' es palabra de amenaza → sesgo de negatividad, atención automática en el primer segundo."}, {"momento": "1.4–4.8 · 'resbalarte en el hielo', 'caerte de una bicicleta' + fotos de stock", "mecanismo": "Expectativa fijada (marco de humor)", "explicacion": "Opciones cotidianas, obvias y con fotos literales casi ridículas: el cerebro predice 'vídeo de chiste/trivial' y baja las defensas. Esa predicción es la que se va a romper; sin ella el giro no pegaría."}, {"momento": "4.8–5.4 · 'C…' sin foto + corte seco a la plaza de noche", "mecanismo": "Error de predicción + reflejo de orientación", "explicacion": "La C es la única opción sin imagen (hueco visual = bucle abierto) y a la vez cambia todo: luz, sitio, voz y ritmo. Un cambio de patrón tan brusco dispara el reflejo de orientación y el pico de dopamina por sorpresa justo cuando la mayoría haría scroll (s 5)."}, {"momento": "5.4–7.8 · 'Despertar un día y darte cuenta de que ya no sabes quién eres'", "mecanismo": "Autorreferencia + reencuadre de 'peligro'", "explicacion": "El peligro pasa de físico a interior: disonancia entre el test de broma y una frase que toca la identidad. 'Darte cuenta' y 'quién eres' activan procesamiento autorreferencial ('esto va de mí'), lo que más retiene y se recuerda."}, {"momento": "12.8–18.6 · 'En un lugar eras más callado, en otro más divertido, y en otro te hacías pequeño para que las personas no se fueran de tu vida'", "mecanismo": "Espejo específico en escalada (efecto Barnum)", "explicacion": "Tres escenas lo bastante concretas para evocar recuerdos propios y lo bastante amplias para servir a casi todos. La tercera escala al miedo al abandono: es la frase que hace guardar y enviar ('esto eres tú')."}, {"momento": "5.3–27.0 · un solo plano fijo nocturno de 21,8 s, él diminuto en una plaza vacía", "mecanismo": "Espacio negativo = soledad; menos carga visual", "explicacion": "Sin cortes ni información nueva en imagen, la atención se va entera a la voz. La figura pequeña en un espacio enorme y oscuro traduce en imagen 'perdido / solo' sin decirlo. El contraste con la intro hace que el plano lento se sienta intencional, no aburrido."}, {"momento": "22.5–28.4 · '¿cuál de todas esas versiones de mí fue realmente auténtica?' → 'O letra D: quemarte'", "mecanismo": "Pregunta sin cerrar (Zeigarnik) + alivio cómico + bucle", "explicacion": "La pregunta en 1.ª persona se queda abierta en la cabeza; justo en el pico de tensión, el chiste literal la descarga (alivio por incongruencia) y devuelve al mismo plano del inicio, lo que empuja a reverlo. La D es además cebo de comentarios: la gente propone su propia 'letra E' y el caption ('A mí me da miedo quemarme') sigue el juego."}], "caption": "A mi me da miedo quemarme\n\nCódigo “Daniel” \n@breathedivinity \n\n#peligroso #motivacion #encajar #personal #viral", "cta": "Sin CTA hablado. La letra D hace de cebo de comentarios (la gente responde con chistes / su letra) y el caption sigue el chiste. Código de patrocinio en el caption.", "titulo_lucas": "Test: ¿qué es más peligroso? (no saber quién eres)", "texto_pantalla_lucas": "¿QUÉ CREES QUE ES MÁS PELIGROSO?", "guion_lucas": [{"texto": "¿Qué crees que es más peligroso?", "plano": "GRABAR: selfie a cámara de noche dentro del coche (o en tu cuarto con luz cálida), gorra, camiseta de color liso fuerte; sonriente y gesticulando. Rótulo arriba '¿QUÉ CREES QUE ES MÁS PELIGROSO?'", "nota": "Tono de juego, como si retaras a un colega. Sonrisa."}, {"texto": "A, nadar entre medusas.", "plano": "Mismo plano a cámara + rótulo 'LETRA A:' + foto encima de la cabeza: STOCK: foto 'swimmer jellyfish' / medusas en el mar", "nota": "Pausa corta tras la 'A'."}, {"texto": "B, bajar un puerto en bici sin frenos.", "plano": "Mismo plano a cámara + 'LETRA B:' + foto: STOCK: foto 'cyclist crash downhill' (caída de ciclista en bajada)", "nota": "Medio riéndote en 'sin frenos'."}, {"texto": "C…", "plano": "Mismo plano a cámara, 'LETRA C:' sin foto. CORTE SECO a ~5,2 s.", "nota": "Alarga la 'C' y sonríe; aquí no hay foto a propósito."}, {"texto": "Despertar un día y darte cuenta de que ya no sabes quién eres.", "plano": "GRABAR: de noche, plano fijo muy abierto con trípode a 15–20 m (gran angular 0,5×), sitio vacío y grande (plaza, pista de atletismo vacía o paseo marítimo) con una farola; tú solo, pequeño, apoyado en la farola mirando el móvil, con ropa de correr oscura. Graba 30 s sin moverte.", "nota": "Cambio total de voz: grave, lenta, íntima, sin sonrisa."}, {"texto": "No porque hayas cambiado de la noche a la mañana,", "plano": "Mismo plano nocturno (sin cortes)"}, {"texto": "sino porque llevas años adaptándote a cada sitio al que llegabas.", "plano": "Mismo plano nocturno (sin cortes)"}, {"texto": "En el gym eras el que nunca se cansaba,", "plano": "Mismo plano nocturno (sin cortes)", "nota": "Enumeración: misma melodía en las tres frases."}, {"texto": "con tus amigos, el gracioso,", "plano": "Mismo plano nocturno (sin cortes)", "nota": "Aquí te estás describiendo a ti: dilo con un poco de verdad."}, {"texto": "y en casa, el que siempre estaba bien para que nadie se preocupara por ti.", "plano": "Mismo plano nocturno (sin cortes)", "nota": "La más importante: más despacio, pausa antes de 'para que nadie'."}, {"texto": "Poco a poco aprendiste a encajar,", "plano": "Mismo plano nocturno (sin cortes)"}, {"texto": "hasta que un día te despiertas y te preguntas:", "plano": "Mismo plano nocturno (sin cortes)", "nota": "Pausa de medio segundo después de 'preguntas'."}, {"texto": "«Después de tanto adaptarme a los demás, ¿cuál de todas esas versiones era yo de verdad?»", "plano": "Mismo plano nocturno; deja ~0,7 s de silencio con 'VERDAD' en pantalla antes del corte", "nota": "En 1.ª persona, casi para ti mismo."}, {"texto": "O letra D: saltarte el día de pierna.", "plano": "Vuelta al plano a cámara del principio (misma toma) + 'LETRA D:' + foto: STOCK: meme 'skip leg day' (tío con tronco enorme y piernas de alambre)", "nota": "Pícaro, cara de 'esto sí que es grave'. Corta en cuanto acabe la frase."}], "palabras_guion_lucas": 121, "duracion_objetivo_s": 28, "viabilidad_recursos": "baja", "que_grabar": ["Intro a cámara (selfie en el coche de noche o en casa), ~8 s: pregunta + A + B + C y, en la misma toma, la letra D al final (graba 3–4 tomas).", "Plano nocturno fijo de 30 s: tú pequeño y solo apoyado en una farola en un sitio grande y vacío (plaza, pista de atletismo, paseo marítimo), trípode a 15–20 m, gran angular, sin moverte."], "stock": ["Foto: nadador entre medusas / medusas en el mar (Pexels 'jellyfish swimmer')", "Foto: caída de ciclista en una bajada (Pexels 'bike crash' / 'cyclist fall')", "Meme 'skip leg day' (tronco grande, piernas finas) para la D"], "notas_edit": "FORMATO COMÚN DE LA SERIE (los 3 de danielgmzs): (1) 0–5 s a cámara, casual y sonriente, en un sitio de andar por casa (coche de noche o su cuarto), pregunta '¿Qué crees que sea más ___?' con rótulo arriba; (2) A y B = respuestas literales y cotidianas, cada una con una foto de stock pequeña y algo ridícula que sale justo en el sustantivo; (3) 'C' sin foto y CORTE SECO a ~5,1–5,3 s a UN ÚNICO plano fijo nocturno de él solo, pequeño en el encuadre (13–21 s sin un solo corte) con voz en off íntima; (4) vuelta al mismo plano a cámara para 'O letra D: ___' = chiste literal con meme de cultura pop (1,4–2,2 s) y fin. Caption = continúa el chiste de la D + código de patrocinio + 5 hashtags. VARÍA: el adjetivo (peligroso / pesado / romántico) y por tanto el tema de la C (identidad / arrepentimiento / amor propio), el sitio de la intro y la camiseta, el plano nocturno (plaza con palmeras / calle con encapuchado / parque a través de un tronco), la tipografía de los subtítulos y si las letras van en rótulo arriba ('LETRA A:') o gigantes en el pecho ('A:'). El más visto (760 K) es el de identidad: el tema más universal y el adjetivo de amenaza más fuerte. | CÓMO CALCARLO: solo 3 planos y cortes secos (≈5,2 s y ≈27 s); nada de zooms, transiciones ni whoosh: el contraste es el efecto. Rótulo arriba en Anton blanca (familia de la casa): pregunta → 'LETRA A:' → 'LETRA B:' → 'LETRA C:' (sin foto) → nada en la noche → 'LETRA D:'. Fotos pequeñas (~60 % del ancho) justo encima de la cabeza, entrando en el sustantivo con pop.mp3 muy suave (el original no lleva sonido; si molesta, quitarlo). Subtítulos de la casa (Subtitulos.tsx, palabra a palabra) en los tres planos; en la noche, a ~1180–1420 sobre el suelo, que no pisen la figura. Música: pad/piano emotivo muy bajo (≈ −28 dB bajo la voz) desde el s 0 hasta el final (ElevenLabs Music si no hay otra). Voz: la intro y la D con sonido directo del micro de solapa; la voz en off grabada aparte en sitio silencioso y con otro tono (más grave y lento). Color del bruto sin tocar; el plano nocturno, con el modo noche del iPhone y nada de subirle exposición. Final = el del original: acaba en la D, sin cola; si se quiere el rótulo 'SÍGUEME PARA MÁS', encima de la D, sin alargar."}, {"id": "DexBD4IgqLP", "creador": "gerardfelipx", "seguidores": 179000, "visitas": 552000, "likes": 34067, "comentarios": 401, "duracion_s": 50.5, "url": "https://www.instagram.com/reel/DexBD4IgqLP/", "formato": "Cumpleaños: 'N cosas sobre mí' en lista rápida (un dato = un plano)", "resumen": "Por su 22 cumpleaños suelta 22 datos de sí mismo a toda velocidad (altura, infancia de 'flaco', waterpolo, Ironman, pies deformados, ultra de 110 km), cada uno ilustrado con un plano literal o una foto antigua. Lo distinto: mezcla vulnerabilidad, cifras concretas y anticlímax cómicos, y abre y cierra con el chiste interno de que le echan más años.", "gancho_voz": "Hoy hago 22 años, así que ahí van 22 cosas sobre mí. 22, no 35.", "gancho_texto_pantalla": "22 cosas sobre mí", "gancho_visual": "Apoyado en el marco de una puerta exterior (glicinia y guirnalda de bombillas arriba) con las manos detrás de la cabeza, camiseta negra Gymshark ajustada y pantalón ancho negro; baja los brazos, se pone una mano en el abdomen y el texto '22 cosas sobre mí' ('22' grande, 'sobre' en cursiva) se queda fijo.", "guion_original": [{"t": "0.0–5.2", "texto": "Hoy hago 22 años, así que ahí van 22 cosas sobre mí. 22, no 35.", "plano": "Apoyado en el marco de una puerta exterior, manos tras la cabeza → de frente con la mano en el abdomen (0–3,3); detalle de una mano abriendo una puerta de cristal hacia el patio (3,3–5,2) en '22, no 35'."}, {"t": "5.2–10.0", "texto": "Mido 1,87, soy hermano pequeño y me encanta entrenar, pero eso ya lo sabéis.", "plano": "Primer plano sin camiseta contra pared blanca, mano en la cabeza midiéndose, texto '187 cm' (5,2–6,7); dos fotos de pequeño con su hermana apiladas (6,7–7,5); corriendo sin camiseta por una calle (7,5–9,0); dominadas en la barra de la pared de ladrillo de otro vídeo suyo (9,0–10,0) en 'ya lo sabéis'."}, {"t": "10.0–13.4", "texto": "Me gusta la montaña más que la playa, me da miedo que aparezca un tiburón.", "plano": "Caminando por una pista de montaña con mochila de trekking (10,0–11,0); se tira de cabeza al mar entre olas (11,0–11,9); nadando solo y lejos en el mar gris (11,9–13,4)."}, {"t": "13.4–16.4", "texto": "De pequeño era el «flaco», y eso me hizo pasar una mala racha.", "plano": "Foto de niño muy delgado en bañador con una flecha dibujada y destellos y el texto 'el \"flaco\"' (13,4–14,5); acaricia a su perro blanco en el sofá (14,5–16,5)."}, {"t": "16.4–18.9", "texto": "Luego me puse fuerte y ahora me encanta correr.", "plano": "De espaldas en la nevera: bebe de una botella y saca un yogur."}, {"t": "18.9–21.3", "texto": "No me gusta nadar, y mira que llevo toda la vida en el agua.", "plano": "Nadando crol en una piscina cubierta de noche (18,9–19,9); sube descalzo unas escaleras de madera, solo se ven las piernas (19,9–21,3)."}, {"t": "21.3–25.4", "texto": "Jugué 10 años a waterpolo y, aunque entrenaba bastante, era muy vago.", "plano": "Dos fotos de waterpolo apiladas (21,3–23,0); de pie ante un armario/espejo se rasca la cara con cara de 'pues sí' (23,0–25,4)."}, {"t": "25.4–30.4", "texto": "Pero hace un año completé un Ironman y me cambió la vida, la confianza… y los pies se me están deformando.", "plano": "Mira hacia arriba (25,4–26,2); foto en la meta de un Ironman en L'Ampolla con el crono 10:14:54 (26,2–27,2); en la bici de crono con casco aero en el box (27,2–28,0); delante del armario (28,0–28,8); POV de sus pies descalzos y primer plano del pie deformado (28,8–30,4)."}, {"t": "30.4–35.4", "texto": "Solía ser bastante, bastante reservado, y eso hace que, de alguna forma, odie las redes sociales.", "plano": "Garaje: con mochila se pone el casco y se sube a la moto (30,5–34,5); sale en moto por una verja blanca junto a un muro de piedra con hiedra (34,5–37,1)."}, {"t": "35.4–41.4", "texto": "Me gusta mucho estar solo. Me encantan los helados y las chuches; suerte que mis entrenos las justifican un poquito.", "plano": "Sale en moto (hasta 37,1); sentado sin camiseta en un sofá blanco comiendo algo dulce con su perro mirándole (37,1–38,9); pedaleando en una bici estática sin camiseta, al final sonríe a cámara en 'un poquito' (38,9–42,7)."}, {"t": "41.4–47.4", "texto": "En 9 meses voy a correr 110 kilómetros por la montaña y no sé ni dónde me he metido, pero es que nunca tengo suficiente.", "plano": "De noche corriendo con frontal (42,7–43,9); haz del frontal en la oscuridad con texto '110km' (43,9–44,8); amanecer sobre montañas (44,8–45,0); pedrera de alta montaña al atardecer en 'dónde me he metido' (45,0–46,0); sin camiseta en la terraza de ladrillo de su vídeo viral, abre las manos en 'nunca tengo suficiente' (46,0–47,9)."}, {"t": "47.4–50.5", "texto": "Y la última: no me echéis 40. Ya basta, ¿no?", "plano": "Tumbado en el sofá se tapa la cara con las manos, se incorpora y se va de plano."}], "estructura": [{"bloque": "Gancho + promesa de lista", "t": "0–5,2", "funcion": "Fecha especial + número concreto (22 cosas) = bucle abierto con estructura clara; el '22, no 35' es un guiño a la comunidad."}, {"bloque": "Datos rápidos ligeros", "t": "5,2–13,4", "funcion": "Datos fáciles y visuales (altura, hermana, montaña/playa, tiburón) para meter ritmo y cercanía."}, {"bloque": "Vulnerabilidad", "t": "13,4–16,4", "funcion": "'Era el flaco' con foto real: abre la herida y crea empatía."}, {"bloque": "Transformación", "t": "16,4–30,4", "funcion": "De flaco/vago a Ironman: el arco del héroe en 15 s, rematado con un anticlímax cómico (pies deformados)."}, {"bloque": "Personalidad", "t": "30,4–41,4", "funcion": "Reservado, odia las redes, le gusta estar solo, ama las chuches: humaniza y contradice la imagen de 'influencer fitness'."}, {"bloque": "Reto futuro", "t": "41,4–47,4", "funcion": "110 km en 9 meses: bucle abierto a largo plazo (seguirle para ver si lo consigue)."}, {"bloque": "Cierre callback", "t": "47,4–50,5", "funcion": "Vuelve al chiste de la edad ('no me echéis 40'): cierra el círculo y provoca comentarios."}], "edicion": {"num_planos": 28, "s_por_plano": 1.8, "subtitulos": "Palabra a palabra, blanco, sans serif en negrita pequeña (tipo Montserrat), sin caja, en minúsculas, centrados más o menos a media altura; en el gancho las palabras se acumulan ('22 cosas sobre mí', con 'sobre' en cursiva serif) y en el cierre ('ya basta no?').", "texto_pantalla": "'22 cosas sobre mí' fijo en el gancho; '187 cm' en el dato de la altura; 'el \"flaco\"' con flecha dibujada a mano y destellos sobre la foto de niño; '110km' sobre el frontal. Fotos antiguas a pantalla partida (dos fotos apiladas).", "musica": "Instrumental de fondo constante bajo la voz (no identificada), ambiente tranquilo/emotivo.", "efectos": "Cortes secos rapidísimos (≈1,8 s/plano, algunos de 0,8 s) sin transiciones; fotos antiguas como inserts; reutiliza planos de sus vídeos virales (barra de dominadas, terraza de ladrillo) como guiño. Mucho detalle literal: cada palabra concreta tiene su plano (tiburón → mar, pies → pie).", "voz": "Rápida, cercana y con humor seco, como contándoselo a un amigo; ~3,7 palabras/s (≈185 palabras en 50 s), pausa corta antes de cada remate ('y los pies se me están deformando', 'ya basta, ¿no?')."}, "por_que_funciona": [{"momento": "0.0–3.3 · 'Hoy hago 22 años, así que ahí van 22 cosas sobre mí'", "mecanismo": "Bucle abierto + promesa clara", "explicacion": "Un número concreto de cosas crea una lista que el cerebro quiere completar (efecto Zeigarnik) y deja claro que va a ser rápido y variado. El cumpleaños añade una excusa emocional para conocerle y felicitarle en comentarios."}, {"momento": "3.3–5.2 · '22, no 35' y 47.4–50.5 · 'no me echéis 40, ya basta, ¿no?'", "mecanismo": "Chiste interno de comunidad + comentarios provocados", "explicacion": "Recompensa a los que ya le siguen (entienden la broma del vídeo de los 35 → sensación de pertenencia) y, al cerrar con la misma broma, invita a seguirla: la gente comenta la edad que le echa. Abrir y cerrar con lo mismo da sensación de cierre redondo y empuja a reverlo."}, {"momento": "5.2–6.7 · '1,87' / 26.2–27.2 · crono 10:14:54 / 41.4–44.8 · '110 km en 9 meses'", "mecanismo": "Especificidad de cifras", "explicacion": "Las cifras exactas (altura, años de waterpolo, tiempo en meta, kilómetros, meses) suenan a verdad y son datos 'coleccionables' que el espectador recuerda y comenta; el texto en pantalla las fija."}, {"momento": "13.4–16.4 · foto de niño con la flecha 'el \"flaco\"' + 'me hizo pasar una mala racha'", "mecanismo": "Vulnerabilidad auténtica", "explicacion": "Una foto real de infancia y una confesión breve generan empatía y confianza (oxitocina); el que también fue 'el flaco' o 'el gordito' se identifica, y prepara el contraste con el Ironman (arco de transformación)."}, {"momento": "28.8–30.4 · '…me cambió la vida, la confianza… y los pies se me están deformando' + POV del pie", "mecanismo": "Error de predicción (anticlímax cómico)", "explicacion": "Tras una frase épica el cerebro espera otra épica y recibe un pie deformado en primer plano: sorpresa + risa (dopamina). Es el momento más compartible y rompe cualquier tono de 'creído'."}, {"momento": "Todo el vídeo · un plano literal cada ~1,8 s (tiburón → mar, montaña → pista, 110 km → frontal)", "mecanismo": "Novedad visual + codificación dual", "explicacion": "Cada dato tiene su propio plano: los cortes constantes disparan el reflejo de orientación y lo que se oye y se ve a la vez se entiende y recuerda mejor, así que nadie se aburre en 50 s de lista."}, {"momento": "30.4–35.4 · 'odie las redes sociales' / 35.4–41.4 · 'me encantan los helados y las chuches'", "mecanismo": "Disonancia + humanización", "explicacion": "Un creador que dice odiar las redes y un deportista de Ironman que ama las chuches contradicen el estereotipo: esa pequeña disonancia le hace creíble y cercano, y da pie a comentarios ('yo igual con las chuches')."}], "caption": "22.\n\n#fitness #deporte #correr", "cta": "Sin CTA explícito; el cierre 'no me echéis 40, ya basta, ¿no?' funciona como invitación a comentar (y la fecha de cumpleaños a felicitar).", "titulo_lucas": "[Tu edad] cosas sobre mí (cumpleaños)", "texto_pantalla_lucas": "[tu edad] cosas sobre mí  (número grande, 'sobre' en cursiva serif)", "guion_lucas": [{"texto": "Hoy hago [tu edad] años, así que ahí van [tu edad] cosas sobre mí.", "plano": "recursos/gym/fisico/2026-06-09_posado-luz-lateral-primer-plano-brazos-cruzados_conjunto-azul-gymshark.MOV @ 2–6 (brazos cruzados con luz lateral)", "nota": "Si no es tu cumpleaños, 'Ahí van [N] cosas sobre mí que no sabíais'. Texto fijo '[edad] cosas sobre mí'."}, {"texto": "[Remate corto opcional, p. ej. 'Y no, no son demasiadas.']", "plano": "GRABAR: detalle de tu mano abriendo una puerta o la nevera (1,5 s)", "nota": "Seco, como el '22, no 35'. Si nadie te echa años, sirve cualquier broma corta."}, {"texto": "Mido [tu altura], soy [hermano mayor / pequeño / hijo único] y me encanta entrenar, pero eso ya lo sabéis.", "plano": "GRABAR: primer plano contra una pared midiéndote con la mano en la cabeza, texto '[altura] cm' (1,5 s) → GRABAR: foto real de pequeño con tus hermanos (o solo), 1 s → recursos/gym/biceps/2026-01-19_curl-barra-z_de-frente_manga-larga-negra.MOV @ 2–4", "nota": "'Pero eso ya lo sabéis' con media sonrisa."}, {"texto": "Me gusta más [la montaña / la playa] que [la otra] y me da miedo [tu miedo real, p. ej. 'nadar en el mar sin ver el fondo'].", "plano": "recursos/running/2026-06-23_correr-paseo-dunas_de-frente_tirantes-negra-aire.MOV @ 1–3 → recursos/running/2024-12-11_selfie-hablando-carril-bici-nublado_sudadera-asics-azul-marino.MOV @ 4–7 (cielo gris y dunas)", "nota": "Si el miedo es el mar, STOCK de mar abierto gris de 1,5 s."}, {"texto": "De pequeño era [cómo eras, p. ej. 'el que no hacía deporte'], y eso [lo que te supuso, p. ej. 'me pasó factura'].", "plano": "GRABAR: foto real de pequeño con una flecha dibujada y el texto de tu apodo (1 s) → recursos/recuperacion/2025-11-26_ducha-spa-luz-roja_de-espaldas_sin-camiseta.MOV @ 1–3", "nota": "Más bajo y lento: es el momento vulnerable."}, {"texto": "Luego empecé a entrenar y ahora me encanta correr.", "plano": "recursos/running/2026-10-18_correr-calle-ladrillo_espaldas-y-lado_manga-larga-negra.MOV @ 19–22 (de lado sonriendo)", "nota": "Sube la energía."}, {"texto": "[Algo de la preparación que te cueste, p. ej. 'Nadar no es lo mío'], y mira que estoy preparando un medio Ironman.", "plano": "GRABAR: nadando en piscina, plano desde el borde (2 s) → GRABAR: subiendo escaleras descalzo, solo piernas (1,5 s)", "nota": "Ironía, sin dramatizar."}, {"texto": "[Deporte de pequeño, p. ej. 'Jugué X años a fútbol'] y, aunque entrenaba, [anécdota real, p. ej. 'era el último en todos los sprints'].", "plano": "GRABAR: foto real de ese deporte (1,5 s) → recursos/aire-libre/2026-04-27_colgado-barras-playa-riendo_gorra-gris_sin-camiseta.MOV @ 5–7,9 (riendo)", "nota": "Pausa antes de la anécdota."}, {"texto": "Este año voy a por un maratón y un medio Ironman, y me está cambiando la vida, la confianza… y [efecto secundario cómico real, p. ej. 'las uñas de los pies'].", "plano": "recursos/competicion/2025-11-09_carrera-dorsal-29233_corriendo-lateral-y-frente_ropa-blanca.MOV @ 9–12 → recursos/competicion/2025-11-09_carrera-dorsal-29233_mordiendo-medalla_ropa-blanca.MOV @ 0–2 → GRABAR: POV de tus pies descalzos y zoom a lo del remate (2 s)", "nota": "Frase épica arriba y caída seca en el remate: el POV entra justo en esa palabra."}, {"texto": "Siempre he sido bastante, bastante [rasgo real, p. ej. 'vergonzoso'], y por eso me costó ponerme delante de una cámara.", "plano": "recursos/running/2026-10-24_outfit-trail-se-prepara-en-parking_gafas-rojas-chaleco.MOV @ 30–35 (primeros planos tapándose la cara) → recursos/lifestyle/2026-09-24_andando-con-portatil-paseo-soleado_tirantes-negra.MOV @ 17–21 (se va de espaldas)", "nota": "Repite 'bastante, bastante' como el original."}, {"texto": "He aprendido a estar solo, y me encanta. Me encantan [tu capricho dulce]; suerte que los kilómetros lo justifican un poquito.", "plano": "recursos/running/2025-07-09_pov-abdomen-caminando-camino-pinos_pantalon-oliva.MOV @ 0–4 → GRABAR: en el sofá comiendo tu capricho (1,5 s) → recursos/gym/cardio/2026-08-11_cinta-contrapicado-desde-consola_tirantes-celeste-sudada.MOV @ 6–9", "nota": "Sonríe a cámara en 'un poquito'."}, {"texto": "En [meses que faltan] meses corro [tu maratón] y no sé ni dónde me he metido, pero es que nunca tengo suficiente.", "plano": "recursos/running/2026-03-17_correr-amanecer-pasarela_02-lateral-silueta-con-el-sol_manga-larga-negra.MOV @ 3–5 (texto '42 km') → recursos/running/2025-10-20_correr-carril-dunas-atardecer_03-lateral-cerca-mar_camiseta-gris-pantalon-oliva.MOV @ 0–2 → recursos/running/2026-10-30_selfie-contrapicado-trail-buenos-dias_gafas-rojas-chaleco.MOV @ 0–2,5", "nota": "'Nunca tengo suficiente' con las manos abiertas."}, {"texto": "Y la última: [remate cómico real, p. ej. 'no, esta noche tampoco salgo'].", "plano": "recursos/lifestyle/2025-06-27_chiringuito-servilletas-cafe_sin-camiseta-pantalon-gris.MOV @ 11–17 (se acerca mucho a cámara, cómico) — o GRABAR: en el sofá tapándote la cara y te vas de plano", "nota": "Corta en seco al terminar."}], "duracion_objetivo_s": 50, "viabilidad_recursos": "media", "que_grabar": ["Primer plano midiéndote contra la pared (1,5 s).", "Fotos reales de pequeño (con hermanos, del apodo y del deporte que hacías) para insertar a pantalla partida.", "Nadando en piscina desde el borde (2 s) y subiendo escaleras descalzo (1,5 s).", "POV de tus pies descalzos para el remate cómico (2 s).", "En el sofá comiendo tu capricho dulce (1,5 s).", "Detalle de mano abriendo puerta/nevera (1,5 s) y, si quieres, cierre en el sofá tapándote la cara.", "Rellenar todos los huecos con datos reales (edad, altura, hermanos, miedo, apodo de pequeño, deporte, maratón y fecha)."], "stock": ["Mar abierto gris desde la orilla, 1,5 s (solo si el miedo es al mar)"], "notas_edit": "Ritmo muy rápido: ~28 planos en 50 s (≈1,8 s/plano, algunos de 0,8–1 s), un plano literal por dato, cortes secos sin transiciones. Subtítulos palabra a palabra blancos, sans bold pequeña sin caja, en minúsculas; en el gancho se acumula '[edad] cosas sobre mí' con el número grande y 'sobre' en cursiva serif. Textos de dato en pantalla para las cifras ('187 cm', '42 km'…) y flecha dibujada a mano + destellos sobre la foto de pequeño. Fotos antiguas como inserts a pantalla partida (dos apiladas). Música instrumental tranquila constante bajo la voz. Lee rápido y con humor seco; deja medio segundo antes de cada remate. Cierra con el remate y corta en seco.", "palabras_guion_lucas": 203}, {"id": "DaTOwamgamw", "creador": "gerardfelipx", "seguidores": 179000, "visitas": 476000, "likes": 17361, "comentarios": 195, "duracion_s": 57.6, "url": "https://www.instagram.com/reel/DaTOwamgamw/", "formato": "Day in my life con hora en pantalla (estudia + trabaja + entrena + redes)", "resumen": "Un día entero de un chaval de 21 años que estudia, trabaja 8 horas en un hotel, entrena y sube contenido, contado de las 6:00 a las 22:30 con la hora siempre en pantalla. Lo distinto: lo cuenta sin postureo, con humor de 'día normal' (bufé del curro, hamburguesa que se cae, 'no soy un guarro', 'vaya rima').", "gancho_voz": "Así es un día de un chaval que estudia, trabaja, entrena y sube contenido a redes sociales.", "gancho_texto_pantalla": "day in my life / a los 21 años", "gancho_visual": "Plano fijo desde el pasillo, con el marco de la puerta tapando un lado (efecto mirón): duerme boca abajo en calzoncillos en una cama individual con cuadro de fotos rojas detrás; a los 2,5 s se mueve y se incorpora. Texto 'day in my life / a los 21 años' centrado.", "guion_original": [{"t": "0.0–4.2", "texto": "Así es un día de un chaval que estudia, trabaja, entrena y sube contenido a redes sociales.", "plano": "Durmiendo boca abajo, plano fijo desde la puerta; texto 'day in my life a los 21 años'; se despierta y se sienta en el borde de la cama ('06:00 am')."}, {"t": "4.2–8.0", "texto": "Son las 6 de la mañana, así que me replanteo un poco la vida, me visto, me lavo los dientes.", "plano": "Sentado en la cama con la cabeza gacha (06:00), se pone la camiseta negra (06:05) (hasta 7,5); en el baño se lava los dientes (06:07)."}, {"t": "8.0–11.3", "texto": "Bueno, y hago las típicas cosas de por la mañana.", "plano": "De espaldas en el baño (06:10); en el espejo se arregla el pelo y la barba (06:13)."}, {"t": "11.3–17.8", "texto": "Importantísimo: beber agua al despertarse. Cojo el casco y me voy para el trabajo, porque sí, ya voy tarde, normal, imagínate si me tengo que grabar.", "plano": "Bebe agua de una botella en la cocina (06:15); coge el casco de la mesa (06:18); sale de casa con mochila Nike Pro (06:18); sale al portal (06:20); en el garaje se sube a la moto y arranca (06:21–06:24)."}, {"t": "17.8–25.9", "texto": "Aquí la verdad es que no hay ningún misterio: un trabajo normal, 8 horas en un hotel, que al menos tengo bufé libre y puedo comer lo que quiera. Hoy han tocado canelones, huevos y carne.", "plano": "Llega en moto por el parking del hotel (06:50), aparca y entra por la puerta de servicio (hasta 21,3); bufé de personal (13:00) (21,3–23,2); bandeja con canelones, huevos duros y carne con tomate (23,2–25,4)."}, {"t": "25.9–28.4", "texto": "(sin voz en off: audio del vestuario, risas)", "plano": "Vestuario (15:00): él con la camisa estampada del uniforme se parte de risa contra una taquilla con un compañero en calzoncillos."}, {"t": "28.4–30.0", "texto": "La camiseta es el uniforme.", "plano": "Se quita la ropa del trabajo junto a la taquilla (15:03)."}, {"t": "30.0–34.1", "texto": "Me visto rápido porque son las 3 y tengo un examen. No sin antes abrir la nevera.", "plano": "Ya cambiado, de espaldas (15:03); sale en moto del parking (15:07) (31,2–32,4); en casa se quita la camiseta y abre la nevera (15:40)."}, {"t": "34.1–36.4", "texto": "¿Soy el único con esta manía? Y ahora sí, empieza el examen.", "plano": "Mira la nevera abierta sin coger nada; entra en el salón (15:50); sentado en el sofá con el portátil (16:45)."}, {"t": "36.4–42.9", "texto": "Y diréis: ¿qué haces en el sofá? Bueno, es que estudio marketing online, 100 % online. Y es uno de los motivos por los cuales yo puedo hacer tantas cosas.", "plano": "Mismo plano del sofá pasando las horas (17:15, 17:50, 18:25, 19:15); en el pasillo se cambia a ropa de correr y se ata las zapatillas (19:30)."}, {"t": "42.9–46.0", "texto": "Aquí, como veis, he salido a correr, porque nunca puede faltar el deporte.", "plano": "POV de sus pies corriendo por la acera (19:40); corriendo de espaldas por un camino de tierra entre cañas al atardecer (20:40)."}, {"t": "46.0–52.6", "texto": "Y lo siento, porque no soy el mejor cocinero: como veis, se me ha caído media hamburguesa, pero me la he comido igual. No tiene muy buena pinta, pero es lo que hay.", "plano": "Cocina sin camiseta: voltea la sartén y se le cae media hamburguesa (21:00–21:05); plato con la hamburguesa deshecha y raviolis en un mantel de cerezas (21:20)."}, {"t": "52.6–57.6", "texto": "No soy un guarro: me he lavado los dientes, me he duchado, pero no lo he grabado porque estoy reventado. Vaya rima. Buenas noches.", "plano": "Se mete en la cama y se tapa (22:30), hace un gesto con la mano y se deja caer en la almohada; negro con 'buenas noches'."}], "estructura": [{"bloque": "Gancho de identidad + promesa", "t": "0–4,2", "funcion": "Enumera 4 roles (estudia, trabaja, entrena, redes) → '¿cómo le da tiempo?' y promete ver el día entero."}, {"bloque": "Mañana", "t": "4,2–17,8", "funcion": "Rutina reconocible con humor ('me replanteo un poco la vida', 'ya voy tarde, normal'); la hora en pantalla da sensación de progreso."}, {"bloque": "Trabajo", "t": "17,8–30,0", "funcion": "Desmitifica ('no hay ningún misterio, un trabajo normal'); detalle concreto del bufé y momento cómico con un compañero."}, {"bloque": "Estudio + pregunta anticipada", "t": "30,0–42,9", "funcion": "Examen en el sofá, manía de la nevera; anticipa la objeción ('¿qué haces en el sofá?') y da la clave: estudios 100 % online."}, {"bloque": "Entreno", "t": "42,9–46,0", "funcion": "El deporte como no negociable."}, {"bloque": "Noche + cierre cómico", "t": "46,0–57,6", "funcion": "Fallos reales (hamburguesa caída), autoironía ('no soy un guarro', 'vaya rima') y despedida: final cálido que deja buen sabor."}], "edicion": {"num_planos": 23, "s_por_plano": 2.5, "subtitulos": "Palabra a palabra, blanco, sans serif pequeña (tipo Montserrat), sin caja, en minúsculas, en el tercio inferior-centro; discretos para no competir con la hora.", "texto_pantalla": "'day in my life / a los 21 años' centrado en el gancho (0,4–4 s). Hora en cada plano ('06:00 am', '06:05 am', '13:00', '15:40', '22:30'…) en blanco fino semitransparente, centrada arriba del subtítulo, cambiando con cada plano. Final en negro con 'buenas noches'.", "musica": "Instrumental de fondo constante bajo la voz (no identificada), ambiente tranquilo; en 25,9–28,4 suena el audio ambiente del vestuario (risas).", "efectos": "Cortes secos; casi todo planos fijos con la cámara apoyada, muchos desde el marco de una puerta (efecto 'te estoy espiando'); un POV de pies corriendo. Sin zooms ni transiciones. Color natural, algo desaturado y cálido.", "voz": "Relajada, de colega, con humor e ironía ('normal', 'vaya rima'); ~4,4 palabras/s (≈243 palabras en 55 s de voz): rápida pero suelta."}, "por_que_funciona": [{"momento": "0.0–4.2 · 'un chaval que estudia, trabaja, entrena y sube contenido' + chico dormido", "mecanismo": "Brecha de curiosidad + autorreferencia", "explicacion": "Cuatro obligaciones a la vez abren la pregunta '¿cómo le da tiempo?' (que se responde en el 38,4 s) y cualquier joven que estudia y trabaja piensa 'esto va de mí'. El texto 'day in my life a los 21 años' etiqueta el formato y su edad invita a compararse."}, {"momento": "Todo el vídeo · hora en pantalla de 06:00 a 22:30", "mecanismo": "Progreso visible (efecto meta)", "explicacion": "La hora funciona como barra de progreso: el cerebro quiere llegar al final del día y saber cómo acaba, lo que sostiene la retención en casi un minuto. Además da credibilidad (es un día real, con horas concretas)."}, {"momento": "4.2–17.8 · 'me replanteo un poco la vida', 'ya voy tarde, normal, imagínate si me tengo que grabar'", "mecanismo": "Humor de identificación", "explicacion": "Rompe la imagen de rutina perfecta de las 5 am: el espectador se ríe porque le pasa lo mismo. Esa normalidad baja la distancia con alguien en forma y genera simpatía."}, {"momento": "17.8–28.4 · 'no hay ningún misterio, un trabajo normal… bufé libre' + risas en el vestuario", "mecanismo": "Autenticidad / vida real", "explicacion": "Mostrar un curro normal en un hotel y comida de bufé de personal es lo contrario del lujo de influencer: genera confianza y la sensación de 'si él puede, yo también'. El corte sin voz con las risas es un respiro y un momento humano."}, {"momento": "34.1–36.4 · '¿Soy el único con esta manía?' (abrir la nevera sin coger nada)", "mecanismo": "Pregunta directa + comentarios", "explicacion": "Una manía universal formulada como pregunta hace que el espectador responda mentalmente ('yo también') y en comentarios; es interacción a cambio de nada."}, {"momento": "36.4–42.9 · 'Y diréis: ¿qué haces en el sofá? … estudio marketing 100 % online'", "mecanismo": "Anticipar la objeción + cerrar el bucle", "explicacion": "Pone en boca del espectador la duda que tenía y la resuelve justo ahí: cierra la brecha abierta en el gancho y da una información útil (estudiar online permite compaginar), lo que hace el vídeo guardable."}, {"momento": "46.0–57.6 · hamburguesa que se cae + 'no soy un guarro… estoy reventado. Vaya rima. Buenas noches'", "mecanismo": "Error de predicción + final cálido", "explicacion": "Esperas una cena fitness perfecta y ves una hamburguesa deshecha: sorpresa y risa. El 'vaya rima' es un remate inesperado que deja buen sabor y empuja a reverlo o compartirlo; cerrar en la cama completa el círculo con el plano del gancho."}], "caption": "Un día en mi vida.\n\nSomos capaces de mucho más de lo que imaginamos.\nSolo hay que quererlo y acostumbrarte a ello.\n\nYo no empecé teniendo este estilo de vida ni esta disciplina o constancia, como lo quieras llamar.\nPoco a poco, aspirando a ello, he ido mejorando.\n\nY cada vez me siento mejor con mi día a día, con mi estilo de vida y con las cosas que hago.\n\nTe animo a que pruebes e intentes cosas nuevas, y te mantengas ocupado.\nPero también a que pares cuando sea necesario.\nPara reflexionar, para pensar o simplemente para charlar con tus amigos una noche de verano.\n\nUn abrazo.🫂\n\n#dayinmylife #lifestyle #deporte #disciplina #rutina", "cta": "Sin CTA en el vídeo; la pregunta '¿Soy el único con esta manía?' hace de llamada a comentar y el caption reflexivo anima a probar cosas nuevas.", "titulo_lucas": "Day in my life preparando maratón + medio Ironman", "texto_pantalla_lucas": "day in my life / preparando un maratón y un medio Ironman", "guion_lucas": [{"texto": "Así es un día de un chaval que [lo que haces, p. ej. 'trabaja'], entrena para un maratón y un medio Ironman y sube contenido a redes.", "plano": "GRABAR: durmiendo boca abajo, plano fijo desde el pasillo con el marco de la puerta en primer plano; te incorporas y te sientas en el borde de la cama (4 s)", "nota": "Texto 'day in my life' + hora '[hora] am'. Tono de colega."}, {"texto": "Son las [hora a la que te levantas] de la mañana, así que me replanteo un poco la vida, me visto y me lavo los dientes.", "plano": "GRABAR: mismo plano, sentado con la cabeza gacha y poniéndote la camiseta (3 s) → GRABAR: lavándote los dientes desde la puerta del baño (1 s)", "nota": "'Me replanteo un poco la vida' con desgana cómica."}, {"texto": "Bueno, y hago las típicas cosas de por la mañana.", "plano": "GRABAR: en el espejo arreglándote el pelo, desde la puerta (2,5 s)", "nota": ""}, {"texto": "Importantísimo: beber agua al despertarse. [Lo primero que haces, p. ej. 'Me pongo las zapatillas y salgo a rodar'], porque sí, a estas horas, imagínate si encima me tengo que grabar.", "plano": "recursos/gym/fisico/2026-07-25_aesthetic-devant_bebe-de-la-garrafa_manga-larga-gris.MP4 @ 15–17 → recursos/running/2026-10-24_outfit-trail-se-prepara-en-parking_gafas-rojas-chaleco.MOV @ 0–3 → recursos/running/2026-03-17_selfie-correr-amanecer-paseo-maritimo_manga-larga-negra.MOV @ 2–4 → recursos/running/2026-03-17_correr-amanecer-pasarela_02-lateral-silueta-con-el-sol_manga-larga-negra.MOV @ 3–6", "nota": "Si tu mañana es otra (trabajo primero), GRABAR: coges las llaves y sales por la puerta. Pon la hora real en cada plano."}, {"texto": "Aquí la verdad es que no hay ningún misterio: [tu trabajo o estudios, p. ej. 'ocho horas de curro normal'], que al menos [lo bueno que tenga]. Hoy ha tocado [lo que comes].", "plano": "GRABAR: llegando al trabajo/clase y entrando por la puerta (3 s) → GRABAR: cenital de tu plato o tupper de comida (2 s) → recursos/lifestyle/2026-09-24_andando-con-portatil-paseo-soleado_tirantes-negra.MOV @ 8–11 (si trabajas en remoto)", "nota": "No inventes: lo que de verdad hagas ese día."}, {"texto": "(sin voz: 2–3 s de un momento gracioso real del día)", "plano": "recursos/lifestyle/2025-05-10_coche-amigos-selfie-risas_manga-larga-negra.MOV @ 10–13 (risas con amigos) — o lo que pase de verdad ese día", "nota": "Deja el audio ambiente."}, {"texto": "[Frase corta de cambio de ropa, p. ej. 'El chándal es mi uniforme.']", "plano": "GRABAR: cambiándote de ropa de espaldas, plano fijo (1,5 s)", "nota": ""}, {"texto": "Me cambio rápido porque son las [hora] y toca [entreno de la tarde, p. ej. 'piscina']. No sin antes abrir la nevera. ¿Soy el único con esta manía?", "plano": "GRABAR: abres la nevera, miras y la cierras sin coger nada (2,5 s)", "nota": "Pregunta directa a cámara, mirada cómplice."}, {"texto": "Y ahora sí, empieza el entreno.", "plano": "recursos/gym/cardio/2026-11-01_hibrido_skierg-lateral.MOV @ 4,6–7 → recursos/gym/funcional/2026-11-01_hibrido_wall-balls-lateral.mov @ 13,3–16", "nota": "Pon la hora en cada plano."}, {"texto": "Y diréis: ¿cómo te da tiempo a todo? Bueno, es que [lo que te lo permite de verdad, p. ej. 'organizo la semana el domingo']. Y es uno de los motivos por los que puedo hacer tantas cosas.", "plano": "recursos/lifestyle/2026-09-24_andando-con-portatil-paseo-soleado_tirantes-negra.MOV @ 0–4 → GRABAR: sentado en el pasillo atándote las zapatillas (2 s)", "nota": "Aquí se cierra la duda del gancho: dilo claro."}, {"texto": "Aquí, como veis, he salido a correr, porque nunca puede faltar el deporte.", "plano": "recursos/competicion/2025-11-09_carrera-dorsal-29233_pov-pies-y-dorsal_ropa-blanca.MOV @ 0–3 (POV pies) → recursos/running/2025-10-20_correr-carril-dunas-atardecer_01-espaldas_camiseta-gris-pantalon-oliva.MOV @ 2–7 (de espaldas al atardecer, como el original)", "nota": "Si ese día no corres, cambia por el entreno real."}, {"texto": "Y lo siento, porque no soy el mejor cocinero: como veis, [desastre real en la cocina, p. ej. 'se me ha quemado la tortilla'], pero me la he comido igual. No tiene muy buena pinta, pero es lo que hay.", "plano": "GRABAR: cocinando de pie, plano fijo (3 s) → GRABAR: cenital del plato tal cual quede (2 s)", "nota": "El fallo tiene que ser real; si sale perfecto, cuenta otro fallo del día."}, {"texto": "No soy un guarro: me he duchado, me he lavado los dientes, pero no lo he grabado porque estoy reventado. Vaya rima. Buenas noches.", "plano": "GRABAR: te metes en la cama y te tapas, mismo plano desde la puerta que el gancho (4 s) → negro con 'buenas noches'", "nota": "'Vaya rima' bajito, como para ti."}], "duracion_objetivo_s": 57, "viabilidad_recursos": "baja", "que_grabar": ["Plano fijo desde la puerta del cuarto: durmiendo, incorporándote, poniéndote la camiseta y, por la noche, metiéndote en la cama (mismo encuadre para abrir y cerrar).", "Baño desde la puerta: lavándote los dientes y en el espejo (2 planos cortos).", "Llegada al trabajo/clase y cenital de la comida.", "Cambiándote de ropa de espaldas.", "Abriendo la nevera sin coger nada.", "Sentado en el pasillo atándote las zapatillas.", "Cocinando la cena y cenital del plato (con el fallo real).", "Apuntar la hora real de cada plano para ponerla en pantalla y rellenar los huecos (trabajo/estudios, horarios, comida, entreno de ese día)."], "stock": [], "notas_edit": "Graba un día real de principio a fin. Ritmo: ~23 planos en ~57 s (≈2,5 s/plano), cortes secos, casi todo plano fijo con el móvil apoyado y muchos desde el marco de una puerta (efecto mirón). Texto 'day in my life / preparando un maratón y un medio Ironman' centrado en el gancho; en todos los planos la hora real en blanco fino semitransparente arriba del subtítulo ('06:30 am', '13:00', '22:30'…). Subtítulos palabra a palabra, pequeños, blancos, sin caja, en el tercio inferior. Música instrumental tranquila constante; en el momento gracioso sin voz deja el audio ambiente. Abre y cierra en la cama con el mismo encuadre; final en negro con 'buenas noches'. Caption reflexivo y largo sobre constancia y probar cosas nuevas, como el original.", "palabras_guion_lucas": 240}, {"id": "DYXW2sfN3AF", "creador": "diegosicrex", "seguidores": 262000, "visitas": 368000, "likes": 0, "comentarios": 0, "duracion_s": 38.6, "url": "https://www.instagram.com/reel/DYXW2sfN3AF/", "formato": "Rutina de mañana aspiracional ('lo que hago cada mañana') con mito + realidad", "resumen": "Diego (22 años) enseña su mañana paso a paso para tener 'un físico y una concentración del 1 %': sin despertador, agua con sal y sol, no desayuna fuerte, café, trabaja antes de entrenar. Lo distinto: cada paso trae un porqué que contradice lo habitual y un plano cinematográfico que lo ilustra literalmente.", "gancho_voz": "Soy Diego, tengo 22 años y un físico y una concentración que menos del 1 % consigue. Esto es lo que hago cada mañana para conseguirlo.", "gancho_texto_pantalla": "Qué hago con 22 años para tener un físico y atención del 1%", "gancho_visual": "0–2,4 s: Diego sin camiseta (abdominales marcados, calzoncillo Calvin Klein) apoyado en la encimera de su cocina con fresas y plátano en una tabla, mira a un lado y se come una fresa; luz cálida de mañana, plano medio fijo. Barrido (whip) a 2,4–4,75 s: en el sofá con camiseta gris, leyendo un libro con la mano en la barbilla. El título fijo en 2 líneas en el centro todo el rato; sin subtítulos durante el gancho.", "guion_original": [{"t": "0.1–4.6", "texto": "Soy Diego, tengo 22 años y un físico y una concentración que menos del 1 % consigue.", "plano": "0–2,4 cocina sin camiseta comiendo una fresa (físico) → whip → 2,4–4,75 sofá con camiseta gris leyendo, mano en la barbilla (concentración)"}, {"t": "4.8–6.6", "texto": "Esto es lo que hago cada mañana para conseguirlo.", "plano": "Tumbado en la cama sin camiseta, plano picado lateral (abdominales), despertándose"}, {"t": "6.8–8.8", "texto": "Me levanto sin despertador, siempre que puedo,", "plano": "En la cama con antifaz verde, se estira con el brazo por encima de la cabeza"}, {"t": "8.9–13.2", "texto": "porque poner una alarma te arranca de un proceso fundamental que tu cuerpo todavía no había terminado.", "plano": "9,2–11,5 se incorpora y se quita el antifaz (lleva cinta en la boca para dormir) → 11,5–13,0 primer plano de un despertador digital que marca 4:41"}, {"t": "13.3–16.5", "texto": "Al levantarme, medio litrito de agua con sal y luz solar directa.", "plano": "13,0–13,9 whip a la terraza, bebe un vaso de agua sin camiseta → 13,9–15,5 pellizco de sal cayendo en un vaso (cámara lenta, cenital-lateral) → 15,5–16,5 de perfil en la terraza mirando al cielo nublado con el vaso"}, {"t": "16.7–21.3", "texto": "Mucha gente cree que está cansada, pero en realidad empieza el día deshidratada y mirando una pantalla.", "plano": "16,5–18,2 cenital en la cama, cara de cansado → 18,2–20,4 vaso llenándose en el dispensador de la nevera (reloj verde en la muñeca) → 20,4–21,3 en la mesa con el portátil, mano en la cara + whip"}, {"t": "21.4–23.5", "texto": "No desayuno fuerte: por la mañana quiero foco.", "plano": "Cenital de la encimera: plato con yogur/proteína, plátano y fresas; su mano lo mezcla con cuchara"}, {"t": "23.6–25.0", "texto": "Luego café, bastante café,", "plano": "Cafetera Philips de frente → primer plano del café cayendo en el vaso"}, {"t": "25.1–31.2", "texto": "y antes de irme a entrenar, trabajo, porque yo no quiero ser culturista: mi prioridad son mis negocios, mi cabeza y mi rendimiento.", "plano": "25,1–26,3 sin camiseta junto al ventanal bebiendo café → 26,3–28,3 sofá con el portátil → 28,3–29,7 camiseta gris tecleando fuera ('mis negocios') → 29,7–30,4 cocina sin camiseta ('mi cabeza') → 30,4–31,3 curl con barra Z en el gym, camiseta de tirantes ('rendimiento')"}, {"t": "31.4–36.4", "texto": "La clave no es copiar mi rutina; la clave es entender tu biología y diseñar tu mañana alrededor de tus objetivos.", "plano": "31,3–32,8 contrapicado en la terraza sin camiseta con el vaso → 32,8–34,4 bowl de açaí con granola, frutos rojos y plátano en la mano ('tu biología') → 34,4–35,3 camiseta blanca con el portátil ('diseñar') → 35,3–36,3 cocina con camiseta gris comiendo del plato ('objetivos')"}, {"t": "36.6–38.1", "texto": "Si te ha molado el vídeo, no olvides seguirme.", "plano": "Vuelve al plano del gancho: cocina sin camiseta frente a la fruta (cierre en espejo); subtítulo 'No olvides seguirme ;)'"}], "estructura": [{"bloque": "Gancho de estatus", "t": "0–4,8", "funcion": "Prueba visual (abdominales) + cifra de exclusividad (1 %) → comparación social: '¿qué hace él que yo no?'"}, {"bloque": "Promesa", "t": "4,8–6,6", "funcion": "Anuncia la lista ('esto es lo que hago cada mañana') → bucle abierto: el espectador se queda a por los pasos"}, {"bloque": "Paso 1 + porqué contraintuitivo", "t": "6,8–13,2", "funcion": "'Sin despertador' + explicación pseudo-científica → choca con lo que todos hacen (error de predicción)"}, {"bloque": "Paso 2 (agua con sal + sol)", "t": "13,3–16,5", "funcion": "Hábito raro y concreto, fácil de copiar → guardable"}, {"bloque": "Mito vs realidad", "t": "16,7–21,3", "funcion": "'Crees que estás cansado, pero en realidad…' → reencuadre que le habla al espectador (que está mirando una pantalla)"}, {"bloque": "Pasos 3–4 (ayuno ligero, café, trabajo)", "t": "21,4–31,2", "funcion": "Rompe el cliché fitness (no desayuno fuerte, no quiero ser culturista) → identidad aspiracional: joven emprendedor en forma"}, {"bloque": "Moraleja", "t": "31,4–36,4", "funcion": "'La clave no es copiar mi rutina' → desactiva críticas y da al espectador un principio aplicable"}, {"bloque": "CTA + cierre en espejo", "t": "36,6–38,6", "funcion": "Pide el follow sobre el mismo plano del inicio → sensación de círculo cerrado y bucle"}], "edicion": {"num_planos": 24, "s_por_plano": 1.6, "subtitulos": "Durante el gancho (0–4,75 s) no hay subtítulos, solo el título. Después, subtítulos de 1–2 palabras, sans blanca de peso medio (tipo Inter/SF 500), pequeños (≈40 px a 1080 de ancho), sin caja, con sombra suave, centrados a media pantalla (≈49 % de alto). Cifras con número. El último dice 'No olvides seguirme ;)'.", "texto_pantalla": "Título fijo en 2 líneas, centrado a media altura, misma letra que los subtítulos pero algo mayor, sin animación, 0–4,75 s: 'Qué hago con 22 años para / tener un físico y atención del 1%'.", "musica": "Instrumental de fondo continua, suave y cinematográfica, ≈7 dB por debajo de la voz (en las pausas −23 dB frente a −16,6 dB de media). No identificada (se puede sacar con demucs + shazamio, como en refs/voice en off/CONTEXTO.md). En el CONTEXTO de refs ya está la de otro vídeo de Diego: 'Restless' (UntitledRockBand), que encaja con este estilo.", "efectos": "Casi todo son cortes secos. Hay 3 barridos (whip pan con desenfoque de movimiento), en 2,4 · 13,0 · 21,0 s, cámara lenta en la sal (13,9–15,5) y etalonaje cinematográfico cálido y apagado (marrones y verdes, poco contraste, fondo desenfocado). Cada sustantivo tiene su plano literal: despertador, sal, café, pantalla, negocios, rendimiento. Cierra en espejo con el plano del gancho.", "voz": "Voz real de Diego, grave, tranquila y segura, sin prisa, en tono de 'te cuento lo que hago'; ≈3,9 pal/s (145 palabras en 37,5 s), casi sin pausas entre frases."}, "por_que_funciona": [{"momento": "0.0–4.6 · 'un físico y una concentración que menos del 1 % consigue' + abdominales en el frame 0", "mecanismo": "Prueba de estatus + comparación social ascendente", "explicacion": "El cuerpo se ve antes de que acabe la primera palabra, así que la promesa ya parece cumplida. El '1 %' te sitúa en el 99 %, y el cerebro quiere saber qué hace el 1 % para cerrar esa distancia. Además suena algo chulo, lo que provoca comentarios de 'flipado' que también suben el alcance."}, {"momento": "4.8–6.6 · 'Esto es lo que hago cada mañana para conseguirlo'", "mecanismo": "Bucle abierto (Zeigarnik) + promesa de lista", "explicacion": "Anuncia una lista de pasos sin decir cuántos. Hasta oír el último, la tarea se queda 'abierta' en la cabeza y retiene hasta el final. Además, una rutina de mañana se puede copiar, así que da ganas de guardarlo."}, {"momento": "6.8–13.2 · 'Me levanto sin despertador… poner una alarma te arranca de un proceso fundamental' + despertador 4:41 y cinta en la boca", "mecanismo": "Error de predicción / contradicción", "explicacion": "Casi todo el mundo usa alarma, y oír que es malo rompe lo esperado. Esa sorpresa da un pico de atención. La cinta en la boca y las 4:41 son detalles raros que el ojo detecta y que llevan a comentar ('¿qué lleva en la boca?', '¿a las 4:41 sin alarma?')."}, {"momento": "16.7–21.3 · 'Mucha gente cree que está cansada, pero en realidad empieza el día deshidratada y mirando una pantalla'", "mecanismo": "Autorreferencia + reencuadre", "explicacion": "Le habla a un cansancio que siente casi todo el que está mirando y le da una causa sencilla y que se puede arreglar, lo que alivia y se recuerda. La ironía de decir 'mirando una pantalla' a quien está mirando una pantalla hace que el espectador se vea retratado."}, {"momento": "21.4–31.2 · 'No desayuno fuerte… bastante café… yo no quiero ser culturista, mi prioridad son mis negocios'", "mecanismo": "Romper el estereotipo + identidad aspiracional", "explicacion": "Se espera el típico desayuno fitness de avena y huevos y dice lo contrario, lo que mantiene la sorpresa a mitad del vídeo, que es donde suele caer la retención. Al ponerse del lado de 'emprendedor en forma' y no de 'culturista', se gana a los jóvenes ambiciosos que no se ven como gym bros."}, {"momento": "Todo el vídeo · un plano nuevo cada ≈1,6 s que ilustra la palabra exacta (sal → pellizco de sal, café → cafetera, pantalla → portátil)", "mecanismo": "Reflejo de orientación + doble codificación", "explicacion": "Cada corte es un estímulo nuevo que reengancha la vista, y como la imagen repite lo que dice la voz, entender cuesta poco. Se procesa sin esfuerzo y no hay motivo para hacer scroll."}, {"momento": "31.4–38.6 · 'La clave no es copiar mi rutina…' + vuelta al plano de la cocina", "mecanismo": "Autonomía + cierre en espejo (bucle)", "explicacion": "Se adelanta al 'eso no vale para todos' y le da al espectador el control ('tu biología, tus objetivos'), lo que da ganas de guardar. Al volver al plano inicial, el final empalma con el principio y el vídeo se puede volver a ver en bucle sin que se note el salto."}], "caption": "", "cta": "Hablado al final: 'Si te ha molado el vídeo, no olvides seguirme.' (subtítulo 'No olvides seguirme ;)') sobre el plano del gancho.", "titulo_lucas": "Mi mañana preparando maratón + medio Ironman", "texto_pantalla_lucas": "Qué hago cada mañana para preparar un maratón y un medio Ironman a la vez", "guion_lucas": [{"texto": "Soy Lucas, tengo [tu edad] años y estoy preparando un maratón y un medio Ironman a la vez.", "plano": "GRABAR: en tu cocina por la mañana, sin camiseta o con camiseta ajustada, apoyado en la encimera con fruta delante, miras a un lado y te comes una fresa (plano medio fijo, 6 s) | recursos/running/2026-03-17_correr-amanecer-pasarela_02-lateral-silueta-con-el-sol_manga-larga-negra.MOV @ 4–6 (en 'maratón y medio Ironman')", "nota": "Seguro y tranquilo, sin prisa. El título va fijo encima y en el gancho no hay subtítulos."}, {"texto": "Esto es lo que hago cada mañana para no morir en el intento.", "plano": "recursos/gym/funcional/2025-07-02_tumbado-agotado-tras-wod_sin-camiseta.MOV @ 7–9 (tumbado en cenital riéndose)", "nota": "Primer guiño de humor: 'morir en el intento' con media sonrisa."}, {"texto": "Me levanto con despertador, sí,", "plano": "GRABAR: en la cama, plano lateral o cenital; suena la alarma del móvil y la apagas a ciegas (5 s)", "nota": "Pausa corta después de 'sí', como quien confiesa algo."}, {"texto": "porque si espero a que mi cuerpo termine sus procesos, el maratón lo corro en 2030.", "plano": "GRABAR: te incorporas en la cama despeinado (3 s) → primer plano del móvil o reloj con la hora a la que te levantas [hora] (2 s, el despertador del original)", "nota": "Es el chiste que responde a Diego: dilo serio y deja que '2030' caiga solo."}, {"texto": "Al levantarme, medio litro de agua y, si toca rodaje, a correr con el sol saliendo.", "plano": "GRABAR: primer plano del vaso llenándose en la cocina y te lo bebes (3 s) | recursos/running/2026-03-17_selfie-correr-amanecer-paseo-maritimo_manga-larga-negra.MOV @ 2–4 | recursos/running/2026-03-17_correr-amanecer-pasarela_01-pov-y-grupo-a-contraluz.MOV @ 2–4", "nota": "Confírmalo: pon solo lo que haces de verdad."}, {"texto": "Mucha gente cree que no vale para correr, pero en realidad sale a tope, sin desayunar y durmiendo cinco horas.", "plano": "recursos/running/2025-06-04_selfie-correr-pasarela-dunas-atardecer-sudando_sin-camiseta.MOV @ 5–7 (sudado, se pasa la mano por la cabeza) | recursos/gym/cardio/2026-08-11_cinta-contrapicado-desde-consola_tirantes-celeste-sudada.MOV @ 3–5 ('a tope') | GRABAR: tumbado a oscuras con la cara iluminada por el móvil (2 s, 'cinco horas')", "nota": "Énfasis en 'en realidad'. Es el reencuadre: le hablas a quien lo ve."}, {"texto": "Yo sí desayuno fuerte, o a mitad de rodaje me da un chungo.", "plano": "GRABAR: cenital de la encimera montando tu desayuno (plátano, tortitas con miel o avena) con la mano, como el bowl de Diego (5 s)", "nota": "'Yo sí' con retintín, porque contradice a los gurús del ayuno. Encaja con tu vídeo desayuna-fuerte."}, {"texto": "Luego café, bastante café,", "plano": "recursos/lifestyle/2025-06-27_cafe-chiringuito-playa_sin-camiseta.MOV @ 0–1,5 | recursos/lifestyle/2025-11-30_cafe-evento-sonriendo_medio-cremallera-azul-marino.MOV @ 1–2,5", "nota": "Rápido, con gracia en 'bastante'."}, {"texto": "y antes de entrenar, trabajo, porque no quiero ser el más grande del gimnasio: mi prioridad es llegar a meta, mi cabeza y [tu trabajo / tu proyecto].", "plano": "recursos/lifestyle/2026-09-24_andando-con-portatil-paseo-soleado_tirantes-negra.MOV @ 8–10 ('trabajo') | recursos/gym/fisico/2026-07-25_aesthetic-devant_posado-sin-camiseta-con-otro-chico.MP4 @ 2–3,5 ('el más grande del gimnasio') | recursos/competicion/2025-11-09_carrera-dorsal-29233_mordiendo-medalla_ropa-blanca.MOV @ 0–1,5 ('llegar a meta') | recursos/recuperacion/2025-11-26_ducha-spa-luz-roja_de-espaldas_sin-camiseta.MOV @ 2–3,5 ('mi cabeza')", "nota": "Un plano por elemento de la lista, como Diego. Humilde, sin presumir de físico."}, {"texto": "La clave no es copiar mi rutina; la clave es saber para qué entrenas y diseñar tu mañana alrededor de eso.", "plano": "recursos/running/2026-03-17_correr-amanecer-pasarela_02-lateral-silueta-con-el-sol_manga-larga-negra.MOV @ 9–11 | recursos/gym/cardio/2026-11-01_hibrido_cinta-de-frente.mov @ 20–21,5 ('para qué entrenas') | recursos/gym/fisico/2026-11-01_hibrido_intro-sentado-cajon-nike-strength.mov @ 13,4–14,5 (bebe agua, 'diseñar tu mañana')", "nota": "Más lento y cercano: es la moraleja."}, {"texto": "Si te ha molado, sígueme para más.", "plano": "GRABAR: el mismo plano de la cocina del gancho (sácalo de la misma toma) + rótulo SÍGUEME PARA MÁS", "nota": "Cierre en espejo con el primer plano, con una sonrisa."}], "palabras_guion_lucas": 156, "duracion_objetivo_s": 42, "viabilidad_recursos": "media", "que_grabar": ["Una sesión de 'mañana en casa' de unos 10 min con la misma ropa: cocina apoyado en la encimera con fruta (gancho y cierre, 10 s)", "Alarma del móvil sonando y la apagas en la cama (5 s) + te incorporas despeinado (3 s) + primer plano de la hora (2 s)", "Vaso de agua llenándose y bebiendo (3 s)", "Tumbado a oscuras con la cara iluminada por el móvil (2 s)", "Cenital del desayuno montándolo con la mano (5 s)"], "stock": [], "notas_edit": "Calcar a Diego: título fijo en 2 líneas en el centro 0–4,8 s sin subtítulos; después, subtítulos palabra a palabra con el estilo de Lucas (preferencias.md). Plano nuevo cada 1,3–2 s y cada corte ilustra la palabra (alarma, agua, sol, café, meta). Mete 2–3 barridos con desenfoque en los saltos de sitio (casa → calle, calle → casa) y la cámara lenta en el vaso de agua. Etalonaje cálido y apagado para los planos de casa; los de amanecer ya son cálidos y casan. Música instrumental cinematográfica continua a −7/−8 dB de la voz ('Restless' de recursos/sonidos sirve). Cierra con el mismo plano de la cocina del gancho y el rótulo SÍGUEME PARA MÁS + @lucasalvarez.x. Duración de 37–40 s."}, {"id": "DcO3-gqATJW", "creador": "gerardfelipx", "seguidores": 179000, "visitas": 367000, "likes": 12331, "comentarios": 380, "duracion_s": 26.5, "url": "https://www.instagram.com/reel/DcO3-gqATJW/", "formato": "Confesión generacional ('soy raro para mi edad') + día a día de entreno en solitario", "resumen": "Gerard (21 años) se confiesa 'raro' porque prefiere entrenar a salir de fiesta y enseña su día: trabaja, estudia, crea contenido y se va 2 h a la bici estática. Lo distinto: convierte la etiqueta negativa en orgullo y cierra con una frase-mantra ('prefiero eso a perderme una vida que no me llene').", "gancho_voz": "Soy raro para mi edad.", "gancho_texto_pantalla": null, "gancho_visual": "Terraza con jardín y una palmera en primer plano. Gerard sin camiseta, de espaldas y apoyado en la barandilla, se gira hacia la cámara (0–1,2 s) y camina de frente enseñando el torso (1,2–2,2 s). El subtítulo se apila en vertical palabra a palabra en el centro: 'soy / raro / para / mi / edad'.", "guion_original": [{"t": "0.0–1.1", "texto": "Soy raro para mi edad.", "plano": "Terraza con jardín, sin camiseta, de espaldas apoyado en la barandilla, se gira a cámara; subtítulo apilado"}, {"t": "1.2–4.8", "texto": "Tengo 21 años y prefiero entrenar antes que salir de fiesta cada fin de semana.", "plano": "1,2–2,2 de frente caminando sin camiseta ('21 años') → 2,2–4,9 cocina de espaldas preparando el batido y bebiendo del shaker"}, {"t": "4.9–10.3", "texto": "Trabajo 8 horas al día y cuando salgo aún tengo que estudiar, crear contenido y hacer uno o dos entrenos al día.", "plano": "4,9–5,95 abre el armario alto de los bidones (picado) → 5,95–6,6 sube las escaleras con un bidón → 6,6–8,85 en su cuarto se cambia y se pone el culotte de ciclismo → 8,85–9,2 primer plano con la mochila → 9,2–10,1 sale por la puerta con la mochila"}, {"t": "10.5–14.7", "texto": "Hoy me tocan 2 horas de estática y lo
