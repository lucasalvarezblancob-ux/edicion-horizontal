 que para muchos sería un plan aburrido, para mí es lo contrario.", "plano": "10,1–11,3 camina por la calle de espaldas con la mochila Nike → 11,3–12,35 sentado en el suelo del gym poniéndose las zapatillas → 12,35–15,35 se sube a la bici estática, sala con vinilo azul turquesa"}, {"t": "15.0–19.0", "texto": "Y es que sí, me gusta pasar tiempo solo, hablar en voz alta y sentir que avanzo hacia donde quiero.", "plano": "15,35–16,4 cenital POV del manillar y las piernas → 16,4–17,5 plano abierto sin camiseta pedaleando → 17,5–19,9 más cerca, sin camiseta y echado sobre el manillar, de lado"}, {"t": "19.4–22.9", "texto": "Quizá no encajo en muchos sitios, quizá pienses que me estoy perdiendo algunas cosas,", "plano": "19,9–21,1 plano abierto de la sala → 21,1–26,5 plano oscuro y teal a contraluz de la ventana, cansado y apoyado en el manillar"}, {"t": "23.1–26.1", "texto": "pero, sinceramente, prefiero eso a perderme una vida que no me llene.", "plano": "Mismo plano oscuro (el único largo, 5 s); al final se incorpora y sale de plano"}], "estructura": [{"bloque": "Gancho-etiqueta", "t": "0–1,1", "funcion": "Se pone una etiqueta negativa ('raro') que en realidad presume → curiosidad + '¿yo también soy raro?'"}, {"bloque": "Confesión generacional", "t": "1,2–4,8", "funcion": "Edad concreta + elección contra la norma (gym > fiesta) → los que no salen se sienten validados y los que sí salen se pican"}, {"bloque": "Carga del día (lista rápida)", "t": "4,9–10,3", "funcion": "Enumera obligaciones con un plano por acción → prueba de esfuerzo, credibilidad y ritmo"}, {"bloque": "Inversión", "t": "10,5–14,7", "funcion": "'Lo que para muchos sería aburrido, para mí es lo contrario' → cambia el valor de lo esperado"}, {"bloque": "Por qué (vulnerabilidad)", "t": "15,0–19,0", "funcion": "Confiesa que le gusta estar solo y hablar en voz alta → cercanía e identificación"}, {"bloque": "Objeción + mantra", "t": "19,4–26,1", "funcion": "Pone en boca del espectador la crítica ('quizá pienses…') y la cierra con una frase redonda para compartir"}], "edicion": {"num_planos": 15, "s_por_plano": 1.77, "subtitulos": "Palabra a palabra, sans bold blanca (tipo Montserrat 700), pequeña, centrada a ≈45 % de alto, sin caja ni color. En el gancho las palabras se apilan en vertical, una debajo de otra ('soy / raro / para / mi / edad'), hasta formar la frase; después sale una sola palabra cada vez.", "texto_pantalla": "No hay título aparte: el gancho es el propio subtítulo apilado.", "musica": "Instrumental emotiva y ambiental de fondo, continua, ≈7–8 dB por debajo de la voz (pausa final −24 dB frente a −16,6 dB de media). No identificada.", "efectos": "Solo cortes secos, sin transiciones ni zooms. Planos de iPhone a pulso o apoyados, con look de vlog real. Casa en tonos cálidos y gym frío y teal (vinilo azul turquesa); el último plano, oscuro y largo (21,1–26,5), baja la energía para que la frase final pese.", "voz": "Voz real, tranquila e íntima, algo seria, como una confesión; ≈4,1 pal/s (108 palabras en 26 s), sin pausas largas."}, "por_que_funciona": [{"momento": "0.0–1.1 · 'Soy raro para mi edad' + torso de espaldas que se gira", "mecanismo": "Etiqueta paradójica + autorreferencia", "explicacion": "'Raro' suena a defecto, pero se intuye que es presumir (va sin camiseta). La contradicción abre una pregunta ('¿raro por qué?') y el espectador se compara al momento ('¿yo soy raro?'). El subtítulo que se apila palabra a palabra obliga a leer hasta completar la frase."}, {"momento": "1.2–4.8 · 'Tengo 21 años y prefiero entrenar antes que salir de fiesta'", "mecanismo": "Identidad de grupo + polarización suave", "explicacion": "Valida a quien no sale ('no soy el único') y pica a quien sí sale. La edad concreta dispara comentarios ('¿21 qué?, pareces de 35', 'raro? eso lo hacemos todos'): 380 comentarios con 12 k likes, mucha conversación para un vídeo tan corto."}, {"momento": "4.9–10.3 · '8 horas… estudiar, crear contenido y uno o dos entrenos' con 5 planos en 5,4 s", "mecanismo": "Especificidad + reflejo de orientación", "explicacion": "Las cifras concretas (8 h, 1–2 entrenos) dan credibilidad y respeto porque el esfuerzo se ve. Los cortes a ≈1 s en este tramo meten novedad visual justo donde un vídeo suele perder gente (s 5–10)."}, {"momento": "10.5–14.7 · 'lo que para muchos sería un plan aburrido, para mí es lo contrario'", "mecanismo": "Error de predicción / inversión de valor", "explicacion": "Dos horas de bici estática solo suena a castigo, y presentarlo como premio rompe lo esperado y empuja a tomar partido ('yo tampoco lo aguanto' o 'a mí también me encanta')."}, {"momento": "15.0–19.0 · 'me gusta pasar tiempo solo, hablar en voz alta'", "mecanismo": "Vulnerabilidad auténtica (confianza)", "explicacion": "Admitir algo un poco ridículo, como hablar solo, humaniza a alguien con físico de modelo. Baja la distancia de estatus y crea complicidad ('yo también hablo solo')."}, {"momento": "19.4–22.9 · 'quizá pienses que me estoy perdiendo algunas cosas'", "mecanismo": "Anticiparse a la objeción (segunda persona)", "explicacion": "Pone en voz alta lo que el espectador está pensando, y la sensación de que te 'leen la mente' engancha y desarma la crítica antes de que llegue a los comentarios."}, {"momento": "23.1–26.5 · 'prefiero eso a perderme una vida que no me llene' sobre el único plano largo y oscuro", "mecanismo": "Frase-mantra con resolución (recompensa final)", "explicacion": "El juego 'perdiendo cosas / perderme una vida' cierra el bucle del gancho ('raro') con una conclusión que se puede citar. El plano quieto deja que la frase se asiente. Es el tipo de frase que se guarda o se manda a alguien, y la caption 'soy raro?' remata pidiendo opinión."}], "caption": "soy raro?\n\n#superacion #deporte #mentalidad #fitness #entrenamiento", "cta": "Sin CTA hablado. La caption es una pregunta ('soy raro?') que invita a comentar.", "titulo_lucas": "Soy raro para mi edad", "texto_pantalla_lucas": "Sin título aparte: subtítulo apilado en vertical 'soy / raro / para / mi / edad' (como el original). Caption: '¿soy raro?'", "guion_lucas": [{"texto": "Soy raro para mi edad.", "plano": "recursos/gym/fisico/2026-07-31_quitarse-camiseta-reveal-fisico_gym-neon-azul_tirantes-gris.MP4 @ 2,5–4,5 (de espaldas acabando de quitarse la camiseta y girándose)", "nota": "Seco y tranquilo, sin sonreír. Subtítulo apilado palabra a palabra."}, {"texto": "Tengo [tu edad] años y prefiero un rodaje a las siete de la mañana antes que salir de fiesta el sábado.", "plano": "recursos/gym/fisico/2026-07-31_quitarse-camiseta-reveal-fisico_gym-neon-azul_tirantes-gris.MP4 @ 4,5–6 (de frente sin camiseta, '[edad] años') | recursos/running/2026-03-17_selfie-correr-amanecer-paseo-maritimo_manga-larga-negra.MOV @ 2–4 ('a las siete de la mañana')", "nota": "Ajusta la hora a la de verdad."}, {"texto": "Trabajo [horas] al día y cuando salgo aún tengo que crear contenido, entrenar y meter kilómetros, porque estoy preparando un maratón y un medio Ironman.", "plano": "recursos/lifestyle/2026-09-24_andando-con-portatil-paseo-soleado_tirantes-negra.MOV @ 8–9,5 ('trabajo') | GRABAR: pones el móvil en el trípode y le das a grabar (2 s, 'crear contenido') | recursos/gym/espalda/2026-11-01_jalon-agarre-estrecho_sudadera-y-sin-camiseta.MOV @ 22–23 ('entrenar') | recursos/running/2026-10-18_correr-calle-ladrillo_espaldas-y-lado_manga-larga-negra.MOV @ 2–3,5 ('kilómetros') | recursos/competicion/2025-11-09_carrera-dorsal-29233_pov-pies-y-dorsal_ropa-blanca.MOV @ 4–5 ('maratón') | GRABAR: 2–3 s nadando en la piscina o en la bici ('medio Ironman')", "nota": "Lista rápida con un plano por cosa (≈1 s cada uno), como Gerard."}, {"texto": "Hoy me tocan [dos horas] de tirada larga, y lo que para muchos sería un plan aburrido, para mí es lo mejor de la semana.", "plano": "recursos/gym/fisico/2026-11-01_hibrido_intro-sentado-cajon-nike-strength.mov @ 5,6–7,5 (se ata las zapatillas, como Gerard en el suelo) | recursos/running/2025-10-20_correr-carril-dunas-atardecer_01-espaldas_camiseta-gris-pantalon-oliva.MOV @ 2–5 (sale corriendo de espaldas)", "nota": "Sonrisa ligera en 'lo mejor de la semana'."}, {"texto": "Y es que sí, me gusta pasar tiempo solo, hablar en voz alta y sentir que avanzo hacia donde quiero.", "plano": "recursos/running/2025-07-09_pov-abdomen-caminando-camino-pinos_pantalon-oliva.MOV @ 0–1,5 (POV, calca el cenital del manillar) | recursos/running/2025-06-04_selfie-correr-pasarela-dunas-atardecer-sudando_sin-camiseta.MOV @ 8–10 (hablando mientras corre: 'hablar en voz alta') | recursos/running/2025-10-20_correr-carril-dunas-atardecer_03-lateral-cerca-mar_camiseta-gris-pantalon-oliva.MOV @ 0–2,5 ('avanzo')", "nota": "Más íntimo. 'Y es que sí' con medio encogimiento de hombros."}, {"texto": "Quizá no encajo en muchos sitios, quizá pienses que me estoy perdiendo cosas,", "plano": "recursos/running/2025-10-20_correr-carril-dunas-atardecer_02-espaldas-y-lateral_camiseta-gris-pantalon-oliva.MOV @ 3–7 (de espaldas con el atardecer)", "nota": "Mirando al espectador: el 'pienses' es para él."}, {"texto": "pero, sinceramente, prefiero eso a perderme una vida que no me llene.", "plano": "recursos/running/2026-03-17_correr-amanecer-pasarela_02-lateral-silueta-con-el-sol_manga-larga-negra.MOV @ 12–16 (silueta con el sol; plano largo final como el de Gerard)", "nota": "Pausa después de 'sinceramente'. Baja el tono al final."}], "palabras_guion_lucas": 119, "duracion_objetivo_s": 32, "viabilidad_recursos": "alta", "que_grabar": ["Poner el móvil en el trípode y darle a grabar (2 s)", "2–3 s nadando o en la bici para el 'medio Ironman' (no hay ni bici ni piscina en recursos)"], "stock": ["Solo si no puede grabarlo: 'triathlete swimming pool' / 'road cyclist sunrise' en Pexels para el 'medio Ironman'"], "notas_edit": "Calcar el look de vlog real: cortes secos, sin transiciones ni zooms, iPhone a pulso. Gancho con el subtítulo apilado en vertical palabra a palabra en el centro ('soy / raro / para / mi / edad') y después palabra a palabra con el estilo de Lucas. El tramo de la lista (frase 3) va a ≈1 s por plano; luego se frena a 1,5–2 s y el último plano dura ≈4–5 s quieto. Mantén un solo outfit en el bloque de 'hoy' (las 3 tomas de dunas al atardecer del 2025-10-20 casan entre sí). Música instrumental emotiva y ambiental a −7/−8 dB de la voz. Sin CTA hablado: tras la última frase, 2 s más del plano final con el rótulo SÍGUEME PARA MÁS + @, y caption en pregunta ('¿soy raro?') para provocar comentarios. 25–28 s."}, {"id": "Dc9SvZzA6y6", "creador": "gerardfelipx", "seguidores": 179000, "visitas": 340000, "likes": 13058, "comentarios": 245, "duracion_s": 44.0, "url": "https://www.instagram.com/reel/Dc9SvZzA6y6/", "formato": "Reflexión vulnerable sobre la soledad (antes/después) con b-roll de su día", "resumen": "Gerard cuenta que antes se sentía solo los domingos, que llenarse de planes no lo arreglaba y que aprendió a estar solo; hoy entrena horas solo y es feliz. Lo distinto: distinción 'estar acompañado ≠ sentirte acompañado' y un final con la bici vacía sobre 'llenar ese vacío'.", "gancho_voz": "Cada vez me gusta más estar solo.", "gancho_texto_pantalla": null, "gancho_visual": "Habitación con luz cálida y cuadros en la pared. Gerard sin camiseta, tumbado boca abajo en la cama mirando el móvil, plano fijo lateral (0–1,75 s). El subtítulo se va construyendo en una línea: 'cada' → 'cada vez' → 'cada vez me gusta' → 'cada vez me gusta más' → 'estar solo'.", "guion_original": [{"t": "0.1–1.6", "texto": "Cada vez me gusta más estar solo.", "plano": "Tumbado boca abajo en la cama con el móvil, sin camiseta, plano fijo lateral; subtítulo acumulativo"}, {"t": "1.9–5.7", "texto": "Antes, cuando llegaba el domingo por la tarde y no tenía ningún plan, me sentía muy solo.", "plano": "1,75–3,65 ducha: de espaldas y luego de frente lavándose el pelo → 3,65–5,95 de espaldas en calzoncillos abriendo el armario y eligiendo ropa"}, {"t": "6.0–10.9", "texto": "Intenté llenarme los fines de semana para que no llegara ese momento, pero con una tirita no se sana una herida.", "plano": "5,95–6,65 sube la escalera → 6,65–8,7 cocina de espaldas, abre la nevera y bebe de una botella ('llenarme') → 8,7–10,1 su mano coloca un mantel individual y un bol en la mesa de cristal ('tirita') → 10,1–11,3 sentado en el sofá comiendo, cabizbajo ('herida')"}, {"t": "11.2–14.4", "texto": "Rodeado de amigos, planes los findes, y me sentía más solo que nunca.", "plano": "11,3–12,1 su mano coge un plátano de la cesta → 12,1–13,1 estantería de suplementos (creatina, sales), coge un bote → 13,1–14,6 coge el termo negro Gymshark"}, {"t": "14.8–19.7", "texto": "Y ahí está el problema: solemos pensar que estar acompañado significa sentirte acompañado, pero no es lo mismo.", "plano": "14,6–15,7 sube la escalera con el termo → 15,7–19,0 calle soleada con árboles; plano fijo largo, se aleja solo de espaldas con la mochila → 19,0–20,7 en el suelo del gym poniéndose las zapatillas"}, {"t": "20.0–23.6", "texto": "Así que me aparté. Me aparté porque con tanto ruido nunca me había parado a escuchar.", "plano": "20,7–24,6 se sube a la bici estática de espaldas, sala oscura teal con ventanal (cambio de color: de casa cálida a gym frío)"}, {"t": "24.0–26.6", "texto": "Aprendí que estar solo no es que sea positivo, es que es necesario.", "plano": "24,6–27,3 pedaleando a contraluz, se quita la camiseta"}, {"t": "27.2–31.1", "texto": "Hoy puedo estar horas y horas entrenando solo, hablando o haciendo el gilipollas.", "plano": "27,3–29,5 POV cenital del manillar con la pantalla → 29,5–30,6 lateral sin camiseta → 30,6–31,85 de espaldas mirando por encima del hombro con media sonrisa (subtítulo censurado 'gilip*llas')"}, {"t": "31.8–37.9", "texto": "Y no digo que no sea importante conectar con personas; de hecho, creo que el amor es lo que nos mueve y las relaciones humanas, lo que nos distingue.", "plano": "31,85–33,25 lateral pedaleando → 33,25–38,3 plano cerrado lateral pedaleando con fuerza, sudado"}, {"t": "38.3–43.4", "texto": "Pero, de alguna forma, si no sabes estar bien contigo, siempre vas a necesitar a alguien para llenar ese vacío.", "plano": "38,3–39 primer plano de la cara → plano abierto teal: se levanta, de espaldas, y sale de cuadro → 42,5–44 la bici vacía en 'llenar ese vacío'"}], "estructura": [{"bloque": "Gancho contraintuitivo", "t": "0–1,6", "funcion": "La soledad, que suele doler, presentada como algo que gusta → sorpresa + '¿cómo se llega ahí?'"}, {"bloque": "Antes (herida)", "t": "1,9–10,9", "funcion": "Escena universal y concreta (domingo por la tarde) + metáfora de la tirita → reconocimiento ('a mí me pasa')"}, {"bloque": "Paradoja", "t": "11,2–14,4", "funcion": "Rodeado de amigos y más solo que nunca → disonancia e identificación profunda"}, {"bloque": "Insight", "t": "14,8–19,7", "funcion": "'Estar acompañado no es sentirte acompañado' → el 'ajá' que se guarda y se comparte"}, {"bloque": "Giro / decisión", "t": "20,0–26,6", "funcion": "'Me aparté' + 'estar solo es necesario'; cambio de color de casa a gym = cambio de etapa"}, {"bloque": "Después (hoy) + humor", "t": "27,2–31,1", "funcion": "Muestra el resultado con autoironía ('haciendo el gilip*llas') → alivio y cercanía"}, {"bloque": "Matiz + cierre", "t": "31,8–44,0", "funcion": "Se adelanta al 'eres un antisocial' y cierra con la moraleja y la bici vacía"}], "edicion": {"num_planos": 21, "s_por_plano": 2.1, "subtitulos": "Palabra a palabra, sans bold blanca (tipo Montserrat 700), pequeña, centrada a ≈42–50 % de alto, sin caja. La primera frase se va acumulando en una línea ('cada' → 'cada vez' → 'cada vez me gusta más') y luego sale una palabra cada vez. Palabrota censurada con asterisco ('gilip*llas').", "texto_pantalla": "No hay título aparte: el gancho es el subtítulo acumulativo.", "musica": "Instrumental emotiva suave de fondo, continua, ≈6–7 dB por debajo de la voz (pausas −19/−23 dB frente a −16,8 dB de media). No identificada.", "efectos": "Solo cortes secos, iPhone a pulso o apoyado, look de vlog. La primera mitad (casa) es cálida y la segunda (gym) fría y teal y oscura: el cambio de color coincide con 'Así que me aparté' (20,7 s). Un plano largo en la calle (3,3 s) en el insight y final literal con la bici vacía en 'ese vacío'.", "voz": "Voz real, pausada, íntima y reflexiva, tono de confesión; ≈3,9 pal/s (168 palabras en 43 s)."}, "por_que_funciona": [{"momento": "0.1–1.6 · 'Cada vez me gusta más estar solo' + tumbado solo en la cama", "mecanismo": "Error de predicción + tema universal", "explicacion": "La soledad se asocia a algo malo y decir que gusta rompe lo esperado. Además casi todo el mundo se ha sentido solo, así que el espectador se ve dentro desde la primera frase. El subtítulo que se va construyendo obliga a leer hasta el final."}, {"momento": "1.9–5.7 · 'cuando llegaba el domingo por la tarde y no tenía ningún plan'", "mecanismo": "Reconocimiento episódico + vulnerabilidad", "explicacion": "Es un momento muy concreto que casi todos han vivido (el bajón del domingo). El cerebro recupera ese recuerdo propio y lo pega al vídeo. Confesarlo da confianza y vuelve creíble lo que viene."}, {"momento": "8.7–10.9 · 'con una tirita no se sana una herida'", "mecanismo": "Metáfora concreta (memorable)", "explicacion": "Una imagen física (tirita/herida) resume una idea abstracta (taparlo con planes). Se entiende al momento, se recuerda y se puede repetir."}, {"momento": "11.2–14.4 · 'Rodeado de amigos, planes los findes, y me sentía más solo que nunca'", "mecanismo": "Paradoja / disonancia + identificación", "explicacion": "Contradice la solución obvia (salir más) y valida a quien se siente solo aunque tenga gente. De aquí salen los comentarios 'me pasa lo mismo'."}, {"momento": "14.8–19.7 · 'estar acompañado no significa sentirte acompañado' sobre el plano largo de la calle", "mecanismo": "Insight ('ajá') = recompensa", "explicacion": "Pone nombre a algo que el espectador sentía y no sabía decir, y ese momento de entender premia y da ganas de guardar o mandar. El plano quieto de 3,3 s deja tiempo para procesarlo."}, {"momento": "27.2–31.1 · 'hablando o haciendo el gilip*llas' (censurado)", "mecanismo": "Humor / ruptura de tono", "explicacion": "Tras 25 s serios, la autoironía da alivio y lo humaniza. La palabra censurada con asterisco llama la vista y suelta una sonrisa, así que el espectador no se va por saturación emocional."}, {"momento": "31.8–44.0 · 'no digo que no sea importante conectar…' → 'si no sabes estar bien contigo…' + bici vacía", "mecanismo": "Anticiparse a la objeción + cierre visual literal", "explicacion": "El matiz desactiva la crítica ('antisocial') y amplía el público. La moraleja final coincide con la bici vacía en 'ese vacío', y esa rima entre imagen y palabra fija la idea. La caption 'haz un plan solo <3' lo convierte en reto."}], "caption": "haz un plan solo <3\n\n#soledad #deporte #inspiracion #mentalidad", "cta": "Sin CTA hablado. La caption es una invitación a la acción ('haz un plan solo <3').", "titulo_lucas": "Cada vez me gusta más estar solo", "texto_pantalla_lucas": "Sin título aparte: subtítulo acumulativo 'cada vez me gusta más estar solo'. Caption: 'haz un plan solo esta semana <3'", "guion_lucas": [{"texto": "Cada vez me gusta más estar solo.", "plano": "GRABAR: tumbado boca abajo en tu cama mirando el móvil, sin camiseta, plano fijo lateral desde la puerta (5 s)", "nota": "Tranquilo, casi en voz baja. Subtítulo acumulativo."}, {"texto": "Antes, cuando llegaba [el domingo por la tarde] y no tenía ningún plan, me sentía muy solo.", "plano": "recursos/recuperacion/2025-11-26_ducha-spa-luz-roja_de-espaldas_sin-camiseta.MOV @ 0–2,5 (ducha de espaldas, como el original) | GRABAR: de espaldas abriendo el armario y mirando la ropa (2,5 s)", "nota": "Solo si es tu historia. Si no, cambia el momento por el tuyo de verdad."}, {"texto": "Intenté llenarme los fines de semana de planes para que no llegara ese momento, pero con una tirita no se sana una herida.", "plano": "recursos/lifestyle/2025-05-10_coche-amigos-selfie-risas_manga-larga-negra.MOV @ 5–7 ('llenarme de planes') | recursos/lifestyle/2026-07-02_festival-hamburguesas_03-mordisco-a-doble-mano_camiseta-gris.mov @ 9–10,5 | GRABAR: primer plano poniéndote una tirita en el dedo (2 s, 'tirita')", "nota": "Pausa breve antes de 'pero con una tirita'."}, {"texto": "Rodeado de amigos, planes todos los findes, y me sentía más solo que nunca.", "plano": "recursos/running/2026-03-14_run-club-lluvia_10-brindis-amigos-sala-amarilla_sin-camiseta.MOV @ 0–1,5 | recursos/lifestyle/2026-07-02_festival-hamburguesas_02-probando-y-puntuando_camiseta-gris.mov @ 16–17,5 | recursos/running/2026-03-14_run-club-lluvia_12-toalla-lata-doble-biceps-barra-evento_sin-camiseta.MOV @ 2–3,5 (toalla en la cabeza, mirada perdida: 'más solo que nunca')", "nota": "Contraste: planos de fiesta con la voz seria."}, {"texto": "Y ahí está el problema: solemos pensar que estar acompañado significa sentirte acompañado, pero no es lo mismo.", "plano": "recursos/running/2026-03-17_correr-amanecer-pasarela_01-pov-y-grupo-a-contraluz.MOV @ 2–4 ('acompañado') | recursos/running/2026-10-18_correr-calle-ladrillo_espaldas-y-lado_manga-larga-negra.MOV @ 0–3,5 (se aleja solo de espaldas: plano largo como la calle del original)", "nota": "Más despacio. Es la frase que la gente guarda."}, {"texto": "Así que me aparté. Me aparté porque con tanto ruido nunca me había parado a escucharme.", "plano": "recursos/gym/fisico/2026-11-01_hibrido_intro-sentado-cajon-nike-strength.mov @ 5,6–8 (se ata las zapatillas, como Gerard en el suelo) | recursos/gym/fisico/2026-11-01_hibrido_intro-sentado-cajon-nike-strength.mov @ 8,5–10 (sentado en silencio, pared negra)", "nota": "Repite 'me aparté' bajando el tono. Aquí empieza el cambio de color: de cálido a frío y oscuro."}, {"texto": "Aprendí que estar solo no es que sea positivo, es que es necesario.", "plano": "recursos/running/2025-10-20_correr-carril-dunas-atardecer_01-espaldas_camiseta-gris-pantalon-oliva.MOV @ 2–5 (corre solo de espaldas al atardecer)", "nota": "Énfasis en 'necesario'."}, {"texto": "Hoy puedo pasarme horas y horas entrenando solo para el medio Ironman, hablando solo o haciendo el gilipollas.", "plano": "recursos/running/2025-07-09_pov-abdomen-caminando-camino-pinos_pantalon-oliva.MOV @ 0–2 (POV, como el cenital del manillar) | recursos/running/2025-06-04_selfie-correr-pasarela-dunas-atardecer-sudando_sin-camiseta.MOV @ 8–10 ('hablando solo') | recursos/lifestyle/sin-fecha_golf-swing-campo-practicas_ropa-negra.mp4 @ 9–11 (baila y se ríe: 'haciendo el gilipollas')", "nota": "Sonrisa: es el respiro de humor. En el subtítulo, 'gilip*llas'."}, {"texto": "Y no digo que no sea importante conectar con personas; de hecho, creo que el amor es lo que nos mueve y las relaciones humanas, lo que nos distingue.", "plano": "recursos/competicion/2025-07-05_deka-zaragoza_abrazo-meta_pantalon-oliva.MOV @ 0,5–3,5 (abrazo en meta: 'conectar') | recursos/running/2026-03-14_run-club-lluvia_09-celebracion-brazos-arriba_sin-camiseta.MOV @ 1–3,5 ('relaciones humanas')", "nota": "Cálido, sin sermón."}, {"texto": "Pero, de alguna forma, si no sabes estar bien contigo, siempre vas a necesitar a alguien para llenar ese vacío.", "plano": "recursos/running/2026-03-17_correr-amanecer-pasarela_02-lateral-silueta-con-el-sol_manga-larga-negra.MOV @ 10–14 (silueta con el sol) | GRABAR: plano fijo de un camino o pasarela vacía; entras corriendo, sales de cuadro y se queda vacío 2 s en 'ese vacío' (si no: recursos/running/2024-12-11_selfie-pasarela-dunas-nublado_sudadera-asics-azul-marino.MOV @ 2,5–4,9, paisaje de dunas sin nadie)", "nota": "Baja el ritmo. 'Ese vacío' con el plano vacío a la vez."}], "palabras_guion_lucas": 171, "duracion_objetivo_s": 47, "viabilidad_recursos": "alta", "que_grabar": ["Tumbado boca abajo en la cama con el móvil, plano fijo lateral (5 s)", "De espaldas abriendo el armario (3 s)", "Primer plano poniéndote una tirita (2 s)", "Plano fijo de un camino o pasarela: entras corriendo, sales de cuadro y se queda vacío (5 s)"], "stock": [], "notas_edit": "Calcar la estructura en dos colores: primera mitad (antes, frases 1–5) con planos cálidos de casa y planes con amigos; desde 'Así que me aparté' (≈20 s), planos fríos y oscuros (gym negro + amaneceres/atardeceres en silueta), y si hace falta se baja la saturación para marcar el cambio. Cortes secos, sin transiciones; plano nuevo cada ≈2 s, con un plano largo (3–4 s) en la frase del insight y otro al final. Subtítulo acumulativo en la primera frase y después palabra a palabra con el estilo de Lucas; censura 'gilip*llas'. Música instrumental emotiva suave a −7 dB de la voz durante todo el vídeo. Final: plano vacío en 'ese vacío' + 2 s con el rótulo SÍGUEME PARA MÁS + @. Caption en reto ('haz un plan solo esta semana <3'). 42–46 s."}, {"id": "De3UyxYOVZv", "creador": "danielgmzs", "seguidores": 121000, "visitas": 317000, "likes": 37264, "comentarios": 277, "duracion_s": 28.1, "url": "https://www.instagram.com/reel/De3UyxYOVZv/", "formato": "Test '¿Qué es más pesado de cargar? A/B/C' → arrepentimiento en plano nocturno → chiste de la letra D", "resumen": "Juega con el doble sentido de 'cargar': maleta, cesta de ropa… y la C es 'el peso de saber que tenías el potencial y el tiempo' y lo dejaste para mañana. Encapuchado inmóvil en una calle de noche que al final echa a andar hacia la cámara; remate 'Letra D: todo el súper de una vuelta' con Pudzianowski cargando bolsas.", "gancho_voz": "¿Qué crees que sea más pesado de cargar?", "gancho_texto_pantalla": "QUE CREES QUE SEA MÁS PESADO DE CARGAR?", "gancho_visual": "Selfie a cámara en su cuarto (pared blanca, techo abuhardillado, rifle y sombreros colgados), gorra verde y forro polar negro, sujetando el estuche de los AirPods; sonríe mucho. Texto blanco con contorno negro en el centro, a la altura de la boca.", "guion_original": [{"t": "0.0–1.6", "texto": "¿Qué crees que sea más pesado de cargar?", "plano": "A cámara en el cuarto; texto centrado 'QUE CREES QUE SEA MÁS PESADO DE CARGAR?'."}, {"t": "1.6–3.1", "texto": "Letra A, una maleta.", "plano": "'A:' gigante en cursiva blanca con contorno negro sobre el pecho (1,5–2,25) → foto grande de una maleta marrón que le tapa la cara (2,3–3,0)."}, {"t": "3.1–4.7", "texto": "Letra B, una canasta llena de ropa.", "plano": "'B:' gigante (3,0–3,55) → foto de un cesto verde de la ropa desbordado tapándole la cara (3,6–4,6)."}, {"t": "4.7–5.2", "texto": "Letra C:", "plano": "'C:' gigante, sin foto; sonrisa amplia. Corte seco a 5,22."}, {"t": "5.2–8.9", "texto": "Cargar con el peso de saber que tenías el potencial para lograrlo todo, y también tenías el tiempo,", "plano": "Plano nocturno fijo: calle estrecha con cables, farolas y fachadas verdosas/ámbar, coche aparcado; figura encapuchada de negro, de frente, con la cara en sombra, quieta en mitad de la calle."}, {"t": "8.9–11.2", "texto": "pero viviste como si ambas cosas fueran a estar ahí para siempre.", "plano": "Mismo plano nocturno."}, {"t": "11.2–15.4", "texto": "Seguías diciéndote a ti mismo: «después lo hago, todavía tengo tiempo», como si el mañana estuviera garantizado.", "plano": "Mismo plano nocturno."}, {"t": "15.4–17.4", "texto": "Y ahora estás viviendo ese futuro del que tanto temías,", "plano": "Mismo plano nocturno."}, {"t": "17.4–21.5", "texto": "dándote cuenta de que la persona en la que pudiste haberte convertido no desapareció de la noche a la mañana.", "plano": "Mismo plano nocturno."}, {"t": "21.5–26.4", "texto": "La fuiste perdiendo poco a poco, cada vez que elegiste la comodidad y la escondiste llamando a la paciencia.", "plano": "Mismo plano; en ~24,6 ('y la escondiste') la figura echa a andar hacia la cámara. Corte seco a 26,53."}, {"t": "26.4–28.1", "texto": "Letra D: todo el súper de una vuelta.", "plano": "Vuelta al cuarto, 'D:' gigante → foto del strongman Pudzianowski cargando bolsas de la compra (26,8–28,1). Fin."}], "estructura": [{"bloque": "Pregunta-test", "t": "0–1.6", "funcion": "Invita a jugar; 'cargar' ya prepara el doble sentido físico/emocional."}, {"bloque": "Opciones trampa A/B", "t": "1.6–4.7", "funcion": "Objetos domésticos y fotos enormes que le tapan la cara: humor visual, guardia baja."}, {"bloque": "Giro C + corte", "t": "4.7–5.2", "funcion": "'Letra C' sin foto y salto a la calle nocturna: rompe la predicción."}, {"bloque": "El peso", "t": "5.2–11.2", "funcion": "Define la carga: potencial + tiempo desaprovechados (miedo al arrepentimiento)."}, {"bloque": "La voz interior", "t": "11.2–15.4", "funcion": "Cita literal de lo que el espectador se dice ('después lo hago'): autorreferencia directa."}, {"bloque": "El futuro ya llegó", "t": "15.4–21.5", "funcion": "Viaje en el tiempo: 'ese futuro del que tanto temías' es hoy → urgencia."}, {"bloque": "Desenmascarar la excusa", "t": "21.5–26.4", "funcion": "Reencuadre que pica: tu 'paciencia' era comodidad. La figura avanza hacia ti."}, {"bloque": "Remate cómico D", "t": "26.4–28.1", "funcion": "Chiste universal (subir toda la compra de un viaje) que descarga y provoca comentarios."}], "edicion": {"num_planos": 3, "s_por_plano": 9.4, "subtitulos": "Solo en la voz en off: palabra a palabra, minúsculas, serif gruesa tipo DM Serif/Playfair, blanca con sombra suave, a ~69 % de alto. En la intro no hay subtítulos de palabra: solo el texto de la pregunta y las letras gigantes.", "texto_pantalla": "Pregunta 0–1,5 s centrada a la altura de la boca (sans gruesa blanca con contorno negro, tipo TikTok, 3 líneas). Letras 'A:' 'B:' 'C:' 'D:' gigantes en cursiva muy gruesa blanca con contorno negro sobre el pecho (~40 % del ancho). Las fotos (maleta, cesto, Pudzianowski) son grandes (~60 % del ancho, ~45 % del alto) y le TAPAN la cara: el chiste visual es que él desaparece detrás del objeto. Detección de cortes en 2,3 · 2,93 · 3,58 · 4,67 = cambios de letra/foto, no de plano.", "musica": "Cama musical continua y muy baja durante todo el vídeo: en ningún momento baja de −45 dB, y en las pausas de la voz queda a ≈ −28/−38 dB con contenido tonal (nota sostenida en torno a 262 Hz, Do4, con armónicos y un bajo de 75–95 Hz) → pad/piano emotivo y lento. La misma huella espectral sale en los tres vídeos de la serie (parece la misma cama). No se ha podido identificar el tema. Debajo de la intro jocosa no sube: el cambio de ambiente lo hacen la imagen y la voz, no la música.", "efectos": "Ninguno: cortes secos (5,22 y 26,53), sin zooms ni SFX. Plano nocturno fijo con color frío verdoso + farolas ámbar (look cinematográfico de noche). Único movimiento: la figura que avanza hacia cámara en los últimos 2 s del plano.", "voz": "Intro: alegre, sonriente, rápida (~4,1 pal/s). Voz en off: seria, cálida y continua, la más rápida de la serie (~4,6 pal/s) sin pausas largas, cayendo el tono al final de cada frase. D: rápida y risueña (~5 pal/s)."}, "por_que_funciona": [{"momento": "0.0–1.6 · '¿Qué crees que sea más pesado de cargar?'", "mecanismo": "Participación + doble sentido latente", "explicacion": "El test obliga a responder mentalmente y 'cargar' admite lectura física y emocional: el cerebro registra la ambigüedad sin resolverla, y eso es lo que hace que la C 'encaje' después como un clic de comprensión (insight)."}, {"momento": "2.3–4.6 · maleta y cesto de la ropa tapándole la cara", "mecanismo": "Humor visual + expectativa fijada", "explicacion": "Objetos cotidianos y ridículamente literales tapando al creador: risa ligera, guardia baja y una predicción clara ('esto es de broma') que la C va a romper."}, {"momento": "4.7–5.3 · 'Letra C:' sin foto + corte a la calle nocturna con un encapuchado", "mecanismo": "Error de predicción + reflejo de orientación", "explicacion": "Cambio total de luz, color, sitio y voz en el s 5. La figura encapuchada de frente, con la cara en sombra, es ligeramente inquietante: alerta + curiosidad ('¿quién es?'). Ese desconcierto retiene justo en el punto de abandono típico."}, {"momento": "5.2–11.2 · 'el peso de saber que tenías el potencial… y también tenías el tiempo'", "mecanismo": "Miedo al arrepentimiento / aversión a la pérdida", "explicacion": "Plantea una pérdida (potencial y tiempo que se van) en vez de una ganancia: las pérdidas pesan ~2 veces más. Casi nadie siente que ha aprovechado todo su potencial → identificación masiva."}, {"momento": "11.2–15.4 · «después lo hago, todavía tengo tiempo»", "mecanismo": "Autorreferencia por cita literal", "explicacion": "Repite palabra por palabra la frase que el espectador se dice a sí mismo: no es 'la gente procrastina', es TU voz interior. Es el momento de máxima identificación y de 'me ha dolido' en comentarios."}, {"momento": "15.4–21.5 · 'ahora estás viviendo ese futuro del que tanto temías'", "mecanismo": "Viaje temporal / urgencia", "explicacion": "Coloca al espectador en el futuro que temía y le dice que ya es hoy: convierte una idea abstracta en una amenaza presente → activación emocional y guardados ('para leerlo cada lunes')."}, {"momento": "21.5–28.1 · 'la escondiste llamando a la paciencia' + la figura avanza → 'Letra D: todo el súper de una vuelta'", "mecanismo": "Disonancia + imagen que confirma + alivio cómico", "explicacion": "Desenmascara una excusa que el espectador usa ('voy con calma' = comodidad), lo que pica y polariza un poco (comentarios). La figura caminando hacia cámara convierte en imagen a 'la persona que pudiste ser'. Justo después, el chiste universal del súper descarga la tensión y es lo que la gente cita en comentarios y caption ('todo el supermercado de una')."}], "caption": "Yo diría que todo el supermercado de una. \n\nCódigo “Daniel”\n@breathedivinity \n\n#cargar #pesado #motivacion #potencial #viral", "cta": "Sin CTA hablado. La D es cebo de comentarios (todos tenemos la experiencia de subir la compra de un viaje) y el caption continúa el chiste. Código de patrocinio en el caption.", "titulo_lucas": "Test: ¿qué es más pesado de cargar? (no haberte atrevido)", "texto_pantalla_lucas": "¿QUÉ CREES QUE ES MÁS PESADO DE CARGAR?", "guion_lucas": [{"texto": "¿Qué crees que es más pesado de cargar?", "plano": "GRABAR: selfie a cámara en tu cuarto o en casa, gorra y sudadera/forro oscuro, sonriendo. Texto de la pregunta centrado a la altura de la boca.", "nota": "Alegre, rápido, como un reto."}, {"texto": "Letra A: tus piernas en el kilómetro treinta y cinco.", "plano": "Mismo plano + 'A:' gigante → recuadro grande tapándote la cara con recursos/competicion/2025-11-09_carrera-dorsal-29233_corriendo-lateral-y-frente_ropa-blanca.MOV @ 9–12 s (de frente hacia cámara, con dorsal)", "nota": "Cara de sufrimiento exagerada en 'treinta y cinco'."}, {"texto": "Letra B: la mochila en una tirada larga.", "plano": "Mismo plano + 'B:' gigante → recuadro con recursos/running/2026-10-24_outfit-trail-se-prepara-en-parking_gafas-rojas-chaleco.MOV @ 64–68 s (se ajusta el chaleco de hidratación)"}, {"texto": "Letra C:", "plano": "Mismo plano, 'C:' gigante sin foto, sonrisa amplia. CORTE SECO a ~5,2 s.", "nota": "Sonríe y corta."}, {"texto": "Cargar con el peso de saber que podías intentarlo, y que tenías las piernas y el tiempo,", "plano": "GRABAR: de noche, calle estrecha con farolas y coches aparcados, trípode a ~8 m a la altura del pecho; tú de frente con capucha (sudadera oscura), quieto en mitad de la calle, la cara en sombra. 30 s quieto y, a los ~20 s, echas a andar despacio hacia la cámara.", "nota": "Voz en off seria, cálida y seguida; baja el tono al final de cada frase."}, {"texto": "pero lo dejaste para cuando estuvieras más en forma, más preparado, con menos miedo.", "plano": "Mismo plano nocturno (sin cortes)", "nota": "Tres 'más' en escalera; el último ('con menos miedo') más bajo."}, {"texto": "Seguías diciéndote: «el año que viene me apunto», como si tu cuerpo te fuera a esperar siempre.", "plano": "Mismo plano nocturno (sin cortes)", "nota": "La cita, con la voz despreocupada de la excusa."}, {"texto": "Y ahora estás viviendo ese año que viene que tanto ibas a aprovechar,", "plano": "Mismo plano nocturno (sin cortes)"}, {"texto": "dándote cuenta de que la persona que cruzaba esa meta no desapareció de la noche a la mañana.", "plano": "Mismo plano nocturno (sin cortes)"}, {"texto": "La fuiste perdiendo poco a poco, cada vez que tu cabeza te dijo «no puedes» y tú lo llamaste sentido común.", "plano": "Mismo plano nocturno: en «no puedes» empiezas a andar hacia la cámara; corte seco al acabar la frase", "nota": "Pausa mínima antes de 'y tú lo llamaste'; remata seco."}, {"texto": "Letra D: toda la compra en un viaje.", "plano": "Vuelta al plano a cámara + 'D:' gigante → recuadro: GRABAR: tú subiendo la escalera de casa cargado con 6–8 bolsas del súper, resoplando (5 s) | STOCK: meme del strongman Pudzianowski con bolsas", "nota": "Risueño y rápido. Fin en seco."}], "palabras_guion_lucas": 136, "duracion_objetivo_s": 28, "viabilidad_recursos": "baja", "que_grabar": ["Intro a cámara en casa (~8 s): pregunta + A + B + C y la D al final, en la misma sesión (3–4 tomas).", "Plano nocturno fijo de 30 s en una calle estrecha con farolas: tú encapuchado de frente, quieto y al final andando hacia la cámara.", "(Opcional, para la D) 5 s subiendo la escalera cargado de bolsas del súper."], "stock": ["Meme de Pudzianowski con bolsas de la compra (solo si no grabas la D tú)"], "notas_edit": "FORMATO COMÚN DE LA SERIE (los 3 de danielgmzs): (1) 0–5 s a cámara, casual y sonriente, en un sitio de andar por casa (coche de noche o su cuarto), pregunta '¿Qué crees que sea más ___?' con rótulo arriba; (2) A y B = respuestas literales y cotidianas, cada una con una foto de stock pequeña y algo ridícula que sale justo en el sustantivo; (3) 'C' sin foto y CORTE SECO a ~5,1–5,3 s a UN ÚNICO plano fijo nocturno de él solo, pequeño en el encuadre (13–21 s sin un solo corte) con voz en off íntima; (4) vuelta al mismo plano a cámara para 'O letra D: ___' = chiste literal con meme de cultura pop (1,4–2,2 s) y fin. Caption = continúa el chiste de la D cturno grabado a través de un tronco (como si le espiaras) y remate 'O letra D: dar un beso romántico' con el beso bajo la lluvia de El diario de Noa y él lanzando un beso ('mua'). Es el más corto de la serie (20,6 s).", "gancho_voz": "¿Qué crees que sea más romántico?", "gancho_texto_pantalla": "QUE CREES QUE SEA MÁS ROMÁNTICO?", "gancho_visual": "Selfie a cámara en su cuarto con luz cálida de lámpara (pared crema, mueble verde, pie de micro), gorra verde oliva y camiseta verde Spalding; sonrisa amplia y gesto de mano. Rótulo blanco condensado arriba en 3 líneas y subtítulo de palabra sobre el pecho.", "guion_original": [{"t": "0.0–1.3", "texto": "¿Qué crees que sea más romántico?", "plano": "A cámara en el cuarto; rótulo arriba 'QUE CREES QUE SEA MÁS ROMÁNTICO?'."}, {"t": "1.3–2.9", "texto": "Letra A, regalar flores.", "plano": "'LETRA A:' (1,3–2,0) → foto de stock de un chico escondiendo un ramo de rosas a la espalda ante una chica (2,0–2,9), encima de la cabeza."}, {"t": "2.9–4.5", "texto": "Letra B, dedicar serenata.", "plano": "'LETRA B:' (2,9–3,6) → foto de mariachis (3,6–4,5)."}, {"t": "4.5–5.1", "texto": "Letra C:", "plano": "'LETRA C:' sin foto. Corte seco a 5,13."}, {"t": "5.1–8.0", "texto": "Aprender a amarte a ti mismo antes de esperar a que alguien más lo haga por ti.", "plano": "Plano nocturno fijo grabado detrás de un tronco (tapa el tercio izquierdo, desenfocado): parque con camino curvo, farola blanca y árboles verdes iluminados; él a lo lejos, apoyado en la farola, con el móvil, en pantalón corto."}, {"t": "8.0–11.4", "texto": "Sanar tus propias heridas antes de intentar construir algo bonito con alguien más.", "plano": "Mismo plano nocturno."}, {"t": "11.4–13.2", "texto": "Y aprender a soltar aquello que te lastimó,", "plano": "Mismo plano nocturno."}, {"t": "13.2–16.4", "texto": "no porque tengas que olvidarlo, sino porque mereces vivir tu presente", "plano": "Mismo plano nocturno."}, {"t": "16.4–18.4", "texto": "sin seguir cargando con el dolor de tu pasado.", "plano": "Mismo plano nocturno. Corte seco a 18,45."}, {"t": "18.4–20.6", "texto": "O letra D: dar un beso romántico. ¡Mua!", "plano": "Vuelta al cuarto; 'LETRA D:' (18,8–19,1) → foto del beso bajo la lluvia de El diario de Noa (19,4–20,2) → lanza un beso a cámara con la mano ('MUA'). Fin."}], "estructura": [{"bloque": "Pregunta-test", "t": "0–1.3", "funcion": "Tema de amor = máxima amplitud de público; invita a responder."}, {"bloque": "Opciones tópicas A/B", "t": "1.3–4.5", "funcion": "Clichés románticos (flores, mariachis) con fotos de stock: tono ligero y predecible."}, {"bloque": "Giro C + corte", "t": "4.5–5.1", "funcion": "Corte a la noche: lo romántico pasa de hacia fuera a hacia dentro."}, {"bloque": "Dos 'antes de'", "t": "5.1–11.4", "funcion": "Paralelismo que ordena prioridades: tú primero, la pareja después."}, {"bloque": "Permiso para soltar", "t": "11.4–18.4", "funcion": "Valida sin culpa ('no porque tengas que olvidarlo') → alivio y ganas de enviarlo a alguien."}, {"bloque": "Remate cómico D + beso", "t": "18.4–20.6", "funcion": "Chiste tierno y gesto final ('mua') que cierra con sonrisa y empuja al rewatch."}], "edicion": {"num_planos": 3, "s_por_plano": 6.9, "subtitulos": "Palabra a palabra (1 palabra), MAYÚSCULAS, sans redondeada seminegrita tipo Poppins/Quicksand SemiBold, blanco roto/gris claro sin caja, a ~77 % de alto; iguales en la intro y en la noche (en la noche, sobre el camino). Fallo de autosubtítulo: tildes en minúscula ('ROMáNTICO', 'LASTIMó').", "texto_pantalla": "Rótulo arriba (y≈5–15 %) en condensada gruesa blanca tipo Anton: pregunta en 3 líneas (0–1,3) → 'LETRA A:' → foto que SUSTITUYE al rótulo → 'LETRA B:' → foto → 'LETRA C:' sin foto → nada en la noche → 'LETRA D:' → foto del beso. Fotos pequeñas (~60 % del ancho, ~20 % de alto) encima de la cabeza.", "musica": "Cama musical continua y muy baja durante todo el vídeo: en ningún momento baja de −45 dB, y en las pausas de la voz queda a ≈ −28/−38 dB con contenido tonal (nota sostenida en torno a 262 Hz, Do4, con armónicos y un bajo de 75–95 Hz) → pad/piano emotivo y lento. La misma huella espectral sale en los tres vídeos de la serie (parece la misma cama). No se ha podido identificar el tema. Debajo de la intro jocosa no sube: el cambio de ambiente lo hacen la imagen y la voz, no la música.", "efectos": "Ninguno: cortes secos (5,13 y 18,45), sin zoom ni SFX. Lo especial es el encuadre del plano nocturno: tronco desenfocado en primer plano (marco dentro del marco, punto de vista de alguien que mira a escondidas). Cierra con el gesto físico del beso con la mano.", "voz": "Intro: sonriente, juguetona (~3,2 pal/s, pausas tras cada letra). Voz en off: suave, cálida, tipo confidencia (~4,3 pal/s), frases muy parejas. D: dulce y pícara, termina con un 'mua' real."}, "por_que_funciona": [{"momento": "0.0–1.3 · '¿Qué crees que sea más romántico?'", "mecanismo": "Participación + tema de alto interés", "explicacion": "El amor es el tema con más público potencial y la pregunta invita a votar mentalmente (y en comentarios). Al ser el adjetivo menos amenazante de la serie, el gancho es más suave: por eso es el más corto, para no perder a nadie antes del giro."}, {"momento": "1.3–4.5 · 'regalar flores', 'dedicar serenata' + fotos de stock / mariachis", "mecanismo": "Expectativa de cliché", "explicacion": "Dos tópicos románticos reconocibles al instante (y la serenata con mariachis guiña a su público latino). El cerebro espera una tercera opción del mismo tipo; esa predicción es la que rompe la C."}, {"momento": "5.1 · corte al parque nocturno visto a través de un tronco", "mecanismo": "Error de predicción + mirada voyeur", "explicacion": "El tronco en primer plano coloca al espectador como alguien que observa a escondidas a una persona sola: curiosidad e intimidad inmediatas. Junto con el cambio de luz y de voz, dispara el reflejo de orientación en el s 5."}, {"momento": "5.1–11.4 · 'Aprender a amarte… antes de esperar a que alguien más lo haga por ti' / 'Sanar tus propias heridas antes de…'", "mecanismo": "Reencuadre + paralelismo", "explicacion": "Redefine 'romántico' hacia dentro (sorpresa conceptual = insight) y lo repite con la misma estructura 'X antes de Y'. El paralelismo hace la idea fácil de procesar y de recordar, y por eso se cita y se comparte."}, {"momento": "11.4–18.4 · 'no porque tengas que olvidarlo, sino porque mereces vivir tu presente'", "mecanismo": "Validación / permiso (baja la culpa)", "explicacion": "Niega la exigencia típica ('olvídalo ya') y da permiso: genera alivio en quien está pasando una ruptura. Esa sensación de 'me entiende' es la que hace enviarlo por privado a un amigo (compartidos)."}, {"momento": "18.4–20.6 · 'O letra D: dar un beso romántico' + El diario de Noa + 'mua'", "mecanismo": "Alivio cómico + bucle corto", "explicacion": "Vuelve lo literal con el beso más icónico del cine y un gesto tierno: deja buen sabor y no rompe el mensaje. Con 20 s y un final que conecta con la pregunta inicial, mucha gente lo ve 2 veces seguidas (sube la retención por encima del 100 %). El caption 'Sé un romántico contigo' deja el mensaje en una frase que se puede citar."}], "caption": "Sé un romántico contigo.\n\nCódigo “Daniel” \n@breathedivinity \n\n#romantico #amorpropio #relaciones #relatable #viral", "cta": "Sin CTA hablado. La D y el 'mua' cierran con sonrisa; el caption resume el mensaje en una frase citable. Código de patrocinio en el caption.", "titulo_lucas": "Test: ¿qué es más romántico? (saber estar solo)", "texto_pantalla_lucas": "¿QUÉ CREES QUE ES MÁS ROMÁNTICO?", "guion_lucas": [{"texto": "¿Qué crees que es más romántico?", "plano": "GRABAR: selfie a cámara en casa con luz cálida de lámpara, gorra, camiseta verde o de color liso; sonrisa amplia. Rótulo arriba con la pregunta.", "nota": "Juguetón, con ceja levantada."}, {"texto": "Letra A: un abrazo en la meta.", "plano": "Mismo plano + 'LETRA A:' → recuadro encima de la cabeza con recursos/competicion/2025-07-05_deka-zaragoza_abrazo-meta_pantalon-oliva.MOV @ 0,5–4 s (abrazo al terminar la DEKA)", "nota": "La gracia es que el abrazo es con un colega: no hace falta decirlo."}, {"texto": "Letra B: hacerle tortitas antes de correr.", "plano": "Mismo plano + 'LETRA B:' → foto recursos/fotos/tortitas-miel_recorte.png (tortitas con miel) encima de la cabeza"}, {"texto": "Letra C:", "plano": "Mismo plano, 'LETRA C:' sin foto. CORTE SECO a ~5,1 s."}, {"texto": "Aprender a disfrutar de tu propia compañía antes de esperar a que alguien venga a completarte.", "plano": "GRABAR: de noche en un parque, móvil escondido detrás de un tronco o un seto que tape el tercio izquierdo del encuadre; tú a ~15 m apoyado en una farola, con ropa de correr (manga larga negra + corto), mirando el móvil como al acabar un rodaje. 20 s quieto.", "nota": "Voz suave, de confidencia; sin prisa."}, {"texto": "Sanar tus propias heridas antes de intentar construir algo bonito con alguien.", "plano": "Mismo plano nocturno (sin cortes)", "nota": "Misma melodía que la frase anterior (paralelismo 'antes de')."}, {"texto": "Y aprender a soltar lo que te hizo daño,", "plano": "Mismo plano nocturno (sin cortes)"}, {"texto": "no porque tengas que olvidarlo, sino porque mereces vivir tu presente", "plano": "Mismo plano nocturno (sin cortes)", "nota": "Pausa breve antes de 'sino'."}, {"texto": "sin seguir corriendo con la mochila de tu pasado.", "plano": "Mismo plano nocturno; corte seco al acabar", "nota": "Remata bajando el tono en 'pasado'."}, {"texto": "O letra D: darle un beso a tu medalla. ¡Mua!", "plano": "Vuelta al plano a cámara (misma toma): coges una medalla tuya y le das un beso, y en '¡Mua!' lanzas un beso a cámara + 'LETRA D:' → recuadro con recursos/competicion/2025-11-09_carrera-dorsal-29233_mordiendo-medalla_ropa-blanca.MOV @ 0–3,4 s", "nota": "Dulce y pícaro; el 'mua' de verdad."}], "palabras_guion_lucas": 89, "duracion_objetivo_s": 21, "viabilidad_recursos": "baja", "que_grabar": ["Intro a cámara en casa (~7 s) con la pregunta, A, B y C y, en la misma sesión, la D besando una medalla tuya + lanzar un beso.", "Plano nocturno fijo de 20 s en un parque, desde detrás de un tronco: tú lejos, apoyado en una farola, con ropa de correr, mirando el móvil."], "stock": [], "notas_edit": "FORMATO COMÚN DE LA SERIE (los 3 de danielgmzs): (1) 0–5 s a cámara, casual y sonriente, en un sitio de andar por casa (coche de noche o su cuarto), pregunta '¿Qué crees que sea más ___?' con rótulo arriba; (2) A y B = respuestas literales y cotidianas, cada una con una foto de stock pequeña y algo ridícula que sale justo en el sustantivo; (3) 'C' sin foto y CORTE SECO a ~5,1–5,3 s a UN ÚNICO plano fijo nocturno de él solo, pequeño en el encuadre (13–21 s sin un solo corte) con voz en off íntima; (4) vuelta al mismo plano a cámara para 'O letra D: ___' = chiste literal con meme de cultura pop (1,4–2,2 s) y fin. Caption = continúa el chiste de la D + código de patrocinio + 5 hashtags. VARÍA: el adjetivo (peligroso / pesado / romántico) y por tanto el tema de la C (identidad / arrepentimiento / amor propio), el sitio de la intro y la camiseta, el plano nocturno (plaza con palmeras / calle con encapuchado / parque a través de un tronco), la tipografía de los subtítulos y si las letras van en rótulo arriba ('LETRA A:') o gigantes en el pecho ('A:'). El más visto (760 K) es el de identidad: el tema más universal y el adjetivo de amenaza más fuerte. | CÓMO CALCARLO: 3 planos y cortes secos (≈5,1 y ≈18,4 s), sin zooms ni SFX. Rótulo arriba en Anton blanca; la foto/clip de cada opción SUSTITUYE al rótulo 'LETRA X:' en el sustantivo (pop.mp3 suave); 'LETRA C:' sin nada. Recuadros pequeños (~60 % del ancho) encima de la cabeza; en los clips (abrazo DEKA, medalla), borde blanco fino y sin sonido. Subtítulos de la casa (Subtitulos.tsx) en los tres planos, sobre el camino en la noche. El tronco en primer plano es la firma visual: que tape un tercio y esté desenfocado (enfoca a la farola). Música: pad/piano emotivo muy bajo todo el vídeo. Es el más corto (≈21 s): no lo alargues; el final es el 'mua', en seco."}, {"id": "Depf_qVgTEc", "creador": "gerardfelipx", "seguidores": 179000, "visitas": 265000, "likes": 8662, "comentarios": 104, "duracion_s": 50.5, "url": "https://www.instagram.com/reel/Depf_qVgTEc/", "formato": "Confesión 'soy un procrastinador' + día a día en planos cortos (querer vs decidir)", "resumen": "Un chico en forma confiesa que es un procrastinador con pereza y fuerza de voluntad normales, y explica que no se salta entrenos porque no espera a tener ganas: lo ha decidido. Va narrado sobre un día normal (sofá, correr, ducha, comida en familia, moto), con un plano cada 2 s y subtítulos pequeños palabra a palabra.", "gancho_voz": "Tengo 21 años y soy un procrastinador. Sí, como todos.", "gancho_texto_pantalla": null, "gancho_visual": "0–2,9 s: tirado en el sofá sin camiseta, con una manta naranja, cierra el portátil con desgana y se recuesta. Plano fijo, colores apagados. Los subtítulos salen palabra a palabra encima de la cabeza y 'procrastinador' va en cursiva. 2,9 s: otro ángulo del sofá, con la mano en la barbilla y mirando a la nada.", "guion_original": [{"t": "0.0–2.3", "texto": "Tengo 21 años y soy un procrastinador.", "plano": "Sofá, sin camiseta, manta naranja: cierra el portátil y se deja caer."}, {"t": "2.4–4.0", "texto": "Sí, como todos.", "plano": "2,87: otro ángulo del sofá, mano en la barbilla, mirada perdida."}, {"t": "4.1–6.7", "texto": "Pero no recuerdo la última vez que me salté un entreno.", "plano": "4,48: primer plano de los pies, sentado en la cama poniéndose las zapatillas de running (Nike negras con suela roja) y los manguitos."}, {"t": "6.9–10.1", "texto": "Pereza tengo como todo el mundo, y fuerza de voluntad, normalita.", "plano": "6,95: en la calle estira apoyado en una verja blanca: camiseta térmica negra de manga larga y pantalón corto gris."}, {"t": "10.3–13.9", "texto": "Pero una cosa es querer hacer algo y otra muy distinta es decidir hacerlo.", "plano": "10,08: sale corriendo calle abajo, de espaldas, y se va haciendo pequeño entre casas y coches."}, {"t": "13.9–15.1", "texto": "Y lo sé por experiencia.", "plano": "13,92: vuelve a casa: pies con las zapatillas sobre el felpudo."}, {"t": "15.4–18.0", "texto": "Estuve un año pensando cada día en grabarme mi primer vídeo.", "plano": "15,02: se quita la camiseta · 16,02: en la ducha, de espaldas bajo el agua."}, {"t": "18.2–20.8", "texto": "Me decía que la red no era para mí, que era un mundo superficial.", "plano": "≈18,2: se gira en la ducha y mira abajo a través del cristal."}, {"t": "21.1–24.9", "texto": "Y en parte es cierto, pero era más fácil tener una excusa que tomar una decisión.", "plano": "20,98: ropa doblada y bote de creatina en la encimera · 21,92: coge una camiseta de la percha en el armario · 23,53: de espaldas abre la nevera, con una camiseta negra de Gymshark con la G gótica."}, {"t": "25.1–29.2", "texto": "Muchas veces, detrás de un 'no tengo tiempo' o 'no sé si es para mí', hay algo que incomoda.", "plano": "25,27: coge cubiertos del cajón · 26,73: cajones cerrándose · 27,92: mesa vacía con mantel de cuadros."}, {"t": "29.4–32.5", "texto": "Volver a fallar, que te juzguen. Y eso no desaparece.", "plano": "29,05: pone los vasos en la mesa · 30,68: chuletas en la plancha."}, {"t": "32.6–33.8", "texto": "Yo sigo siendo un procrastinador.", "plano": "Da la vuelta a la carne con las pinzas."}, {"t": "34.0–39.1", "texto": "La diferencia es que el día que decidí grabar, la incomodidad seguía ahí, pero simplemente no le hice caso.", "plano": "33,98: se sienta a comer con un familiar (camisa de cuadros, de espaldas), sonríe y escucha. Plano largo de 5 s, el más largo del vídeo."}, {"t": "39.4–41.5", "texto": "Con el entreno me pasa exactamente lo mismo.", "plano": "39,37: plato de carne con patatas, manos comiendo, una mujer al fondo (comida en familia)."}, {"t": "41.7–42.7", "texto": "No siempre quiero hacerlo.", "plano": "41,5: carga el lavavajillas."}, {"t": "42.9–44.3", "texto": "Pero es algo que ya he decidido.", "plano": "42,72: de pie junto a una puerta, con la mano en la boca (se lava los dientes o come algo)."}, {"t": "44.7–46.9", "texto": "Así que si llevas tiempo diciendo que quieres empezar,", "plano": "44,52: se abre la puerta del garaje · 45,23: se pone el casco y la mochila junto a la moto."}, {"t": "47.0–48.1", "texto": "quizá no te falta tiempo.", "plano": "46,83: sale en moto por la calle, detrás de una verja con hiedra."}, {"t": "48.4–50.0", "texto": "Quizá te falta decidirlo.", "plano": "La moto se aleja y sale de plano; corte seco a los 50,4 s."}], "estructura": [{"bloque": "Gancho-confesión", "t": "0–4", "funcion": "Se pone una etiqueta que casi todo el mundo se pone ('procrastinador'), con edad concreta, y la normaliza ('como todos'). El espectador piensa 'yo también' y baja la guardia."}, {"bloque": "Contradicción", "t": "4–10", "funcion": "'Pero no recuerdo la última vez que me salté un entreno' choca con lo anterior y abre la pregunta '¿cómo lo hace?'. 'Fuerza de voluntad normalita' quita la excusa de 'es que él es especial'."}, {"bloque": "Tesis + promesa", "t": "10–15", "funcion": "Distinción memorable: querer ≠ decidir. 'Lo sé por experiencia' promete una historia y deja un bucle abierto."}, {"bloque": "Historia personal", "t": "15–25", "funcion": "Un año aplazando grabar su primer vídeo. Es una vulnerabilidad concreta y la excusa ('mundo superficial') es la que el espectador también usa."}, {"bloque": "Insight emocional", "t": "25–32,5", "funcion": "Pone nombre al miedo que hay detrás de 'no tengo tiempo': fallar y que te juzguen. Es el momento de 'me ha leído la mente' y el que se guarda."}, {"bloque": "Giro", "t": "32,5–39", "funcion": "No vende una transformación ('sigo siendo un procrastinador'): la incomodidad no se va, simplemente no le haces caso. Es creíble y alivia."}, {"bloque": "Vuelta al entreno", "t": "39–44,5", "funcion": "Cierra el bucle del principio: lo aplica al entreno ('no siempre quiero, pero ya lo he decidido')."}, {"bloque": "Cierre-reto", "t": "44,5–50,4", "funcion": "Habla directamente al espectador ('si llevas tiempo diciendo…') y termina con una frase redonda y paralela ('no te falta tiempo / te falta decidirlo') mientras él se va. Corte seco: invita a volver a verlo y a compartirlo."}], "edicion": {"num_planos": 24, "s_por_plano": 2.1, "subtitulos": "Palabra a palabra, muy pequeños (≈3 % del alto), blanco, sans-serif redonda en minúsculas (tipo Montserrat/Poppins semibold), sin fondo ni sombra marcada. Las palabras de la frase se van acumulando en posiciones escalonadas (una nube suelta en la parte alta-media del plano, sobre la cabeza o el fondo liso) y se borran al acabar la frase. La palabra clave 'procrastinador' va en una serif cursiva más grande. Sin puntuación.", "texto_pantalla": "Ninguno aparte de los subtítulos (ni título ni gancho escrito).", "musica": "Instrumental ambiental y emotiva (piano y pads, sin percusión fuerte) que suena todo el vídeo a volumen alto bajo la voz (en las pausas está a ≈ −18 dB frente a ≈ −16 de la voz). No la he identificado. Termina en seco con el último plano.", "efectos": "Corte seco en todos los planos (sin transiciones ni zooms). Etalonaje apagado y cálido de cine (desaturado, sombras levantadas, viñeta suave). Mucho primer plano de detalle (pies, cajón, plancha) mezclado con planos generales fijos. Al principio parece que hay sonido ambiente de las acciones (puerta, plancha) por debajo de la música.", "voz": "Tranquila, íntima y en tono confesional, casi en voz baja y sin énfasis de coach. Unas 3,6 palabras/s, con micropausas entre frases (0,2–0,3 s)."}, "por_que_funciona": [{"momento": "0.0–2.3 · 'Tengo 21 años y soy un procrastinador' + chico en forma tirado en el sofá", "mecanismo": "Autorreferencia + disonancia", "explicacion": "Casi todo el mundo se considera procrastinador, así que el cerebro lo procesa como 'esto va de mí' (efecto de autorreferencia: se atiende y se recuerda más). A la vez, un chico con ese físico diciendo que es vago rompe lo que esperas ver, y esa disonancia hace que no deslices."}, {"momento": "2.4–4.0 · 'Sí, como todos.'", "mecanismo": "Identificación de grupo / normalización", "explicacion": "Mete al espectador en el mismo grupo que el creador. Lo que dice ya no suena a sermón de alguien superior sino a confesión entre iguales, así que baja la resistencia (reactancia) y se escucha el mensaje."}, {"momento": "4.1–6.7 · 'Pero no recuerdo la última vez que me salté un entreno' (corte a las zapatillas)", "mecanismo": "Brecha de curiosidad (bucle abierto)", "explicacion": "Juntar 'procrastinador' con 'nunca me salto un entreno' crea una contradicción que el cerebro necesita resolver ('¿cómo?'). La respuesta no llega hasta el s 34, y esa tensión pendiente (efecto Zeigarnik) sostiene la retención hasta la mitad del vídeo."}, {"momento": "6.9–10.1 · 'fuerza de voluntad normalita'", "mecanismo": "Autoeficacia / quitar la excusa del talento", "explicacion": "Desmonta el 'es que él tiene disciplina y yo no'. Si alguien normal lo consigue, el espectador siente que él también puede (autoeficacia, Bandura). Por eso se guarda y se comparte como algo útil, no como presumir."}, {"momento": "25.1–32.5 · 'detrás de un no tengo tiempo… hay algo que incomoda. Volver a fallar, que te juzguen'", "mecanismo": "Etiquetado emocional (insight)", "explicacion": "Pone nombre a una emoción que el espectador siente pero no ha dicho nunca. Ponerle palabras da alivio y la sensación de 'me ha leído', que es lo que más se guarda y se manda por privado ('esto es para ti')."}, {"momento": "32.6–39.1 · 'Yo sigo siendo un procrastinador… la incomodidad seguía ahí, pero no le hice caso' (plano largo en la mesa familiar)", "mecanismo": "Vulnerabilidad creíble (confianza)", "explicacion": "No promete una cura mágica: admite que la sensación sigue ahí. Esa honestidad genera confianza y conexión (la vulnerabilidad se asocia a oxitocina). Además es la frase con el plano más largo y cálido (comida en familia), así que es el momento más humano del vídeo."}, {"momento": "0–50 · 24 planos de rutina (≈2 s cada uno) y corte seco tras 'Quizá te falta decidirlo'", "mecanismo": "Novedad visual + cierre que invita al bucle", "explicacion": "Cada corte de ≈2 s con una acción nueva (zapatillas, plancha, garaje) activa el reflejo de orientación sin cansar, porque son acciones cotidianas y estéticas (vida aspiracional pero alcanzable). La frase final, en paralelo y con forma de aforismo, se dice mientras él se va en moto y el vídeo se corta de golpe: el espectador se queda con la frase y muchas veces lo vuelve a ver o lo comparte."}], "caption": "si lees esto, hazlo.\n\n#reflexion #mentalidad #procrastinar #deporte #correr", "cta": "Sin CTA explícita de seguir. El cierre ('quizá te falta decidirlo') funciona como llamada a la acción y el caption la remata: 'si lees esto, hazlo.'", "titulo_lucas": "Soy un procrastinador (pero no me salto entrenos)", "texto_pantalla_lucas": "Sin gancho escrito, igual que el original: solo subtítulos palabra a palabra con 'procrastinador' en cursiva. Si quieres portada: 'soy un procrastinador'.", "guion_lucas": [{"texto": "Tengo [tu edad] años y soy un procrastinador.", "plano": "GRABAR: tirado en el sofá (sin camiseta o con camiseta de estar por casa, manta encima), plano fijo; cierras el portátil con desgana y te dejas caer. 3 s.", "nota": "Tono de confesión, casi con vergüenza. Pausa corta antes de 'procrastinador'."}, {"texto": "Sí, como todos.", "plano": "GRABAR: mismo sofá desde otro ángulo, mano en la barbilla, mirando a la nada. 1,5 s.", "nota": "Con media sonrisa, en plan cómplice."}, {"texto": "Pero no recuerdo la última vez que me salté un entreno.", "plano": "recursos/gym/fisico/2026-11-01_hibrido_intro-sentado-cajon-nike-strength.mov @ 5,6–8 (se ata las zapatillas; encuadra cerrado a los pies)", "nota": "Un poco más de energía en 'no recuerdo'."}, {"texto": "Pereza tengo como todo el mundo. Y fuerza de voluntad, normalita.", "plano": "recursos/recuperacion/2025-06-04_movilidad-dinamica-paseo-contrapicado_sin-camiseta.MOV @ 8–11 (círculos de brazos, calentando)", "nota": "'Normalita' con gracia, quitándote importancia."}, {"texto": "Pero una cosa es querer hacer algo y otra muy distinta es decidir hacerlo.", "plano": "recursos/running/2026-10-18_correr-calle-ladrillo_espaldas-y-lado_manga-larga-negra.MOV @ 0–4 (de espaldas, se aleja por la calle; quita el audio)", "nota": "Remarca 'querer' y 'decidir'."}, {"texto": "Y lo sé por experiencia.", "plano": "recursos/competicion/2025-11-09_carrera-dorsal-29233_pov-pies-y-dorsal_ropa-blanca.MOV @ 0–1,5 (POV de los pies corriendo)"}, {"texto": "Estuve [cuánto tiempo, p. ej. 'un año'] pensando cada día en apuntarme a mi primer [maratón / medio Ironman].", "plano": "recursos/recuperacion/2025-11-26_ducha-spa-luz-roja_de-espaldas_sin-camiseta.MOV @ 0–3,5 (de espaldas bajo el agua, pensativo)", "nota": "Pon solo lo que sea verdad. Si lo que aplazaste fue empezar a grabar contenido, puedes dejar la historia original ('grabarme mi primer vídeo')."}, {"texto": "Me decía que eso no era para mí, que [tu excusa de entonces, p. ej. 'era para gente que lleva toda la vida corriendo'].", "plano": "recursos/recuperacion/2025-11-26_ducha-spa-luz-roja_de-espaldas_sin-camiseta.MOV @ 12–15 (se gira y sale de la ducha)"}, {"texto": "Y en parte tenía su lógica, pero era más fácil tener una excusa que tomar una decisión.", "plano": "recursos/running/2026-10-24_outfit-trail-se-prepara-en-parking_gafas-rojas-chaleco.MOV @ 0–3,5 (se pone las gafas; quita el audio)", "nota": "Marca el contraste 'excusa' / 'decisión'."}, {"texto": "Muchas veces, detrás de un 'no tengo tiempo' o un 'no sé si es para mí',", "plano": "recursos/lifestyle/2026-09-24_andando-con-portatil-paseo-soleado_tirantes-negra.MOV @ 8–12 (con el portátil, el 'no tengo tiempo')"}, {"texto": "hay algo que incomoda. Volver a fallar, que te juzguen.", "plano": "recursos/gym/pecho/2026-08-28_press-pecho-maquina-technogym_amigo-ayuda-al-final_camiseta-blanca-compresiva.MOV @ 28–32 (al fallo, el amigo le ayuda)", "nota": "Baja el tono, más lento. Es el momento más íntimo."}, {"texto": "Y eso no desaparece.", "plano": "recursos/gym/pecho/2026-08-28_press-pecho-maquina-technogym_amigo-ayuda-al-final_camiseta-blanca-compresiva.MOV @ 34–36 (sentado, reventado)"}, {"texto": "Yo sigo siendo un procrastinador.", "plano": "recursos/lifestyle/2025-06-27_cafe-chiringuito-playa_sin-camiseta.MOV @ 0–2,5 (sorbo de café sin prisa)", "nota": "Con humor, encogiéndote de hombros con la voz."}, {"texto": "La diferencia es que el día que [me inscribí], el miedo seguía ahí, pero simplemente no le hice caso.", "plano": "recursos/competicion/2025-11-09_carrera-dorsal-29233_corriendo-lateral-y-frente_ropa-blanca.MOV @ 0–3 + @ 9–12 (de frente hacia cámara)", "nota": "Plano largo (≈5 s), como en el original. Pausa antes de 'pero simplemente'."}, {"texto": "Con el entreno me pasa exactamente lo mismo.", "plano": "recursos/running/2026-03-17_correr-amanecer-pasarela_02-lateral-silueta-con-el-sol_manga-larga-negra.MOV @ 2–4,5"}, {"texto": "No siempre me apetece.", "plano": "recursos/running/2024-12-11_selfie-pasarela-dunas-nublado_sudadera-asics-azul-marino.MOV @ 0–1,5 (día gris de invierno)"}, {"texto": "Pero es algo que ya he decidido.", "plano": "recursos/running/2026-10-30_selfie-contrapicado-trail-buenos-dias_gafas-rojas-chaleco.MOV @ 0–1,5 (selfie de buena mañana; sin el audio del 'buenos días')", "nota": "Firme y corto."}, {"texto": "Así que si llevas tiempo diciendo que quieres empezar,", "plano": "recursos/running/2026-03-17_correr-amanecer-pasarela_01-pov-y-grupo-a-contraluz.MOV @ 2–4,5 (grupo a contraluz)", "nota": "Ahora hablas a quien lo ve, más cerca."}, {"texto": "quizá no te falta tiempo.", "plano": "recursos/running/2025-10-20_correr-carril-dunas-atardecer_02-espaldas-y-lateral_camiseta-gris-pantalon-oliva.MOV @ 3–5"}, {"texto": "Quizá te falta decidirlo.", "plano": "recursos/running/2025-10-20_correr-carril-dunas-atardecer_01-espaldas_camiseta-gris-pantalon-oliva.MOV @ 2–6 (se aleja de espaldas al atardecer; corte seco al acabar la palabra)", "nota": "Pausa de 0,4 s antes y dilo bajito."}], "duracion_objetivo_s": 50, "viabilidad_recursos": "alta", "que_grabar": ["Sofá: tirado con manta y portátil, lo cierras con desgana (3 s), y otro ángulo con la mano en la barbilla (1,5 s). Plano fijo con el móvil apoyado: en total menos de 1 min."], "stock": [], "notas_edit": "Calca el ritmo: un plano cada ≈2 s (24 planos en 50 s) con corte seco y sin transiciones ni zooms. El único plano largo (≈5 s) va en 'la diferencia es que…'. Ordena los recursos como un día: casa (sofá) → preparar → correr → ducha → vida → competición/amaneceres → te alejas de espaldas al final (en el original se va en moto). Etalonaje común a todos para unificar outfits y luces distintas: bajar saturación ≈20 %, sombras levantadas, tono cálido y viñeta suave. Subtítulos palabra a palabra pequeños, blancos, en minúscula y sans redonda, acumulando la frase en posiciones escalonadas en la zona alta y sin tapar la cara; 'procrastinador' en serif cursiva. Música instrumental de piano o ambiente emotiva, alta y constante bajo la voz, que acaba en seco con el último plano (no uses phonk ni las gym-a/b/c de musica-ia: mejor algo tipo 'Restless' instrumental o un piano lo-fi tranquilo). Quita el audio de todos los clips. Voz grabada con calma (≈3,5 pal/s), sin tono de coach. Caption sugerido en el mismo estilo: 'si lees esto, decídelo.'", "palabras_guion_lucas": 179}, {"id": "DeAER56AgD7", "creador": "gerardfelipx", "seguidores": 179000, "visitas": 242000, "likes": 8216, "comentarios": 87, "duracion_s": 48.6, "url": "https://www.instagram.com/reel/DeAER56AgD7/", "formato": "Confesión 'ya no sé aburrirme' + experimento (2 h en la bici sin móvil ni música)", "resumen": "Reflexión sobre la incapacidad de aburrirnos (el móvil hasta en el baño, la música al andar, el móvil a los niños que lloran) que da un giro ('las pantallas no son el problema, el problema es que no sabemos vivir sin ellas') y se cierra con un experimento propio: 2 horas de bici estática en silencio. Primero va sobre su día a día en casa y después en el gym, con un plano cada 2 s.", "gancho_voz": "Ya no sé aburrirme. Y no soy el único, lo sé, lo veo.", "gancho_texto_pantalla": null, "gancho_visual": "0–2,9 s: tirado en el sofá sin camiseta, con los AirPods puestos y el portátil en el regazo, mira al techo con cara de vacío y suspira. Plano fijo de salón (altavoz, cojín rojo). Los subtítulos salen palabra a palabra y se acumulan en la parte alta ('ya no sé aburrirme').", "guion_original": [{"t": "0.0–3.0", "texto": "Ya no sé aburrirme. Y no soy el único, lo sé, lo veo.", "plano": "Sofá, sin camiseta y con AirPods, mira al techo; al final se incorpora y coge algo."}, {"t": "3.1–5.0", "texto": "No puedo estar ni un minuto sin hacer nada.", "plano": "2,92: mano con el mando en el sofá · 3,75: tele encendida con barras de color (zapping)."}, {"t": "5.1–7.8", "texto": "No puedo ir al baño sin el móvil, o andar sin música.", "plano": "≈4,9: en el baño, tira del papel higiénico (reloj en la muñeca) · 6,58: baja unas escaleras de espaldas con mochila Nike y AirPods."}, {"t": "8.0–11.8", "texto": "Y no es que esté mal en sí, pero echo de menos no saber qué hacer, como cuando era pequeño.", "plano": "7,87: sin camiseta, de espaldas, abre la nevera · 9,93: llena un cazo en el grifo · 11,42: cocina, plano general de espaldas."}, {"t": "12.1–14.9", "texto": "Recuerdo que tenía que buscar a niños para jugar a algo.", "plano": "Sigue el plano general de la cocina, cortando verdura de espaldas."}, {"t": "15.1–18.0", "texto": "Hoy en día, si el niño llora, le pones un móvil y ya no molesta.", "plano": "14,9: manos encendiendo la vitro táctil · 16,28: echa aceite a la sartén."}, {"t": "18.1–22.8", "texto": "Y es fácil echarle la culpa a las pantallas, pero las pantallas no son el problema.", "plano": "Hamburguesas a la plancha y echa calabacín a la olla · 20,77: olla y sartén desde arriba · 21,68: escurre la verdura en el colador junto a la ventana."}, {"t": "23.1–25.7", "texto": "El problema es que no sabemos vivir sin ellas.", "plano": "≈23: fregadero y ventana · ≈23,6: fuera, un muro de ladrillo y un tejadillo bajo la lluvia (plano quieto y sin él)."}, {"t": "26.1–26.9", "texto": "Así que estoy probando algo.", "plano": "25,95: en el gym, sentado en el suelo poniéndose las zapatillas (tirantes verde, pared turquesa con una ilustración)."}, {"t": "27.1–31.0", "texto": "El otro día estuve dos horas en la bici, sin música, sin móvil, en silencio.", "plano": "27,78: bici de spinning sin camiseta, de lado (gym oscuro con luz azul) · 28,9 / 29,67: otros ángulos · 30,92: primer plano de las piernas pedaleando."}, {"t": "31.1–35.6", "texto": "Y sorprendentemente, pude ver cosas que en tres años no había visto, como esta mancha, o esto.", "plano": "32,23: de espaldas en la bici, se gira y sonríe · 34,52: detalle de una mancha en la pared · 35,63: pared de ladrillo gris con un dibujo rojo y un ventilador."}, {"t": "36.1–39.0", "texto": "Hablé con cada persona que entró, hablé incluso solo, contando ovejitas.", "plano": "36,53: se gira sonriendo y saluda con la mano a alguien que entra · 37,85: primer plano de hombros y espalda pedaleando."}, {"t": "39.1–41.9", "texto": "Y creo que eso era justo lo que necesitaba.", "plano": "39,7: piernas subiendo a la bici · 40,67: plano general en la bici, agotado sobre el manillar."}, {"t": "42.1–47.8", "texto": "Porque cuando estás constantemente entretenido, no solo te pierdes lo que tienes delante, también te pierdes lo que tienes dentro.", "plano": "Sigue en la bici · ≈44,2: primer plano de hombros y espalda sudados, de pie · ≈46,4: bebe del bidón. Corte seco a los 48,6 s."}], "estructura": [{"bloque": "Gancho-confesión", "t": "0–3", "funcion": "Una confesión incómoda en primera persona ('ya no sé aburrirme') que se convierte en algo de todos ('no soy el único'): el espectador se ve reflejado."}, {"bloque": "Lista de síntomas", "t": "3–7,8", "funcion": "Ejemplos concretos y un poco vergonzosos (el móvil en el baño) con los que el espectador se pilla a sí mismo. Mete humor y hace que lo reconozca."}, {"bloque": "Nostalgia", "t": "8–15", "funcion": "Recuerdo de la infancia (buscar niños para jugar), que da calidez y conecta con la generación del espectador."}, {"bloque": "Tema polémico", "t": "15–18", "funcion": "El móvil a los niños que lloran es un tema delicado: mueve a padres y no padres a opinar."}, {"bloque": "Giro / reencuadre", "t": "18–25,7", "funcion": "'Las pantallas no son el problema; el problema es que no sabemos vivir sin ellas': da la vuelta a lo esperable y devuelve la responsabilidad a cada uno."}, {"bloque": "Experimento", "t": "26–41,9", "funcion": "Promete y cuenta una prueba real (2 h de bici en silencio) con detalles absurdos y divertidos (la mancha, contar ovejitas)."}, {"bloque": "Cierre-aforismo", "t": "42–48,6", "funcion": "Una frase redonda en dos partes (delante / dentro) que deja poso y se comparte. Corte seco."}], "edicion": {"num_planos": 26, "s_por_plano": 1.9, "subtitulos": "Palabra a palabra, pequeños, blancos, sans redonda semibold en minúscula y sin puntuación. En la primera frase las palabras se acumulan escalonadas en la parte alta; después casi siempre sale una sola palabra cada vez, centrada sobre el cuerpo (pecho o espalda) o sobre una zona lisa.", "texto_pantalla": "Ninguno aparte de los subtítulos.", "musica": "Instrumental ambiental y emotiva (notas largas de piano o pad, se ven tonos sostenidos en el espectro) durante todo el vídeo, a volumen alto bajo la voz (≈ −20 dB en las pausas). No la he identificado. Termina con el último plano.", "efectos": "Corte seco en todos los planos, sin transiciones. Etalonaje apagado y cálido en casa y frío azul o turquesa en el gym (cambio de color = cambio de capítulo). Planos de detalle muy cerrados (mando, papel higiénico, cazo, vitro) combinados con planos generales fijos. En el gym la imagen es más cinematográfica (fondo desenfocado y luz lateral).", "voz": "Tranquila e introspectiva, algo cansada, en tono de reflexión y sin énfasis de coach. ≈3,6 palabras/s con micropausas entre frases."}, "por_que_funciona": [{"momento": "0.0–3.0 · 'Ya no sé aburrirme. Y no soy el único, lo sé, lo veo.' (tirado en el sofá con AirPods)", "mecanismo": "Autorreferencia + identificación de grupo", "explicacion": "Es una frase que casi cualquiera puede decir de sí mismo, así que el cerebro la etiqueta como 'esto va de mí' y presta atención. 'No soy el único' lo convierte en un problema de grupo y quita la vergüenza de reconocerlo."}, {"momento": "5.1–6.6 · 'No puedo ir al baño sin el móvil' (plano del papel higiénico)", "mecanismo": "Reconocimiento vergonzoso + humor", "explicacion": "Un detalle íntimo y concreto que todos hacemos y nadie cuenta. El 'pillado' provoca una risa de reconocimiento (sorpresa + verdad), y es lo que hace que se comparta etiquetando a alguien ('tú')."}, {"momento": "12.1–14.9 · 'Recuerdo que tenía que buscar a niños para jugar a algo'", "mecanismo": "Nostalgia (memoria autobiográfica)", "explicacion": "Activa recuerdos propios de la infancia del espectador. La nostalgia genera calidez y conexión social y hace que el mensaje se sienta personal, no un sermón."}, {"momento": "15.1–18.0 · 'si el niño llora, le pones un móvil y ya no molesta'", "mecanismo": "Polarización suave → comentarios", "explicacion": "Toca un tema en el que todo el mundo tiene opinión (crianza y pantallas), sin atacar a nadie en concreto. Unos se sienten aludidos y otros quieren darle la razón: los dos comentan."}, {"momento": "18.1–25.7 · 'las pantallas no son el problema. El problema es que no sabemos vivir sin ellas'", "mecanismo": "Error de predicción / reencuadre", "explicacion": "El espectador espera el discurso típico contra las pantallas y recibe lo contrario. Esa sorpresa (error de predicción → pico de dopamina) hace la frase memorable y le devuelve la responsabilidad sin culparle."}, {"momento": "26.1–31.0 · 'Así que estoy probando algo… dos horas en la bici, sin música, sin móvil'", "mecanismo": "Bucle abierto + prueba personal", "explicacion": "'Estoy probando algo' abre una pregunta ('¿y qué pasó?') que mantiene viendo durante la segunda mitad. Que lo haya hecho él, con una cifra concreta (2 horas), da credibilidad y lo vuelve imitable."}, {"momento": "34.5–35.6 · 'como esta mancha, o esto' (corte a una mancha y a un dibujo en la pared)", "mecanismo": "Error de predicción + humor → revisionado", "explicacion": "Después de un discurso profundo, enseña algo ridículamente trivial. El contraste hace gracia, rompe la seriedad justo antes del cierre y engancha a quien lo vuelve a ver para fijarse en esos detalles. 'Contando ovejitas' remata el mismo efecto."}], "caption": "abúrrete un poco más :)\n\n#inspiracion #aburrirse #deporte #superacion", "cta": "Sin CTA explícita. El cierre ('también te pierdes lo que tienes dentro') y el caption ('abúrrete un poco más :)') invitan a probarlo.", "titulo_lucas": "Ya no sé aburrirme (tirada en silencio)", "texto_pantalla_lucas": "Sin gancho escrito, igual que el original: solo subtítulos palabra a palabra. Si quieres portada: 'ya no sé aburrirme'.", "guion_lucas": [{"texto": "Ya no sé aburrirme. Y no soy el único, lo sé, lo veo.", "plano": "GRABAR: tirado en el sofá sin camiseta y con los cascos puestos, mirando al techo con cara de vacío y suspirando. Plano fijo, 3 s.", "nota": "Lento y con desgana, como con un suspiro."}, {"texto": "No puedo estar ni un minuto sin hacer nada.", "plano": "GRABAR: primer plano de tu mano cogiendo el móvil o el mando del sofá en cuanto lo sueltas (1 s) + pantalla de la tele o del móvil haciendo scroll (1 s)."}, {"texto": "No puedo ir al baño sin el móvil, o andar sin música.", "plano": "GRABAR: detalle del móvil apoyado junto al rollo de papel del baño (1 s) → recursos/running/2025-06-04_selfie-correr-pasarela-dunas-atardecer_sin-camiseta.MOV @ 1–3 (con los AirPods)", "nota": "Con gracia en 'al baño'."}, {"texto": "Y no es que esté mal en sí, pero echo de menos no saber qué hacer, como cuando era pequeño.", "plano": "recursos/lifestyle/2025-06-27_cafe-chiringuito-playa_sin-camiseta.MOV @ 0–4 (café tranquilo, sin móvil)"}, {"texto": "Recuerdo que [tu recuerdo de pequeño, p. ej. 'bajaba a la calle a buscar a alguien para jugar a lo que fuera'].", "plano": "recursos/aire-libre/2026-04-27_colgado-barras-playa-riendo_gorra-gris_sin-camiseta.MOV @ 0–3,5 (colgado y riéndose, como un crío)", "nota": "Pon un recuerdo tuyo real. Cuanto más concreto, mejor."}, {"texto": "Hoy en día, si un niño llora, le pones un móvil y ya no molesta.", "plano": "STOCK: niño pequeño mirando un móvil o una tablet en el sofá o en un restaurante (Pexels: 'child phone screen' / 'kid tablet')", "nota": "Neutro, sin juzgar en el tono."}, {"texto": "Y es fácil echarle la culpa a las pantallas,", "plano": "recursos/lifestyle/2026-09-24_andando-con-portatil-paseo-soleado_tirantes-negra.MOV @ 8–11 (andando con el portátil abierto)"}, {"texto": "pero las pantallas no son el problema. El problema es que no sabemos vivir sin ellas.", "plano": "recursos/lifestyle/2026-09-24_andando-con-portatil-paseo-soleado_tirantes-negra.MOV @ 17–20 (se va de espaldas) → recursos/running/2024-12-11_selfie-hablando-carril-bici-nublado_sudadera-asics-azul-marino.MOV @ 4–7 (cielo gris y dunas, plano quieto sin ti, como el de la lluvia)", "nota": "Pausa de 0,3 s antes de 'El problema es…' y recálcalo."}, {"texto": "Así que estoy probando algo.", "plano": "recursos/gym/fisico/2026-11-01_hibrido_intro-sentado-cajon-nike-strength.mov @ 5,6–8 (se ata las zapatillas)"}, {"texto": "El otro día salí a correr [cuánto: p. ej. 'dos horas' / 'X km'], sin música, sin reloj, en silencio.", "plano": "recursos/running/2026-03-17_correr-amanecer-pa
